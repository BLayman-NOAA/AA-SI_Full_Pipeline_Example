# Processing level 2b, user: window selection, masking and noise removal.
# Starts from the shared survey Sv store of processing_lvl_2_survey.yaml and
# narrows it to this user's segment.
#
#   select_window -> detect_seafloor -> seafloor/surface masks
#                 -> combine -> apply_mask -> rechunk -> remove_noise
#
# select_window comes first so only the steps below it are re-keyed per
# window; levels 1 and 2a keep one hash across all users. No map_over here:
# the per-file fan-out ended at the survey merge.

recipe:
  name: "processing_lvl_2_user"
  description: "Select a ping_time window from the survey Sv, then mask and denoise it."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  survey_sv:
    type: dataset
    description: >
      Merged, chunked survey-wide Sv from the shared survey level, which this
      segment selects its pings from.
  file_time_start:
    type: str
    required: false
    description: >
      Inclusive ISO UTC datetime start of this analysis segment. Selects its
      pings from the shared survey Sv and the seabed line files to read; unset
      leaves the start open.
  file_time_end:
    type: str
    required: false
    description: >
      Inclusive ISO UTC datetime end of this analysis segment. Selects its
      pings from the shared survey Sv and the seabed line files to read; unset
      leaves the end open.
  seabed_line_folder:
    type: path
    description: >
      Folder of Echoview .evl seabed line exports, a local path or a gs:// URL.
      The files covering the time window are combined into the seafloor; a
      single .evl file is read whole.
  seabed_line_max_gap_s:
    type: float
    default: 600
    description: >
      Widest gap in the combined seabed line, in seconds, to interpolate
      across; pings in a wider gap get no seafloor. Only a break between
      survey legs is this wide.
  seabed_line_min_coverage:
    type: float
    default: 0.99
    description: >
      Fraction of the window's pings (0 to 1) the seabed line must cover, or
      the step fails. Lower it or widen the window rather than let uncovered
      pings through, since all their samples are masked.
  surface_mask_depth:
    type: float
    default: 10.0
    description: >
      Range from the transducer, in metres, above which samples are masked, to
      remove the transmit pulse and ringdown.
  seafloor_buffer_m:
    type: float
    default: 1.0
    description: >
      Height above the seabed line, in metres, that is also masked, to drop the
      bottom echo and detection error.
  noise_range_sample_num:
    type: int
    default: 10
    description: "Range samples per bin for the background noise estimate."
  noise_ping_num:
    type: int
    default: 5
    description: "Pings per bin for the background noise estimate."
  noise_chunk_ping_time:
    type: int
    default: 1000
    description: >
      Ping-time chunk size set before noise removal, so the noise estimate runs
      in dask chunks rather than as one in-memory block. Keep it a multiple of
      noise_ping_num.

steps:

  # The user's entry point into the shared survey store.
  - id: select_window
    op: select_ping_time_range
    checkpoint: always
    inputs:
      ds_Sv: ${inputs.survey_sv}
    params:
      start: ${inputs.file_time_start}
      end: ${inputs.file_time_end}

  - id: detect_seafloor
    op: read_seafloor_line
    checkpoint: save
    inputs:
      ds_Sv: ${select_window.ds_Sv}
    params:
      evl_path: ${inputs.seabed_line_folder}
      # The same window that selected the pings, so the line spans them.
      file_time_start: ${inputs.file_time_start}
      file_time_end: ${inputs.file_time_end}
      # No extrapolation past the line's ends. Uncovered pings would be masked
      # away entirely, so min_coverage fails the run instead.
      edge_extend_s: 0.0
      max_gap_s: ${inputs.seabed_line_max_gap_s}
      min_coverage: ${inputs.seabed_line_min_coverage}

  # ds_Sv must carry 'depth' to match the surface-referenced line, or the mask
  # comes out offset by the transducer depth. The survey store has it.
  - id: create_seafloor_mask
    op: create_seafloor_mask
    inputs:
      ds_Sv: ${select_window.ds_Sv}
      seafloor_depth: ${detect_seafloor.seafloor_depth}
    params:
      seafloor_buffer_m: ${inputs.seafloor_buffer_m}

  # create_surface_mask always compares against echo_range.
  - id: create_surface_mask
    op: create_surface_mask
    inputs:
      ds_Sv: ${select_window.ds_Sv}
    params:
      surface_depth_m: ${inputs.surface_mask_depth}

  - id: combine_masks
    op: combine_masks
    inputs:
      masks:
        - ${create_seafloor_mask.mask}
        - ${create_surface_mask.mask}
    params:
      mode: "and"

  - id: apply_mask
    op: apply_sv_mask
    inputs:
      ds_Sv: ${select_window.ds_Sv}
      mask: ${combine_masks.mask}

  - id: rechunk_before_noise
    op: rechunk_dataset
    inputs:
      ds_Sv: ${apply_mask.ds_Sv}
    params:
      ping_time_chunk: ${inputs.noise_chunk_ping_time}

  - id: remove_noise
    op: remove_background_noise
    checkpoint: always
    inputs:
      ds_Sv: ${rechunk_before_noise.ds_Sv}
    params:
      range_sample_num: ${inputs.noise_range_sample_num}
      ping_num: ${inputs.noise_ping_num}
      # Must be a dB string, not a bare number. Lower it to keep more weak data.
      # SNR_threshold: "0dB"
