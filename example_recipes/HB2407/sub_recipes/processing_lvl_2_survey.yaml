# Processing level 2a (survey): per-file Sv and depth, then the survey fan-in.
#
# The survey half of level 2, and the boundary of the shared artifact. It runs
# once per cruise; every user recipe includes it verbatim, hits the cache, and
# picks up from merge_survey_sv.
#
#   [per file] compute_sv -> compute_transducer_depth -> ep_add_depth
#              -> crop_range
#   [fan-in]   merge_survey_sv, concat along ping_time
#   [survey]   rechunk_survey_sv, the shared chunked Sv store
#
# The merge sits after ep_add_depth because everything above it is a property of
# the raw data and its calibration, not something an analyst varies, and because
# the depth steps need this file's EchoData. Seabed detection, masking, noise
# removal and MVBS live in processing_lvl_2_user.yaml and below.
#
# The crop runs per file with a fixed ceiling. Concatenating along ping_time
# needs every segment to share a range_sample length, and the data-driven crop
# modes would each pick a different depth per file, leaving merge_datasets to
# NaN-pad the difference into echo_range.
#
# ep_add_splitbeam_angle is omitted: HB2407's calibration mapping carries no
# angle_sensitivity, so echopype raises TypeError, and nothing downstream uses
# split-beam angles.
#
# Must be included immediately after processing_lvl_1_survey.yaml: its steps
# continue that file's mapped chain.

recipe:
  name: "processing_lvl_2_survey"
  description: "Per-file Sv and depth, fan-in to the shared survey Sv store."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  echodata:
    type: echodata
    description: "Per-file EchoData object from the survey raw ingest stage."
  cal_params:
    type: dict
    description: "Calibration parameters selected for this file."
  env_params:
    type: dict
    description: "Environmental parameters selected for this file."
  datum_correction_m:
    type: float
    default: 0.0
    description: >
      Metres added to the file's recorded drop keel offset to reach depth below
      the waterline. 0 takes the recorded offset as already waterline referenced.
  use_heave:
    type: bool
    default: true
    description: "Add the per-ping platform heave term to transducer depth."
  heave_sign:
    type: float
    default: 1.0
    description: >
      Sign applied to platform heave. Determined empirically for this survey by
      correlating raw heave against the hand-verified EVL seabed line (0.14 m
      residual for +1.0 vs 0.75 m for -1.0).
  crop_max_range_m:
    type: float
    default: 250.0
    description: >
      Fixed range ceiling, in metres, applied per file before the merge. Must
      be a constant, not derived from the data, or files end up with different
      range_sample lengths. Pick it from the deepest seabed anywhere in the
      survey plus a margin -- the .evl line files give you that without reading
      any Sv. Too shallow silently discards real echoes, so check the step's
      reported "deepest kept" against the seabed line.
  survey_chunk_ping_time:
    type: int
    default: 2000
    description: >
      Ping-time chunk size of the shared survey Sv store, and therefore the
      granularity a user's select_ping_time_range reads at. Set it near the
      window users typically ask for: a 15-raw-file segment is roughly 42000
      pings, so 2000 makes such a window about 21 chunks. Larger chunks mean
      fewer, bigger reads and more read amplification on a narrow window.

steps:

  # Per-file chain, continuing the map_over from level 1.

  - id: compute_sv
    op: compute_sv
    map_over: ${initial_setup.raw_file_paths}
    checkpoint: always
    inputs:
      echodata: ${inputs.echodata}
      cal_params: ${inputs.cal_params}
      env_params: ${inputs.env_params}
      waveform_mode: "CW"
      encode_mode: "power"

  - id: compute_transducer_depth
    op: compute_transducer_depth
    map_over: ${initial_setup.raw_file_paths}
    checkpoint: always
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
      echodata: ${inputs.echodata}
    params:
      datum_correction_m: ${inputs.datum_correction_m}
      use_heave: ${inputs.use_heave}
      heave_sign: ${inputs.heave_sign}

  - id: ep_add_depth
    op: ep_add_depth
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
      echodata: ${inputs.echodata}
    params:
      depth_offset: ${compute_transducer_depth.transducer_depth}

  # Fixed ceiling only, see the header.
  - id: crop_survey_range
    op: crop_range
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      ds_Sv: ${ep_add_depth.ds_Sv}
    params:
      max_range_m: ${inputs.crop_max_range_m}
      drop_trailing_all_nan: false

  # Fan-in: the shared survey artifact.

  - id: merge_survey_sv
    op: merge_datasets
    collect: ${crop_survey_range.ds_Sv}
    inputs:
      datasets: ${crop_survey_range.ds_Sv}
    params:
      dim: "ping_time"

  # Chunked along ping_time and checkpointed: this is the store users read. The
  # write streams chunk by chunk, so building it does not need the survey in
  # memory.
  - id: rechunk_survey_sv
    op: rechunk_dataset
    checkpoint: always
    inputs:
      ds_Sv: ${merge_survey_sv.merged}
    params:
      ping_time_chunk: ${inputs.survey_chunk_ping_time}
