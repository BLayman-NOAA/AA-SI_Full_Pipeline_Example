# HB2407 Herring 11-06, per-raw-file pipeline with two-pass Sv-filtered clustering.
#
# Each raw file is read, calibrated, Sv-computed and masked on its own, and
# merge_sv reassembles the survey before background noise removal. Levels 3 and
# 4 are survey-wide.
#
# Usage:
#   aa-recipe run Herring_11-06_per_file_sv_filter.yaml
#   aa-recipe run Herring_11-06_per_file_sv_filter.yaml --executor dask

recipe:
  name: "herring_11_06_per_file_sv_filter"
  description: "HB2407 Herring 11-06 per-raw-file pipeline with two-pass Sv-filtered clustering."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  raw_input_folder:
    type: path
    fingerprint_mode: auto
  cal_input_folder:
    type: path
    default: "./HB2407_calibration_files"
  seabed_line_folder:
    type: path
    default: "gs://ggn-nmfs-aa-prod-1-data/HDD/Henry_B_Bigelow/HB2407/Auxiliary/EV_seabedlines"

  # Data time range. Selects the raw files to process and the Echoview seabed
  # line exports to read, and sets the fan-out width: one chain instance per
  # selected raw file.
  file_time_start:
    type: str
    default: "2024-11-06T09:02:05"
  file_time_end:
    type: str
    default: "2024-11-06T14:24:05"

  # Default display window shared by every plotting step in this pipeline
  # You can override these by hardcoding values for a specific step or sub-recipe
  min_depth:
    type: float
    default: 0
  max_depth:
    type: float
    # default: 50
  # No defaults span the whole time range. Set either to a UTC timestamp, like
  # the file_time_start/file_time_end above, to window the echograms.
  time_min:
    type: str
    # default: "2024-10-15T00:00"
  time_max:
    type: str
    # default: "2024-10-15T01:00"
  x_axis_units:
    type: str
    default: "datetime"
  y_axis_units:
    type: str
    default: "meters"


steps:

  - include: sub_recipes/processing_lvl_1_per_file.yaml
    input_overrides:
      raw_input_folder: ${inputs.raw_input_folder}
      cal_input_folder: ${inputs.cal_input_folder}
      file_time_start: ${inputs.file_time_start}
      file_time_end: ${inputs.file_time_end}
      cruise_id: "HB2407"
      record_author: "<Your Name>"
      sonar_model: "EK80"

  # Must follow level 1 directly: it continues the same mapped chain.
  - include: sub_recipes/processing_lvl_2_per_file.yaml
    input_overrides:
      echodata: ${combine_raw.echodata}
      cal_params: ${extract_cal_params.cal_params}
      env_params: ${extract_cal_params.env_params}
      # Transducer depth comes from each file's drop keel offset plus heave.
      # datum_correction_m assumes that offset is waterline referenced.
      datum_correction_m: -1.0
      use_heave: true
      heave_sign: 1.0
      # surface mask
      surface_mask_depth: 5.0
      seafloor_buffer_m: 1
      # Range crop by outlier rejection, so one anomalously deep ping does not
      # hold the range axis open. Add crop_max_range_m for a hard ceiling.
      crop_outlier_sigma: 3.0
      crop_outlier_margin: 1.5
      # parameters for echopype's remove_background_noise
      noise_ping_num: 5
      noise_range_sample_num: 10
      seabed_line_folder: ${inputs.seabed_line_folder}
      file_time_start: ${inputs.file_time_start}
      file_time_end: ${inputs.file_time_end}

  - id: plot_sv_clean
    op: plot_sv_echogram
    regenerate: if-missing
    inputs:
      ds_Sv: ${remove_noise.ds_Sv}
    params:
      min_depth: ${inputs.min_depth}
      max_depth: ${inputs.max_depth}
      time_min: ${inputs.time_min}
      time_max: ${inputs.time_max}
      x_axis_units: ${inputs.x_axis_units}
      y_axis_units: ${inputs.y_axis_units}
      dpi: 100

  - include: sub_recipes/processing_lvl_3.yaml
    input_overrides:
      sv_clean_unmasked: ${remove_noise.ds_Sv}
      # MVBS bin size:
      range_bin: "4m"
      ping_time_bin: "4s"
      nan_threshold: 0.95 # mask bin if NAN's exceed this fraction of data in the cell

  - id: plot_mvbs
    op: plot_sv_echogram
    regenerate: if-missing
    inputs:
      ds_Sv: ${compute_mvbs.ds_MVBS}
      ds_Sv_source: ${mask_sparse.ds_Sv}
    params:
      min_depth: ${inputs.min_depth}
      max_depth: ${inputs.max_depth}
      time_min: ${inputs.time_min}
      time_max: ${inputs.time_max}
      x_axis_units: ${inputs.x_axis_units}
      y_axis_units: ${inputs.y_axis_units}
      dpi: 50

  # echodata and seafloor_depth are left unwired. Level 4 only needs them for
  # the 'seafloor_depth' and 'altitude' features, which features: [cell_cv]
  # does not use, and this pipeline builds no survey-wide EchoData. To use them,
  # collect the per-file lines with a merge_datasets step and wire that here.
  - include: sub_recipes/processing_lvl_4_sv_filter.yaml
    input_overrides:
      mvbs: ${compute_mvbs.ds_MVBS}
      sv_clean_unmasked: ${remove_noise.ds_Sv}
      cell_stats_sv: ${compute_cell_stats.ds_Sv}
      min_depth: ${inputs.min_depth}
      max_depth: ${inputs.max_depth}
      ping_min: ${inputs.ping_min}
      ping_max: ${inputs.ping_max}
      x_axis_units: ${inputs.x_axis_units}
      y_axis_units: ${inputs.y_axis_units}
      hdbscan_min_cluster_size_fraction: .005
      hdbscan_min_samples: 4
      hdbscan_cluster_selection_method: "eom"
      hdbscan_sample_size: 10000000