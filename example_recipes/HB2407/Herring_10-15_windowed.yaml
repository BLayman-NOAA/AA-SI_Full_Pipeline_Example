# HB2407 Herring 10-15, analysis over a window of the shared survey Sv store.
#
# The user half of the survey/user split. Levels 1 and 2a are included verbatim
# from survey_preprocess.yaml so they hash identically and come back as cache
# hits, select_window narrows the shared store to this analyst's segment, and
# everything below that is this analyst's own parameters.
#
# Keep the two survey-level includes byte-identical to survey_preprocess.yaml
# and never pass them ${inputs.file_time_start}: a window wired in that high
# re-keys every checkpoint below it and the shared store gets rebuilt per
# analyst. The window belongs on select_window and nowhere else.
#
# Usage:
#   aa-recipe run Herring_10-15_windowed.yaml --survey-cache-dir gs://.../survey_cache

recipe:
  name: "herring_10_15_windowed"
  description: "HB2407 Herring 10-15 analysis over a window of the shared survey Sv store."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  # Survey-level. Must match survey_preprocess.yaml.
  raw_input_folder:
    type: path
    fingerprint_mode: auto
  cal_input_folder:
    type: path
    default: "./HB2407_calibration_files"
  crop_max_range_m:
    type: float
    default: 250.0
  survey_chunk_ping_time:
    type: int
    default: 2000

  # User-level. Vary these freely; nothing above is affected.
  seabed_line_folder:
    type: path
    default: "gs://ggn-nmfs-aa-prod-1-data/HDD/Henry_B_Bigelow/HB2407/Auxiliary/EV_seabedlines"

  # This analyst's segment. Selects the ping_time window out of the shared
  # store and the .evl line files to read.
  file_time_start:
    type: str
    default: "2024-10-15T13:38:52"
  file_time_end:
    type: str
    default: "2024-10-15T23:43:36"

  # Default display window shared by every plotting step in this pipeline.
  min_depth:
    type: float
    default: 0
  max_depth:
    type: float
    default: 25
  # No defaults span the whole time range. Set either to a UTC timestamp, like
  # the file_time_start/file_time_end above, to window the echograms.
  time_min:
    type: str
    # default: "2024-10-15T00:00"
  time_max:
    type: str
    # default: "2024-10-15T01:00"
  x_axis_units:
    type: str
    default: "datetime"
  y_axis_units:
    type: str
    default: "meters"


steps:

  # Survey level. Keep byte-identical to survey_preprocess.yaml, with no
  # ${inputs.file_time_start} anywhere in these two blocks.

  - include: sub_recipes/processing_lvl_1_survey.yaml
    input_overrides:
      raw_input_folder: ${inputs.raw_input_folder}
      cal_input_folder: ${inputs.cal_input_folder}
      cruise_id: "HB2407"
      record_author: "<Your Name>"
      sonar_model: "EK80"

  - include: sub_recipes/processing_lvl_2_survey.yaml
    input_overrides:
      echodata: ${combine_raw.echodata}
      cal_params: ${extract_cal_params.cal_params}
      env_params: ${extract_cal_params.env_params}
      datum_correction_m: -1.0
      use_heave: true
      heave_sign: 1.0
      crop_max_range_m: ${inputs.crop_max_range_m}
      survey_chunk_ping_time: ${inputs.survey_chunk_ping_time}

  # User level. The window enters here and nowhere above.

  - include: sub_recipes/processing_lvl_2_user.yaml
    input_overrides:
      survey_sv: ${rechunk_survey_sv.ds_Sv}
      file_time_start: ${inputs.file_time_start}
      file_time_end: ${inputs.file_time_end}
      seabed_line_folder: ${inputs.seabed_line_folder}
      surface_mask_depth: 5.0
      seafloor_buffer_m: 1
      noise_ping_num: 5
      noise_range_sample_num: 10

  - id: plot_sv_clean
    op: plot_sv_echogram
    regenerate: if-missing
    inputs:
      ds_Sv: ${remove_noise.ds_Sv}
    params:
      min_depth: ${inputs.min_depth}
      max_depth: ${inputs.max_depth}
      time_min: ${inputs.time_min}
      time_max: ${inputs.time_max}
      x_axis_units: ${inputs.x_axis_units}
      y_axis_units: ${inputs.y_axis_units}
      dpi: 100

  - include: sub_recipes/processing_lvl_3.yaml
    input_overrides:
      sv_clean_unmasked: ${remove_noise.ds_Sv}
      # MVBS bin size:
      range_bin: "2m"
      ping_time_bin: "2s"
      nan_threshold: 0.95 # mask bin if NAN's exceed this fraction of data in the cell

  - id: plot_mvbs
    op: plot_sv_echogram
    regenerate: if-missing
    inputs:
      ds_Sv: ${compute_mvbs.ds_MVBS}
      ds_Sv_source: ${mask_sparse.ds_Sv}
    params:
      min_depth: ${inputs.min_depth}
      max_depth: ${inputs.max_depth}
      time_min: ${inputs.time_min}
      time_max: ${inputs.time_max}
      x_axis_units: ${inputs.x_axis_units}
      y_axis_units: ${inputs.y_axis_units}
      dpi: 50

  # echodata and seafloor_depth are left unwired: level 4 only needs them for
  # the 'seafloor_depth' and 'altitude' features, which features: [cell_cv]
  # does not use. detect_seafloor is survey-wide here, so
  # ${detect_seafloor.seafloor_depth} can be wired in directly if you want them.
  - include: sub_recipes/processing_lvl_4.yaml
    input_overrides:
      mvbs: ${compute_mvbs.ds_MVBS}
      overlay_line_var: "sw_dive_profile"
      sv_clean_unmasked: ${remove_noise.ds_Sv}
      cell_stats_sv: ${compute_cell_stats.ds_Sv}
      min_depth: ${inputs.min_depth}
      max_depth: ${inputs.max_depth}
      time_min: ${inputs.time_min}
      time_max: ${inputs.time_max}
      x_axis_units: ${inputs.x_axis_units}
      y_axis_units: ${inputs.y_axis_units}
      # HDBSCAN tuning
      hdbscan_min_cluster_size_fraction: 0.001
      hdbscan_min_samples: 7
      hdbscan_cluster_selection_method: "eom"
