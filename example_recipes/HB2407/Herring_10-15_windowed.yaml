# HB2407 Herring 10-15, analysis over a window of the shared survey Sv store.
# Levels 1 and 2a are included as in survey_preprocess.yaml, so they hash
# identically and come back as cache hits; select_window narrows the shared
# store to this analyst's segment.
#
# Never pass the survey-level includes ${inputs.file_time_start}: a window
# wired in that high re-keys every checkpoint below it and the shared store is
# rebuilt per analyst.
#
# Usage:
#   aa-recipe run Herring_10-15_windowed.yaml --survey-cache-dir gs://.../survey_cache

recipe:
  name: "herring_10_15_windowed"
  description: "HB2407 Herring 10-15 analysis over a window of the shared survey Sv store."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  # Survey-level. Must match survey_preprocess.yaml.
  raw_input_folder:
    type: path
    fingerprint_mode: auto
    description: "Folder of raw .raw files, a local path or a gs:// URL."
  cal_input_folder:
    type: path
    default: "./HB2407_calibration_files"
    description: >
      Folder of manufacturer calibration files (.cal for EK60, .xml for EK80),
      a local path or a gs:// URL.
  crop_max_range_m:
    type: float
    default: 250.0
    description: >
      Range ceiling in metres; samples beyond it are dropped even if they hold
      data. With other crop criteria set, the shallowest cut wins. Unset
      derives the crop from the data.
  survey_chunk_ping_time:
    type: int
    default: 2000
    description: >
      Ping-time chunk size of the shared survey store, which sets the
      granularity a window reads at. Size it near the window users usually ask
      for.

  # User-level. Vary these freely; nothing above is affected.
  seabed_line_folder:
    type: path
    default: "gs://ggn-nmfs-aa-prod-1-data/HDD/Henry_B_Bigelow/HB2407/Auxiliary/EV_seabedlines"
    description: >
      Folder of Echoview .evl seabed line exports, a local path or a gs://
      URL. The files covering the time window are combined into the seafloor;
      a single .evl file is read whole.

  # This analyst's segment. Bound the pings, not the filename stamps: the last
  # file runs about 55 minutes past its own stamp.
  file_time_start:
    type: str
    default: "2024-10-15T13:38:52"
    description: >
      Inclusive ISO UTC datetime start of this analysis segment. Selects its
      pings from the shared survey Sv and the seabed line files to read; unset
      leaves the start open.
  file_time_end:
    type: str
    default: "2024-10-15T23:43:36"
    description: >
      Inclusive ISO UTC datetime end of this analysis segment. Selects its
      pings from the shared survey Sv and the seabed line files to read; unset
      leaves the end open.

  # Display window shared by every plotting step; hardcode a value in a step
  # or sub-recipe to override it there.
  min_depth:
    type: float
    default: 0
    description: "Shallowest depth shown on the echograms, in metres."
  max_depth:
    type: float
    default: 25
    description: >
      Deepest depth shown on the echograms, in metres. Unset uses the deepest
      depth in the data.
  time_min:
    type: str
    # default: "2024-10-15T00:00"
    description: >
      Start of the echogram window, as a UTC timestamp such as
      "2024-10-15T12:30". Unset starts at the first ping.
  time_max:
    type: str
    # default: "2024-10-15T01:00"
    description: >
      End of the echogram window, as a UTC timestamp such as
      "2024-10-15T12:30". Unset runs to the last ping.
  x_axis_units:
    type: str
    default: "datetime"
    description: >
      Echogram x axis: "datetime" (UTC clock time), "seconds" from the first
      ping shown, "pings", "meters" travelled, or "bins" (MVBS only).
  y_axis_units:
    type: str
    default: "meters"
    description: >
      Echogram y axis: "meters", "range_sample", or "bins" (MVBS only).


steps:

  # Survey level. Keep these two includes identical to survey_preprocess.yaml.

  - include: sub_recipes/processing_lvl_1_survey.yaml
    input_overrides:
      raw_input_folder: ${inputs.raw_input_folder}
      cal_input_folder: ${inputs.cal_input_folder}
      cruise_id: "HB2407"
      record_author: "<Your Name>"
      sonar_model: "EK80"

  - include: sub_recipes/processing_lvl_2_survey.yaml
    input_overrides:
      echodata: ${combine_raw.echodata}
      cal_params: ${extract_cal_params.cal_params}
      env_params: ${extract_cal_params.env_params}
      datum_correction_m: -1.0
      use_heave: true
      heave_sign: 1.0
      crop_max_range_m: ${inputs.crop_max_range_m}
      survey_chunk_ping_time: ${inputs.survey_chunk_ping_time}

  # User level. The window enters here and nowhere above.

  - include: sub_recipes/processing_lvl_2_user.yaml
    input_overrides:
      survey_sv: ${rechunk_survey_sv.ds_Sv}
      file_time_start: ${inputs.file_time_start}
      file_time_end: ${inputs.file_time_end}
      seabed_line_folder: ${inputs.seabed_line_folder}
      surface_mask_depth: 5.0
      seafloor_buffer_m: 1
      noise_ping_num: 5
      noise_range_sample_num: 10

  - id: plot_sv_clean
    op: plot_sv_echogram
    regenerate: if-missing
    inputs:
      ds_Sv: ${remove_noise.ds_Sv}
    params:
      min_depth: ${inputs.min_depth}
      max_depth: ${inputs.max_depth}
      time_min: ${inputs.time_min}
      time_max: ${inputs.time_max}
      x_axis_units: ${inputs.x_axis_units}
      y_axis_units: ${inputs.y_axis_units}
      dpi: 100

  - include: sub_recipes/processing_lvl_3.yaml
    input_overrides:
      sv_clean_unmasked: ${remove_noise.ds_Sv}
      # MVBS bin size:
      range_bin: "2m"
      ping_time_bin: "2s"
      nan_threshold: 0.95

  - id: plot_mvbs
    op: plot_sv_echogram
    regenerate: if-missing
    inputs:
      ds_Sv: ${compute_mvbs.ds_MVBS}
      ds_Sv_source: ${mask_sparse.ds_Sv}
    params:
      min_depth: ${inputs.min_depth}
      max_depth: ${inputs.max_depth}
      time_min: ${inputs.time_min}
      time_max: ${inputs.time_max}
      x_axis_units: ${inputs.x_axis_units}
      y_axis_units: ${inputs.y_axis_units}
      dpi: 50

  # echodata and seafloor_depth stay unwired: features: [cell_cv] needs neither.
  # detect_seafloor is not mapped here, so its seafloor_depth can be wired directly.
  - include: sub_recipes/processing_lvl_4.yaml
    input_overrides:
      mvbs: ${compute_mvbs.ds_MVBS}
      overlay_line_var: "sw_dive_profile"
      sv_clean_unmasked: ${remove_noise.ds_Sv}
      cell_stats_sv: ${compute_cell_stats.ds_Sv}
      min_depth: ${inputs.min_depth}
      max_depth: ${inputs.max_depth}
      time_min: ${inputs.time_min}
      time_max: ${inputs.time_max}
      x_axis_units: ${inputs.x_axis_units}
      y_axis_units: ${inputs.y_axis_units}
      # HDBSCAN tuning
      hdbscan_min_cluster_size_fraction: 0.001
      hdbscan_min_samples: 7
      hdbscan_cluster_selection_method: "eom"
