# HB2407 survey pre-processing: build the shared Sv store.
# Runs levels 1 and 2a only: one chunked, survey-wide Sv store that every user
# recipe starts from. Anything an analyst varies belongs in a user recipe, see
# Herring_10-15_windowed.yaml. There is no user time window on purpose: one
# wired into initial_setup re-keys every downstream checkpoint.
#
# Publish to the shared cache tier so user runs read it:
#   aa-recipe run survey_preprocess.yaml --cache-write-tier survey
#
# Run it where the bucket is. A survey-scale store over a slow uplink takes days.

recipe:
  name: "hb2407_survey_preprocess"
  description: "HB2407 survey-wide Sv store: per-file calibration and depth, merged and chunked."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  # fingerprint_mode: auto hashes the folder's contents, not its location, so a
  # local copy and the gs:// original give the same survey hash.
  raw_input_folder:
    type: path
    fingerprint_mode: auto
    description: "Folder of raw .raw files, a local path or a gs:// URL."
  cal_input_folder:
    type: path
    default: "./HB2407_calibration_files"
    description: >
      Folder of manufacturer calibration files (.cal for EK60, .xml for EK80),
      a local path or a gs:// URL.

  # Check a new ceiling against the .evl line files so it stays clear of the
  # deepest seabed.
  crop_max_range_m:
    type: float
    default: 250.0
    description: >
      Range ceiling in metres; samples beyond it are dropped even if they hold
      data. With other crop criteria set, the shallowest cut wins. Unset
      derives the crop from the data.

  survey_chunk_ping_time:
    type: int
    default: 2000
    description: >
      Ping-time chunk size of the shared survey store, which sets the
      granularity a window reads at. Size it near the window users usually ask
      for.

steps:

  - include: sub_recipes/processing_lvl_1_survey.yaml
    input_overrides:
      raw_input_folder: ${inputs.raw_input_folder}
      cal_input_folder: ${inputs.cal_input_folder}
      cruise_id: "HB2407"
      record_author: "<Your Name>"
      sonar_model: "EK80"

  - include: sub_recipes/processing_lvl_2_survey.yaml
    input_overrides:
      echodata: ${combine_raw.echodata}
      cal_params: ${extract_cal_params.cal_params}
      env_params: ${extract_cal_params.env_params}
      datum_correction_m: -1.0
      use_heave: true
      heave_sign: 1.0
      crop_max_range_m: ${inputs.crop_max_range_m}
      survey_chunk_ping_time: ${inputs.survey_chunk_ping_time}
