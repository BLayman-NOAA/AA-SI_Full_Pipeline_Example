# HB2407 survey pre-processing: build the shared Sv store.
#
# Runs levels 1 and 2a only, producing one chunked, survey-wide Sv store that
# every user recipe starts from. Slow and run rarely; the user recipes that read
# it are fast. Everything here is a property of the raw data and its
# calibration. Anything an analyst would vary (seabed detection, masking, noise
# removal, MVBS, ML) belongs in a user recipe, see Herring_10-15_windowed.yaml.
#
# There is no user time window on purpose: one wired into initial_setup re-keys
# every downstream checkpoint, so no two analysts would share cached work.
#
# Publish to the shared cache tier so user runs read it:
#   aa-recipe run survey_preprocess.yaml --cache-write-tier survey
#
# Run it where the bucket is. A survey-scale store over a slow uplink takes days.

recipe:
  name: "hb2407_survey_preprocess"
  description: "HB2407 survey-wide Sv store: per-file calibration and depth, merged and chunked."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  # fingerprint_mode: auto hashes the folder's contents rather than its
  # location, so a local copy and the gs:// original give the same survey hash.
  raw_input_folder:
    type: path
    fingerprint_mode: auto
  cal_input_folder:
    type: path
    default: "./HB2407_calibration_files"

  # Fixed range ceiling. Every file crops to the same depth so they share a
  # range_sample length and concatenate without NaN padding. Check a new value
  # against the .evl line files so it stays clear of the deepest seabed.
  crop_max_range_m:
    type: float
    default: 250.0

  # Chunking of the shared store, and therefore the granularity a user's window
  # reads at.
  survey_chunk_ping_time:
    type: int
    default: 2000

steps:

  - include: sub_recipes/processing_lvl_1_survey.yaml
    input_overrides:
      raw_input_folder: ${inputs.raw_input_folder}
      cal_input_folder: ${inputs.cal_input_folder}
      cruise_id: "HB2407"
      record_author: "<Your Name>"
      sonar_model: "EK80"

  - include: sub_recipes/processing_lvl_2_survey.yaml
    input_overrides:
      echodata: ${combine_raw.echodata}
      cal_params: ${extract_cal_params.cal_params}
      env_params: ${extract_cal_params.env_params}
      # Transducer depth comes from each file's drop keel offset plus heave.
      # datum_correction_m assumes that offset is waterline referenced.
      datum_correction_m: -1.0
      use_heave: true
      heave_sign: 1.0
      crop_max_range_m: ${inputs.crop_max_range_m}
      survey_chunk_ping_time: ${inputs.survey_chunk_ping_time}
