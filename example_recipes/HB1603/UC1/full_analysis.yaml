# HB1603 full dive-profile analysis: 13 dives, one clustering, per-dive codes.
#
# The production run of the investigation. Every localized HB1603 sperm whale
# dive but one is cut out of a shared survey store, pooled into one HDBSCAN
# clustering, and projected back onto each dive as per-ping SVCodes and the
# NEFSC report's depth-interval duration tables.
#
#   survey tier   calibration scanned in place from NCEI, per-file Sv, then
#                 per-file masking and binning onto one pinned depth grid,
#                 fanned in to the shared store        [sub_recipes, shared]
#   plan          read the dive configs, keep the 13 named below
#   user tier     one chain per dive off the gridded store, fanned in
#   ML            reshape -> normalize -> HDBSCAN -> label every point
#   report        per-dive SVCode CSVs and the duration tables
#
#   aa-recipe run full_analysis.yaml --executor dask --dask-workers 16
#
# THE SURVEY TIER IS SHARED, AND PAID FOR ONCE
#
#   survey_preprocess.yaml includes the same survey steps with the same inputs;
#   curate it with --cache-write-tier survey and every survey step here is a
#   cache hit, reaching the ML in under a minute. crop_max_range_m,
#   mvbs_range_var_max and survey_chunk_ping_time must equal
#   survey_preprocess.yaml's. Do not narrow the catalogue query: it is a parent
#   of every survey step. For a subset, see sv_window_example.yaml.
#
# WHY THE SURVEY FANS IN BELOW THE DEPTH GRID
#
#   HB1603 files have 17 range_sample lengths (1017 to 11289) and sample k is a
#   different depth in different files, so concatenating Sv on ping_time
#   NaN-pads echo_range; it would also be about 611 GB. Each file is binned to
#   a pinned depth grid first (survey_sv_per_file.yaml, then survey_mvbs.yaml),
#   at the cost of one bin size and noise setting for every analysis of the
#   store.
#
#   cell_cv comes off survey_remove_noise, which has no seafloor mask, so cells
#   under the seabed carry a CV. Their MVBS is seafloor-masked, so they should
#   not reach the clustering; confirm it on the output.
#
# SEAFLOOR MASKING IS PER DIVE, ON THE GRID
#
#   The line comes from a per-dive config, so the mask stays in the user tier
#   and is applied to the gridded product, quantised to the depth bin.
#   full_analysis_seabed_sv_mask.yaml masks on full-resolution Sv instead.
#
# OVERLAPPING DIVES
#
#   OE29/OE32 on 7 July overlap by ten minutes, OE61/OE62/OE64 on 25 July by
#   eleven to sixteen. The shared minutes are the same cells twice, so both
#   dive fan-ins use on_duplicate "first" to keep the index unique and count
#   each cell once. Two dives at one ping have two depths, so dive lines are
#   not attached before the fan-in: generate_sv_codes and the report read each
#   dive's lines onto its own slice from the paths on its window.
#
# THE PLOTS MUST USE x_axis_units: bins
#
#   The 13 dives hold 214 minutes of data across 38 days, so a clock-time axis
#   draws each dive as a hairline. "bins" plots against MVBS bin index, so the
#   dives sit side by side.
#
# SIZING HDBSCAN FOR THE POOLED SET
#
#   sample_size 1200000 is not expected to bind: the pooled grid is about
#   1.16 M cells, so HDBSCAN fits every point. min_cluster_size_fraction is a
#   fraction of the points fitted, so it means the same whether or not the cap
#   binds.
#
# CLUSTER IDS ARE RUN SCOPED
#
#   HDBSCAN ids are not stable across runs, so an SVCode integer does not carry
#   the fixed meaning codes 1, 2 and 3 had in the previous analysis. Read the
#   tables against the per-code Sv statistics in the SVCode CSVs.
#
# Check the shape before a long run:
#   aa-recipe dry-run full_analysis.yaml --visualize

recipe:
  name: "hb1603_full_analysis"
  description: "Pooled HDBSCAN clustering of 13 HB1603 sperm whale dives, with per-dive SVCodes."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  cal_input_folder:
    type: path
    default: "../calibration_files/HB201607_cal"
    description: "Folder of manufacturer calibration files (.cal for EK60, .xml for EK80), a local path or a gs:// URL."
  calibration_output_dir:
    type: path
    default: "./outputs/calibration"
    description: "Root folder the calibration artifacts are written under."
  mvbs_range_var_max:
    type: str
    default: "1810m"
    description: >
      Deepest depth the MVBS grid covers, such as "1810m", pinned so every
      file shares one depth axis. It must clear the range crop plus the
      transducer depth, or the deepest bins are dropped.
  crop_max_range_m:
    type: float
    default: 1800.0
    description: "Range ceiling in metres; samples beyond it are dropped even if they hold data. Changing it recomputes the whole survey Sv."
  survey_chunk_ping_time:
    type: int
    default: 1000
    description: >
      Ping-time chunk size of the shared survey store, which sets the
      granularity a window reads at. Size it near the window users usually ask
      for.
  # Applied to the gridded product here, so it is quantised to range_bin.
  seafloor_buffer_m:
    type: float
    default: 10.0
    description: >
      Height above the seabed line, in metres, that is also masked, to drop the
      bottom echo and detection error.
  json_dir:
    type: path
    default: "./Auxiliary/JSON_Files"
    description: "Folder of the SWD_*.json dive configs."
  evl_root:
    type: path
    default: "./Auxiliary"
    description: "Folder searched recursively for the .evl line files the dive configs name."
  pad_minutes:
    type: float
    default: 0.0
    description: "Minutes added either side of each dive's line span."
  dive_labels:
    type: list
    default:
      - "SWD_20160707-OE20"
      - "SWD_20160707-OE29"
      - "SWD_20160707-OE32"
      - "SWD_20160719-OE07"
      - "SWD_20160725-OE50"
      - "SWD_20160725-OE54"
      - "SWD_20160725-OE61"
      - "SWD_20160725-OE62"
      - "SWD_20160725-OE64"
      - "SWD_20160802-OE16"
      - "SWD_20160814-OE03"
      - "SWD_20160814-OE09"
      - "SWD_20160814-OE44"
    description: >
      Labels of the dives to analyse, one per dive config. The default is every
      localized HB1603 dive except SWD_20160703-OE20, whose dive data is
      incorrect. A label with no matching config stops the run.
  sample_size:
    type: int
    default: 1200000
    description: "Cap on the points HDBSCAN is fitted on; points over the cap are dropped at random and get no label. Set it above the valid cell count."
  min_cluster_size_fraction:
    type: float
    default: 0.005
    description: "Smallest cluster HDBSCAN keeps, as a fraction of the points it is fitted on."
  min_samples:
    type: int
    default: 4
    description: "Neighbourhood size HDBSCAN uses to judge density; higher values leave more points unclustered as noise."
  code_output_dir:
    type: path
    default: "./outputs/sv_codes"
    description: "Folder the per-dive SV code CSVs and the duration tables are written to."
  depth_interval_m:
    type: float
    default: 200.0
    description: "Depth bin of the SV code duration tables, in metres. 200 m matches the report."

steps:

  # Survey tier: per-file Sv, then per-file grid, then the fan-in.
  #
  # No input_overrides on the query window: overriding it, even to its current
  # value, would change these hashes and cut sv_window_example.yaml and earlier
  # runs off from the cache.

  - include: sub_recipes/calibration_from_ncei.yaml
    input_overrides:
      cal_input_folder: ${inputs.cal_input_folder}
      calibration_output_dir: ${inputs.calibration_output_dir}

  # These per-file steps are frozen (see the header of that file), so every
  # crop_survey_range checkpoint already written is a hit here.
  - include: sub_recipes/survey_sv_per_file.yaml
    input_overrides:
      calibration_dict: ${build_cal_mapping.calibration_dict}
      mapping_dict: ${build_cal_mapping.mapping_dict}
      crop_max_range_m: ${inputs.crop_max_range_m}

  # Must come directly after the include above and before anything non-mapped:
  # a mapped chain is kept contiguous by declaration order, and a split chain's
  # members stop sharing an element context.
  - include: sub_recipes/survey_mvbs.yaml
    input_overrides:
      range_var_max: ${inputs.mvbs_range_var_max}
      survey_chunk_ping_time: ${inputs.survey_chunk_ping_time}

  - id: plan_dives
    op: custom
    checkpoint: always
    params:
      json_dir: ${inputs.json_dir}
      evl_root: ${inputs.evl_root}
      pad_minutes: ${inputs.pad_minutes}
      include_labels: ${inputs.dive_labels}
    custom_spec:
      description: Turn the NEFSC dive configs into recipe windows.
      callable_path: aa_si_utils.dive_profiles.plan_dive_datasets
      cache_key: dive_profiles_plan_dive_datasets
      version: "1"
      params:
        json_dir: {type: path}
        evl_root: {type: path}
        pad_minutes: {type: float}
        include_labels: {type: list}
      outputs:
        windows: {type: list}
        raw_files: {type: list}
      output_map:
        windows: "['windows']"
        raw_files: "['raw_files']"
      dependency:
        name: aa-si-utils
        version: ">=0.1.0"
        source: git
        url: https://github.com/BLayman-NOAA/AA-SI_Utils.git

  # User tier: one chain per dive, off the gridded survey store

  - id: select_window
    op: select_ping_time_range
    map_over: ${plan_dives.windows}
    checkpoint: always
    inputs:
      ds_Sv: ${rechunk_survey_mvbs.ds_Sv}
    params:
      window: ${_item}

  # allow_empty is left at its default here. This reads one merged store, so a
  # dive window that selects no pings means the window is wrong and should fail
  # rather than quietly drop a dive from the study.

  - id: seafloor_line
    op: read_seafloor_line
    map_over: ${plan_dives.windows}
    inputs:
      ds_Sv: ${select_window.ds_Sv}
    params:
      window: ${_item}
      edge_extend_s: null

  - id: create_seafloor_mask
    op: create_seafloor_mask
    map_over: ${plan_dives.windows}
    inputs:
      ds_Sv: ${select_window.ds_Sv}
      seafloor_depth: ${seafloor_line.seafloor_depth}
    params:
      seafloor_buffer_m: ${inputs.seafloor_buffer_m}

  - id: apply_mask
    op: apply_sv_mask
    map_over: ${plan_dives.windows}
    inputs:
      ds_Sv: ${select_window.ds_Sv}
      mask: ${create_seafloor_mask.mask}

  # The same window on the cell grid's own time axis: the cell statistics store
  # bin edges on cell_ping_time, hence dim.
  - id: select_cell_window
    op: select_ping_time_range
    map_over: ${plan_dives.windows}
    inputs:
      ds_Sv: ${merge_survey_cell_stats.merged}
    params:
      window: ${_item}
      dim: "cell_ping_time"

  # Not disjoint (see OVERLAPPING DIVES): "first" keeps one copy of the shared
  # cells and sorts, so the pooled clustering counts each cell once.
  - id: merge_dive_mvbs
    op: merge_datasets
    collect: ${apply_mask.ds_Sv}
    checkpoint: always
    inputs:
      datasets: ${apply_mask.ds_Sv}
    params:
      dim: "ping_time"
      on_duplicate: "first"

  - id: merge_dive_cell_stats
    op: merge_datasets
    collect: ${select_cell_window.ds_Sv}
    checkpoint: always
    inputs:
      datasets: ${select_cell_window.ds_Sv}
    params:
      dim: "cell_ping_time"
      on_duplicate: "first"

  # Machine learning over the pooled cells

  - id: reshape_ml
    op: reshape_for_ml
    inputs:
      ds_MVBS: ${merge_dive_mvbs.merged}
    params:
      data_var: "Sv"
      dataset_name: "ml_dataset"
      feature_strategy: "mean_centered"
      baseline_channel: 0

  - id: add_aux_features
    op: add_auxiliary_features
    inputs:
      ds_ml: ${reshape_ml.ds_ml_ready}
      ds_sv: ${merge_dive_cell_stats.merged}
    params:
      dataset_name: "ml_dataset"
      features:
        - cell_cv

  - id: normalize_ml
    op: normalize_ml_data
    checkpoint: always
    inputs:
      ds_ml: ${add_aux_features.ds_ml_ready}
    params:
      method: "flatten"
      dataset_name: "ml_dataset"
      normalization_name: "normalized_flatten_mean_centered"
      shift_positive: false

  - id: run_hdbscan
    op: run_hdbscan
    inputs:
      ds_normalized: ${normalize_ml.ds_normalized}
    params:
      dataset_name: "ml_dataset"
      normalization_name: "normalized_flatten_mean_centered"
      ml_result_name: "hdbscan_results"
      min_cluster_size_fraction: ${inputs.min_cluster_size_fraction}
      min_samples: ${inputs.min_samples}
      sample_size: ${inputs.sample_size}
      cluster_selection_method: "leaf"
      use_hdbscan: true
      soft_membership_threshold: .1

  # The guard for sample_size binding: cells past the cap would otherwise come
  # back unlabelled. checkpoint: never because it needs run_hdbscan's in-memory
  # model, which is not checkpointed here, and embed_results holds the labels.
  - id: label_all_points
    op: assign_clusters_to_all_points
    checkpoint: never
    inputs:
      ds_normalized: ${normalize_ml.ds_normalized}
      clustering_results: ${run_hdbscan.clustering_results}
      clustering_model: ${run_hdbscan.clustering_model}
    params:
      dataset_name: "ml_dataset"
      normalization_name: "normalized_flatten_mean_centered"

  - id: embed_results
    op: embed_clustering_results
    checkpoint: always
    inputs:
      ds_normalized: ${normalize_ml.ds_normalized}
      clustering_results: ${label_all_points.clustering_results}
    params:
      dataset_name: "ml_dataset"
      ml_result_name: "hdbscan_results"

  # Reads the embedded labels from the embed_results checkpoint and nothing
  # from the clustering steps, so regenerating it does not refit. The one
  # panel that needs the fitted model, the HDBSCAN hierarchy, is skipped; wire
  # clustering_results and clustering_model from label_all_points to get it
  # back at the price of rerunning the fit.
  - id: plot_clustering_report
    op: plot_clustering_report
    regenerate: if-missing
    inputs:
      ds_normalized: ${embed_results.ds_normalized}
      ds_Sv: ${merge_dive_mvbs.merged}
    params:
      dataset_name: "ml_dataset"
      ml_result_name: "hdbscan_results"
      # The op defaults to "datetime"; see THE PLOTS MUST USE x_axis_units: bins.
      x_axis_units: "bins"
      # Pin a 16:9 panel; the data aspect, about 1300 bins by 1500 m, would
      # otherwise give a panel taller than it is wide.
      y_to_x_aspect_ratio_override: 1.78
      plot_window: [0, 1500] 
      cluster_stats_sv_data_var: "Sv"
      # Per-dive profile and 99% bounds, each dive its own segment; see
      # OVERLAPPING DIVES.
      overlay_windows: ${plan_dives.windows}
      # Each style dict is merged over the op's default, so naming just one
      # key restyles that and leaves the others. linestyle takes matplotlib's
      # spellings: ":" dotted, "--" dashed, "-." dash-dot, "-" solid.
      overlay_fit_style: {color: "#23FFFF", linewidth: 3.0}
      overlay_bound_style: {color: "#D08BFF", linewidth: 1.8, linestyle: ":"}

  # SVCodes and the report tables

  # Per-cell CSVs in the reference layout, plus the per-ping summary the
  # duration table uses: each ping adds its 10 s bin to the code that
  # dominates the cells between its 99% bounds. Each row carries the cell's 18
  # and 38 kHz Sv, so grouping by code describes each cluster. The dive lines
  # are read here, per dive; see OVERLAPPING DIVES.
  - id: generate_sv_codes
    op: custom
    checkpoint: always
    inputs:
      ds: ${embed_results.ds_normalized}
    params:
      windows: ${plan_dives.windows}
      output_dir: ${inputs.code_output_dir}
      dataset_name: "ml_dataset"
      ml_result_name: "hdbscan_results"
      range_var: "depth"
      ping_time_bin_s: 10.0
    custom_spec:
      description: Write per-dive SVCode CSVs from the embedded clustering.
      callable_path: aa_si_utils.dive_profiles.generate_sv_codes
      cache_key: dive_profiles_generate_sv_codes
      version: "2"
      inputs:
        ds: {type: Dataset}
      params:
        windows: {type: list}
        output_dir:
          type: path
          constraints:
            must_exist: false
        dataset_name: {type: str}
        ml_result_name: {type: str}
        range_var: {type: str}
        ping_time_bin_s: {type: float}
      outputs:
        code_csv_paths: {type: list}
        summary_csv_path: {type: path}
        dive_labels: {type: list}
      output_map:
        code_csv_paths: "['code_csv_paths']"
        summary_csv_path: "['summary_csv_path']"
        dive_labels: "['dive_labels']"
      dependency:
        name: aa-si-utils
        version: ">=0.1.0"
        source: git
        url: https://github.com/BLayman-NOAA/AA-SI_Utils.git

  # "Percent of total dive duration the whale spent at 200 m depth intervals
  # per code." Depth comes from the fitted dive profile, not from the cells:
  # the question is how long the whale spent at a depth, and the code says what
  # was around it there.
  - id: sv_code_depth_table
    op: custom
    checkpoint: always
    params:
      summary_csv_path: ${generate_sv_codes.summary_csv_path}
      output_dir: ${inputs.code_output_dir}
      depth_interval_m: ${inputs.depth_interval_m}
    custom_spec:
      description: Percent of dive duration per depth interval per code.
      callable_path: aa_si_utils.dive_profiles.sv_code_depth_table
      cache_key: dive_profiles_sv_code_depth_table
      version: "1"
      params:
        summary_csv_path: {type: path}
        output_dir:
          type: path
          constraints:
            must_exist: false
        depth_interval_m: {type: float}
      outputs:
        per_dive_csv_path: {type: path}
        combined_csv_path: {type: path}
        totals_csv_path: {type: path}
      output_map:
        per_dive_csv_path: "['per_dive_csv_path']"
        combined_csv_path: "['combined_csv_path']"
        totals_csv_path: "['totals_csv_path']"
      dependency:
        name: aa-si-utils
        version: ">=0.1.0"
        source: git
        url: https://github.com/BLayman-NOAA/AA-SI_Utils.git
