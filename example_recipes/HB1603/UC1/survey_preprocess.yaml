# HB1603 survey preprocess: build the shared survey store, and nothing else.
#
# The expensive pass, run once per cruise, as its own entrypoint so the shared
# tier is built and curated deliberately rather than by every analyst's run.
#
#   [per file]  read_raw -> ... -> crop_survey_range            (the Sv)
#   [per file]  masks -> noise -> mask_sparse -> compute_mvbs   (the grid)
#   [fan-in]    merge_survey_mvbs -> rechunk_survey_mvbs        (the store)
#               merge_survey_cell_stats
#
# It is exactly the survey tier full_analysis.yaml includes, with the same
# inputs (checked by a test), so after this run every survey step there is a
# cache hit. Curate it into the shared tier; survey_cache_dir comes from
# aa-recipe.config.yaml:
#
#   aa-recipe run survey_preprocess.yaml --executor dask --dask-workers 16 \
#       --cache-write-tier survey
#
# SCALE AND RESUMPTION
#
#   3322 files, about 175 GB of raw. Run it whole: narrowing the query window
#   moves every hash beneath it, so its checkpoints would not be the ones any
#   analysis looks for. An interrupted run resumes each file from its latest
#   checkpoint. The fan-in then loads every per-file checkpoint, about an hour
#   of sequential bucket reads, paid again only when a survey-level checkpoint
#   is invalidated.

recipe:
  name: "hb1603_survey_preprocess"
  description: "Build the shared HB1603 survey store from NCEI: per-file Sv, one pinned depth grid, calibration included."
  version: "2.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  cal_input_folder:
    type: path
    default: "../calibration_files/HB201607_cal"
    description: "Folder of manufacturer calibration files (.cal for EK60, .xml for EK80), a local path or a gs:// URL."
  calibration_output_dir:
    type: path
    default: "./outputs/calibration"
    description: "Root folder the calibration artifacts are written under."
  # crop_max_range_m, mvbs_range_var_max and survey_chunk_ping_time must match
  # full_analysis.yaml exactly, or the analysis misses this cache.
  crop_max_range_m:
    type: float
    default: 1800.0
    description: "Range ceiling in metres; samples beyond it are dropped even if they hold data. Changing it recomputes the whole survey Sv."
  # The crop is on echo_range and depth adds HB1603's ~8.9 m transducer depth,
  # so an 1800 m crop reaches ~1809 m; 1810m is the next 2 m bin edge. Raise
  # both together.
  mvbs_range_var_max:
    type: str
    default: "1810m"
    description: >
      Deepest depth the MVBS grid covers, such as "1810m", pinned so every
      file shares one depth axis. It must clear the range crop plus the
      transducer depth, or the deepest bins are dropped.
  # On the MVBS grid one ping_time index is one ping_time_bin.
  survey_chunk_ping_time:
    type: int
    default: 1000
    description: >
      Ping-time chunk size of the shared survey store, which sets the
      granularity a window reads at. Size it near the window users usually ask
      for.

steps:

  - include: sub_recipes/calibration_from_ncei.yaml
    input_overrides:
      cal_input_folder: ${inputs.cal_input_folder}
      calibration_output_dir: ${inputs.calibration_output_dir}

  - include: sub_recipes/survey_sv_per_file.yaml
    input_overrides:
      calibration_dict: ${build_cal_mapping.calibration_dict}
      mapping_dict: ${build_cal_mapping.mapping_dict}
      crop_max_range_m: ${inputs.crop_max_range_m}

  # Must come directly after the include above and before anything non-mapped:
  # a mapped chain is kept contiguous by declaration order.
  - include: sub_recipes/survey_mvbs.yaml
    input_overrides:
      range_var_max: ${inputs.mvbs_range_var_max}
      survey_chunk_ping_time: ${inputs.survey_chunk_ping_time}

outputs:
  survey_mvbs:
    step_id: rechunk_survey_mvbs
    output_name: ds_Sv
  survey_cell_stats:
    step_id: merge_survey_cell_stats
    output_name: merged
