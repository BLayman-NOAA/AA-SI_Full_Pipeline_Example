# HB1603 Full Dive-Profile Analysis - fan-in moved below the depth grid
#
# Same study as full_analysis.yaml: 13 dives, one pooled HDBSCAN clustering,
# per-dive SVCodes. What changed is where the survey fans in, and it changed
# because the original was wrong.
#
# THE BUG THIS FIXES
#
#   full_analysis.yaml merges the survey on ping_time while the data is still
#   indexed by range_sample. max_range_m is a ceiling, not a fixed length, and
#   HB1603 runs sample intervals differing by about 11x, so the per-file Sv
#   comes back with 17 distinct range_sample lengths between 1017 and 11289,
#   measured across all 3322 checkpoints. merge_datasets outer-joins them to the
#   longest and NaN-pads the rest.
#
#   Two things go wrong. NaN lands in echo_range, which every downstream range
#   binning reads. And range_sample index k is a different depth in different
#   files, so the concatenation stacks incomparable depths on one axis - a
#   failure that would survive any amount of padding cleanup.
#
#   It also cannot be made to fit: 1.69M pings x 11289 samples x 4 channels at
#   float64 is about 611 GB for Sv alone, and the rechunk that writes it is what
#   the OOM killer kept stopping.
#
# THE FIX
#
#   Bin to a pinned depth grid PER FILE, then fan in. compute_mvbs assigns each
#   sample to a bin by the value of its range variable rather than by its
#   range_sample index, so a coarse file and a fine file land in the same
#   physical bins, and a pinned range_var_max gives every file the same axis
#   length. The fan-in then has nothing to pad and nothing to misalign.
#
#   The survey tier is therefore split in two:
#
#     sub_recipes/survey_sv_per_file.yaml   per-file Sv, no fan-in
#     sub_recipes/survey_mvbs.yaml          per-file clean + grid, then fan in
#
#   The per-file half is byte-identical to the steps in survey_sv.yaml, so this
#   recipe reuses the 3322 per-file Sv checkpoints an earlier run already paid
#   for. Nothing above the grid is recomputed.
#
# WHAT THIS COSTS, AND WHAT IS STILL OPEN
#
#   Masking and noise removal have to precede binning, so they moved up with it.
#   Every analysis reading the shared store now inherits one depth bin, one ping
#   bin and one noise setting. sv_window_example.yaml shows the escape hatch:
#   map your own chain over the per-file Sv and choose your own.
#
#   cell_cv survives the move, but only because compute_per_cell_statistics
#   gained a range_var_max. Without it the cell grid is built out to each file's
#   own deepest sample, and per-file statistics would fan in with exactly the bug
#   this recipe fixes. Pinned, every file produces the same cell grid and the
#   merge is clean.
#
#   plot_window_mvbs is absent: it took a ping-index reference frame from the
#   pre-MVBS windowed Sv, which no longer exists at the window level.
#
#   The one science difference left to check is the cell statistics' masking.
#   They come off survey_remove_noise, which carries the surface and frequency
#   masks but not the seafloor mask - that is applied per dive, below. Cells
#   under the seabed therefore carry a CV where the original recipe had none.
#   The MVBS they are joined to is seafloor-masked, so those cells are NaN on
#   the data side and the feature should not reach the clustering, but confirm
#   it rather than assume it.
#
# SEAFLOOR MASKING MOVED, DELIBERATELY
#
#   It reads a hand-verified Echoview line named in a per-dive config, so it has
#   no meaning per raw file and stays in the window tier. It is now applied to
#   the gridded product rather than to full-resolution Sv, so it is quantised to
#   the depth bin. At 2 m bins against a seabed near 2990 m that is acceptable;
#   at coarser bins, check it.
#
# OVERLAPPING DIVES
#
#   Four of the 13 dives overlap another in time: OE29/OE32 on 7 July by ten
#   minutes, and OE61/OE62/OE64 on 25 July by eleven to sixteen minutes each.
#   Two whales under the ship at once is real, and it has two consequences.
#
#   The pooled clustering must see each cell once. Every window is a slice of
#   the same survey store, so the shared minutes are the same cells twice, and
#   both dive fan-ins dedup with on_duplicate: "first". Without it the merged
#   ping_time index is duplicated and out of order, and add_aux_features
#   raises InvalidIndexError, which is where two runs stopped.
#
#   A dive's lines cannot ride on the merged dataset. Two dives at one ping
#   have two depths, and a (ping_time,) variable holds one; averaging them
#   makes a profile no whale swam. So no add_line_overlay step sits before the
#   fan-in. generate_sv_codes reads each dive's three lines onto that dive's
#   own slice, from the paths its window already carries, and the report has
#   no single profile to overlay.
#
# Sanity-check the shape before a long run:
#   aa-recipe dry-run full_analysis_revised.yaml --visualize

recipe:
  name: "hb1603_full_analysis_revised"
  description: "Pooled HDBSCAN clustering of 13 HB1603 dives, fanned in on a pinned depth grid."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  cal_input_folder:
    type: path
    default: "../calibration_files/HB201607_cal"
    description: "Manufacturer .cal files."
  calibration_output_dir:
    type: path
    default: "./outputs/calibration"
  mvbs_range_var_max:
    type: str
    default: "1810m"
    description: >
      Depth the per-window MVBS grid is built out to, as the unit string
      echopype parses. It is pinned rather than measured so every window shares
      one depth axis and the fan-in has nothing to pad.

      It must clear the deepest depth the survey tier can produce, which is not
      crop_max_range_m: the crop is applied to echo_range, range from the
      transducer, while depth adds the transducer's own depth below the surface
      on top of it. HB1603's transducer sits about 8.9 m down, so a 1800 m
      echo_range ceiling reaches roughly 1809 m of depth and 1810 m is the next
      2 m bin edge above it. Raise both together, and keep the margin if you
      move the crop: a ceiling below the data silently drops the deepest bins.
  crop_max_range_m:
    type: float
    default: 1800.0
    description: "Must match survey_preprocess.yaml exactly, or the merged store is rebuilt."
  survey_chunk_ping_time:
    type: int
    default: 1000
    description: "Must match survey_preprocess.yaml exactly."
  seafloor_buffer_m:
    type: float
    default: 10.0
    description: >
      Metres above the seabed line that are also masked out. Applied to the
      gridded product now rather than to full-resolution Sv, so it is quantised
      to range_bin.
  json_dir:
    type: path
    default: "./Auxiliary/JSON_Files"
    description: "Folder of SWD_*.json dive configs."
  evl_root:
    type: path
    default: "./Auxiliary"
    description: "Searched recursively for the .evl files the configs name."
  pad_minutes:
    type: float
    default: 0.0
    description: "Minutes added either side of each dive's line span."
  dive_labels:
    type: list
    default:
      - "SWD_20160707-OE20"
      - "SWD_20160707-OE29"
      - "SWD_20160707-OE32"
      - "SWD_20160719-OE07"
      - "SWD_20160725-OE50"
      - "SWD_20160725-OE54"
      - "SWD_20160725-OE61"
      - "SWD_20160725-OE62"
      - "SWD_20160725-OE64"
      - "SWD_20160802-OE16"
      - "SWD_20160814-OE03"
      - "SWD_20160814-OE09"
      - "SWD_20160814-OE44"
    description: >
      The 13 dives in the analysis: every localized dive HB1603 recorded except
      SWD_20160703-OE20, whose dive data is incorrect.

      Spelled as the set that is included rather than the one excluded, which
      is what plan_dive_datasets accepts and is also the more useful record. It
      states the analysis population outright, and plan_dive_datasets raises if
      a label names a dive no config provides, so a renamed or missing config
      stops the run instead of quietly shrinking the study.

      SWD_20160707-OE20-OE29-OE32 is absent because it is not a fourteenth
      dive. It is a combined view of three July 7 dives that each have their
      own config, and it carries no 99% confidence lines, so it cannot drive
      the coding step. plan_dive_datasets skips it by default.
  sample_size:
    type: int
    default: 1200000
    description: >
      Cap on the points HDBSCAN is fitted on. Set above the expected valid-cell
      count so it does not bind. Read the note on min_cluster_size_fraction in
      the header before lowering it.
  min_cluster_size_fraction:
    type: float
    default: 0.01
    description: >
      Minimum cluster size as a fraction of the points HDBSCAN is fitted on.
      Half the smoke test 0.02 against a pooled set several times larger, so
      the absolute floor roughly doubles.
  min_samples:
    type: int
    default: 4
  code_output_dir:
    type: path
    default: "./outputs/sv_codes"
    description: "Where the per-dive CSVs and the duration tables are written."
  depth_interval_m:
    type: float
    default: 200.0
    description: "Depth bin of the duration table. 200 m matches the report."

steps:

  # --- Survey tier: per-file Sv, then per-file grid, then the fan-in ------
  #
  # No input_overrides on the query window on purpose. Overriding it, even to
  # the value it already has, would change these hashes: a step fingerprint
  # folds in the pipeline inputs it references. Leaving it alone is what keeps
  # the per-file half addressable by sv_window_example.yaml and by the earlier
  # runs whose checkpoints this reuses.

  - include: sub_recipes/calibration_from_ncei.yaml
    input_overrides:
      cal_input_folder: ${inputs.cal_input_folder}
      calibration_output_dir: ${inputs.calibration_output_dir}

  # Byte-identical to the per-file steps of survey_sv.yaml, so every
  # crop_survey_range checkpoint already written is a hit here.
  - include: sub_recipes/survey_sv_per_file.yaml
    input_overrides:
      calibration_dict: ${build_cal_mapping.calibration_dict}
      mapping_dict: ${build_cal_mapping.mapping_dict}
      crop_max_range_m: ${inputs.crop_max_range_m}

  # Must come directly after the include above and before anything non-mapped:
  # a mapped chain is kept contiguous by declaration order, and a split chain's
  # members stop sharing an element context.
  - include: sub_recipes/survey_mvbs.yaml
    input_overrides:
      range_var_max: ${inputs.mvbs_range_var_max}
      survey_chunk_ping_time: ${inputs.survey_chunk_ping_time}

  - id: plan_dives
    op: custom
    checkpoint: always
    params:
      json_dir: ${inputs.json_dir}
      evl_root: ${inputs.evl_root}
      pad_minutes: ${inputs.pad_minutes}
      include_labels: ${inputs.dive_labels}
    custom_spec:
      description: Turn the NEFSC dive configs into recipe windows.
      callable_path: aa_si_utils.dive_profiles.plan_dive_datasets
      cache_key: dive_profiles_plan_dive_datasets
      version: "1"
      params:
        json_dir: {type: path}
        evl_root: {type: path}
        pad_minutes: {type: float}
        include_labels: {type: list}
      outputs:
        windows: {type: list}
        raw_files: {type: list}
      output_map:
        windows: "['windows']"
        raw_files: "['raw_files']"
      dependency:
        name: aa-si-utils
        version: ">=0.1.0"
        source: git
        url: https://github.com/BLayman-NOAA/AA-SI_Utils.git

  # --- User tier: one chain per dive, off the gridded survey store ---------

  - id: select_window
    op: select_ping_time_range
    map_over: ${plan_dives.windows}
    checkpoint: always
    inputs:
      ds_Sv: ${rechunk_survey_mvbs.ds_Sv}
    params:
      window: ${_item}

  # allow_empty is left at its default here. This reads one merged store, so a
  # dive window that selects no pings means the window is wrong and should fail
  # rather than quietly drop a dive from the study.

  - id: seafloor_line
    op: read_seafloor_line
    map_over: ${plan_dives.windows}
    inputs:
      ds_Sv: ${select_window.ds_Sv}
    params:
      window: ${_item}
      edge_extend_s: null

  - id: create_seafloor_mask
    op: create_seafloor_mask
    map_over: ${plan_dives.windows}
    inputs:
      ds_Sv: ${select_window.ds_Sv}
      seafloor_depth: ${seafloor_line.seafloor_depth}
    params:
      seafloor_buffer_m: ${inputs.seafloor_buffer_m}

  - id: apply_mask
    op: apply_sv_mask
    map_over: ${plan_dives.windows}
    inputs:
      ds_Sv: ${select_window.ds_Sv}
      mask: ${create_seafloor_mask.mask}

  # The same window, against the cell grid's own time axis. dim is what makes
  # this reusable: compute_per_cell_statistics stores each bin's left edge on
  # cell_ping_time, not ping_time, so the default would not find a coordinate to
  # slice. Declared inside the dive chain so it fans out per window like the
  # steps above it.
  - id: select_cell_window
    op: select_ping_time_range
    map_over: ${plan_dives.windows}
    inputs:
      ds_Sv: ${merge_survey_cell_stats.merged}
    params:
      window: ${_item}
      dim: "cell_ping_time"

  # Comparable because every window came off one survey-wide grid. Not
  # disjoint: see OVERLAPPING DIVES in the header. The shared minutes are the
  # same cells cut from the same store twice, so "first" keeps one copy and
  # sorts, and the pooled clustering counts each cell once. Nothing
  # dive-specific is on this axis to lose.
  - id: merge_dive_mvbs
    op: merge_datasets
    collect: ${apply_mask.ds_Sv}
    checkpoint: always
    inputs:
      datasets: ${apply_mask.ds_Sv}
    params:
      dim: "ping_time"
      on_duplicate: "first"

  - id: merge_dive_cell_stats
    op: merge_datasets
    collect: ${select_cell_window.ds_Sv}
    checkpoint: always
    inputs:
      datasets: ${select_cell_window.ds_Sv}
    params:
      dim: "cell_ping_time"
      on_duplicate: "first"

  # --- Machine learning over the pooled cells -----------------------------

  - id: reshape_ml
    op: reshape_for_ml
    inputs:
      ds_MVBS: ${merge_dive_mvbs.merged}
    params:
      data_var: "Sv"
      dataset_name: "ml_dataset"
      feature_strategy: "mean_centered"
      baseline_channel: 0

  - id: add_aux_features
    op: add_auxiliary_features
    inputs:
      ds_ml: ${reshape_ml.ds_ml_ready}
      ds_sv: ${merge_dive_cell_stats.merged}
    params:
      dataset_name: "ml_dataset"
      features:
        - cell_cv

  - id: normalize_ml
    op: normalize_ml_data
    checkpoint: always
    inputs:
      ds_ml: ${add_aux_features.ds_ml_ready}
    params:
      method: "flatten"
      dataset_name: "ml_dataset"
      normalization_name: "normalized_flatten_mean_centered"
      shift_positive: false

  - id: run_hdbscan
    op: run_hdbscan
    inputs:
      ds_normalized: ${normalize_ml.ds_normalized}
    params:
      dataset_name: "ml_dataset"
      normalization_name: "normalized_flatten_mean_centered"
      ml_result_name: "hdbscan_results"
      min_cluster_size_fraction: ${inputs.min_cluster_size_fraction}
      min_samples: ${inputs.min_samples}
      sample_size: ${inputs.sample_size}
      cluster_selection_method: "leaf"
      use_hdbscan: true

  # Kept even though sample_size is not expected to bind: it is the guard that
  # makes that expectation safe. If the valid count does exceed the ceiling,
  # every cell past it would otherwise stay unlabelled and come back NaN once
  # the result is regridded, which on a pooled survey is most of the data.
  #
  # checkpoint: never because it needs the fitted model, which only the
  # run_hdbscan above it holds: a checkpointed clustering result drops the
  # model, and the model itself would checkpoint as pickle.
  - id: label_all_points
    op: assign_clusters_to_all_points
    checkpoint: never
    inputs:
      ds_normalized: ${normalize_ml.ds_normalized}
      clustering_results: ${run_hdbscan.clustering_results}
      clustering_model: ${run_hdbscan.clustering_model}
    params:
      dataset_name: "ml_dataset"
      normalization_name: "normalized_flatten_mean_centered"

  - id: embed_results
    op: embed_clustering_results
    checkpoint: always
    inputs:
      ds_normalized: ${normalize_ml.ds_normalized}
      clustering_results: ${label_all_points.clustering_results}
    params:
      dataset_name: "ml_dataset"
      ml_result_name: "hdbscan_results"

  - id: plot_clustering_report
    op: plot_clustering_report
    regenerate: if-missing
    inputs:
      ds_normalized: ${embed_results.ds_normalized}
      clustering_results: ${label_all_points.clustering_results}
      clustering_model: ${label_all_points.clustering_model}
      ds_Sv: ${merge_dive_mvbs.merged}
    params:
      dataset_name: "ml_dataset"
      ml_result_name: "hdbscan_results"
      # Same reason as plot_window_mvbs, and it matters more here: this op
      # defaults to "datetime", which would draw the whole 38-day span.
      x_axis_units: "bins"
      cluster_stats_sv_data_var: "Sv"

  # --- SVCodes and the report tables --------------------------------------

  # Per-cell CSVs in the reference layout, plus the per-ping summary the
  # duration table is built from. A ping contributes its whole 10 s bin to the
  # code that dominates the cells between its 99% confidence bounds, which is
  # what makes the per-code minutes add up to the dive length.
  #
  # With no clustering report rendered, these CSVs are also where the codes are
  # interpreted from: each row carries its cell 18 and 38 kHz Sv next to its
  # code, so grouping by code gives the per-cluster statistics that say what
  # each id actually is.
  #
  # The dive lines are read here, per dive, onto that dive's slice of the
  # merged grid, from the dive_fit_evl / dive_u99_evl / dive_l99_evl paths on
  # its window. See OVERLAPPING DIVES for why they are not attached upstream.
  - id: generate_sv_codes
    op: custom
    checkpoint: always
    inputs:
      ds: ${embed_results.ds_normalized}
    params:
      windows: ${plan_dives.windows}
      output_dir: ${inputs.code_output_dir}
      dataset_name: "ml_dataset"
      ml_result_name: "hdbscan_results"
      range_var: "depth"
      ping_time_bin_s: 10.0
    custom_spec:
      description: Write per-dive SVCode CSVs from the embedded clustering.
      callable_path: aa_si_utils.dive_profiles.generate_sv_codes
      cache_key: dive_profiles_generate_sv_codes
      version: "2"
      inputs:
        ds: {type: Dataset}
      params:
        windows: {type: list}
        output_dir:
          type: path
          constraints:
            must_exist: false
        dataset_name: {type: str}
        ml_result_name: {type: str}
        range_var: {type: str}
        ping_time_bin_s: {type: float}
      outputs:
        code_csv_paths: {type: list}
        summary_csv_path: {type: path}
        dive_labels: {type: list}
      output_map:
        code_csv_paths: "['code_csv_paths']"
        summary_csv_path: "['summary_csv_path']"
        dive_labels: "['dive_labels']"
      dependency:
        name: aa-si-utils
        version: ">=0.1.0"
        source: git
        url: https://github.com/BLayman-NOAA/AA-SI_Utils.git

  # "Percent of total dive duration the whale spent at 200 m depth intervals
  # per code." Depth comes from the fitted dive profile, not from the cells:
  # the question is how long the whale spent at a depth, and the code says what
  # was around it there.
  - id: sv_code_depth_table
    op: custom
    checkpoint: always
    params:
      summary_csv_path: ${generate_sv_codes.summary_csv_path}
      output_dir: ${inputs.code_output_dir}
      depth_interval_m: ${inputs.depth_interval_m}
    custom_spec:
      description: Percent of dive duration per depth interval per code.
      callable_path: aa_si_utils.dive_profiles.sv_code_depth_table
      cache_key: dive_profiles_sv_code_depth_table
      version: "1"
      params:
        summary_csv_path: {type: path}
        output_dir:
          type: path
          constraints:
            must_exist: false
        depth_interval_m: {type: float}
      outputs:
        per_dive_csv_path: {type: path}
        combined_csv_path: {type: path}
        totals_csv_path: {type: path}
      output_map:
        per_dive_csv_path: "['per_dive_csv_path']"
        combined_csv_path: "['combined_csv_path']"
        totals_csv_path: "['totals_csv_path']"
      dependency:
        name: aa-si-utils
        version: ">=0.1.0"
        source: git
        url: https://github.com/BLayman-NOAA/AA-SI_Utils.git
