# HB1603 dive analysis, raw-file calibration: 13 dives, one clustering,
# per-dive SVCodes, with gains, environment and transducer depth taken from
# the raw files instead of the manufacturer calibration files.
#
# A variant of dive_analysis.yaml built to line up with the NEFSC reference
# analysis (EK_CodeSv.py) once that script's depth-offset bug is fixed and
# background noise removal is added to it. From the dive windows down the two
# recipes are the same level files with the same values; they differ only in
# where the per-file Sv comes from.
#
#   aa-recipe run dive_analysis_raw_cal.yaml --executor dask --dask-workers 16
#
#   plan                read the dive configs, one window per dive
#   level 0 (raw cal)   the catalogue query, kept to the dive files' URLs
#   level 1             the dive files only: raw ingest
#   level 2a (raw cal)  Sv from each file's own gains and environment, static
#                       transducer depth, range crop
#   level 2b            per file, inside the dive windows: depth added once,
#                       surface, frequency and seabed masks, noise removal
#   level 3             per file: sparse mask, grid, per-cell CV; fan in
#   level 4, 5          clustering, report, SVCodes and tables
#
# WHAT DIFFERS FROM dive_analysis.yaml
#
#   Calibration. compute_sv is handed nothing, so echopype reads the gain, sa
#   correction, equivalent beam angle, sound speed and absorption each file
#   recorded. No .cal file is read, no single-channel files are written and no
#   mapping is built. After the 18 July calibration the raw gains equal the
#   .cal values; before it they differ by 0.1 dB at 18 kHz and 0.5 dB at
#   38 kHz. The environment differs on every date the operators changed sound
#   speed, which moves range by up to 1.4%.
#
#   Depth. The recorded transducer depth, 6 or 9 m on the dive dates, without
#   heave, added once in level 2b. dive_analysis.yaml's survey Sv carries
#   transducer depth plus heave and is then re-referenced to 0.0 for the
#   reference comparison; here the value is the file's own, so nothing has to
#   be undone.
#
#   Scope. The survey's per-file Sv cannot be reused, so only the dive files
#   are read: the 24 the dive configs name, out of 3322. The catalogue query
#   itself keeps only those, through its file_names param, so its raw_urls
#   output is the per-file list and the chain maps over it directly.
#   Everything from the query down is this recipe's own cache.
#
# WHAT THIS RUN COSTS
#
#   The first run streams 24 raw files from NCEI, about 1.2 GB, converts them
#   and computes Sv: tens of minutes, not the hours of a survey pass.
#   Every per-file product is checkpointed, so an interrupted run resumes and
#   a rerun with a changed user-level value re-runs only from that level. The
#   dive plan is a cache hit from dive_analysis.yaml; the query re-runs, since
#   its file_names param makes it a different step, and takes seconds.
#
# THE SHARED LEVEL FILES ARE TOLD WHAT TO MAP OVER
#
#   Levels 1, 2b and 3 are the same files dive_analysis.yaml includes. Each is
#   passed per_file_source: ${query_ncei.raw_urls}, which here is the dive
#   files' URLs, and level 2b is passed sv_source: ${crop_dive_range.ds_Sv}.
#   Every per-file include must get the same per_file_source or the chain
#   splits, and nothing non-mapped may be declared between the level 1 and
#   level 3 includes.
#
# Each level file documents its own steps and carries its own inputs. A value
# passed here as a literal is not reachable with --input; edit it here.
#
# Sanity-check the shape before a long run:
#   aa-recipe dry-run dive_analysis_raw_cal.yaml --visualize

recipe:
  name: "hb1603_dive_analysis_raw_cal"
  description: "Pooled HDBSCAN clustering of 13 HB1603 sperm whale dives with per-dive SVCodes, Sv calibrated from the raw files."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:

  # --- Shared by levels 2b, 3 and 5 ----------------------------------------
  ping_time_bin:
    type: str
    default: "10s"
    description: >
      Ping-time bin of the per-dive grid. Level 2b widens each dive window to
      whole bins of this width so the first and last bins of a dive are
      averaged over all of their pings, level 3 grids on it, and level 5
      counts one bin of this length per ping in the duration tables.

steps:

  # The 13 dives in the analysis: every localized dive HB1603 recorded except
  # SWD_20160703-OE20, whose dive data is incorrect. Listed as the set that is
  # included, so the population is stated outright and a label no config
  # provides stops the run instead of quietly shrinking the study.
  # SWD_20160707-OE20-OE29-OE32 is not a fourteenth dive: it is a combined view
  # of three dives that each have their own config, and it has no 99% lines.
  - include: sub_recipes/dive_plan.yaml
    input_overrides:
      json_dir: "./Auxiliary/JSON_Files"
      evl_root: "./Auxiliary"
      pad_minutes: 0.0
      dive_labels:
        - "SWD_20160707-OE20"
        - "SWD_20160707-OE29"
        - "SWD_20160707-OE32"
        - "SWD_20160719-OE07"
        - "SWD_20160725-OE50"
        - "SWD_20160725-OE54"
        - "SWD_20160725-OE61"
        - "SWD_20160725-OE62"
        - "SWD_20160725-OE64"
        - "SWD_20160802-OE16"
        - "SWD_20160814-OE03"
        - "SWD_20160814-OE09"
        - "SWD_20160814-OE44"

  # --- Raw-calibration levels -----------------------------------------------

  # The survey's query with one addition: it keeps only the dive files.
  - include: sub_recipes/processing_lvl_0_raw_cal.yaml
    input_overrides:
      dive_raw_files: ${plan_dives.raw_files}

  - include: sub_recipes/processing_lvl_1_per_file.yaml
    input_overrides:
      per_file_source: ${query_ncei.raw_urls}

  - include: sub_recipes/processing_lvl_2_raw_cal.yaml
    input_overrides:
      per_file_source: ${query_ncei.raw_urls}
      crop_max_range_m: 1800.0

  # --- User levels: the same files and values as dive_analysis.yaml --------

  - include: sub_recipes/processing_lvl_2_user.yaml
    input_overrides:
      per_file_source: ${query_ncei.raw_urls}
      sv_source: ${crop_dive_range.ds_Sv}
      dive_windows: ${plan_dives.windows}
      ping_time_bin: ${inputs.ping_time_bin}
      # The only add_depth on this path: the file's recorded transducer depth,
      # without heave, computed in level 2a. See DEPTH IS RE-ADDED HERE in the
      # level file. 0.0 would give range from the transducer instead.
      dive_depth_offset: ${compute_transducer_depth.transducer_depth}
      surface_depth_m: 10.0
      frequencies_to_mask: [70, 120, 200]
      seabed_lines_dir: "./Auxiliary/seabed_lines"
      seabed_min_coverage: 0.99
      seafloor_buffer_m: 10.0
      noise_range_sample_num: 10
      noise_ping_num: 5
      noise_snr_threshold: "6.0dB"
      noise_background_max: "-66dB"

  - include: sub_recipes/processing_lvl_3_user.yaml
    input_overrides:
      per_file_source: ${query_ncei.raw_urls}
      ping_time_bin: ${inputs.ping_time_bin}
      range_bin: "2m"
      range_var: "depth"
      nan_threshold: 0.99
      # Pinned so every file shares one depth axis. It must clear the deepest
      # depth the data reaches: crop_max_range_m plus the largest transducer
      # depth, rounded up to a range_bin edge.
      mvbs_range_var_max: "1810m"
      dive_chunk_ping_time: 1000

  - include: sub_recipes/processing_lvl_4.yaml
    input_overrides:
      mvbs: ${rechunk_dive_mvbs.ds_Sv}
      cell_stats_sv: ${merge_dive_files_cell_stats.merged}
      dive_windows: ${plan_dives.windows}
      sample_size: 1200000
      min_cluster_size_fraction: 0.01
      min_samples: 4

  - include: sub_recipes/processing_lvl_5_sv_codes.yaml
    input_overrides:
      clustered: ${embed_results.ds_normalized}
      dive_windows: ${plan_dives.windows}
      ping_time_bin: ${inputs.ping_time_bin}
      code_output_dir: "./outputs/sv_codes"
      depth_interval_m: 200.0
