# HB1603 dive analysis, raw-file calibration: 13 dives, one clustering,
# per-dive SVCodes, with gains, environment and transducer depth taken from
# the raw files instead of the manufacturer calibration files.
#
# A variant of dive_analysis.yaml built to line up with the NEFSC reference
# analysis (EK_CodeSv.py) once that script's depth-offset bug is fixed and it
# gains background noise removal. From the dive windows down the two recipes
# share level files and values; only the per-file Sv differs.
#
#   aa-recipe run dive_analysis_raw_cal.yaml --executor dask --dask-workers 16
#
#   plan                read the dive configs, one window per dive
#   level 0 (raw cal)   the catalogue query, kept to the dive files' URLs
#   level 1             the dive files only: raw ingest
#   level 2a (raw cal)  Sv from each file's own gains and environment, static
#                       transducer depth, range crop
#   level 2b            per file, inside the dive windows: depth added once,
#                       surface, frequency and seabed masks, noise removal
#   level 3             per file: sparse mask, grid, per-cell CV; fan in
#   level 4, 5          clustering, report, SVCodes and tables
#
# WHAT DIFFERS FROM dive_analysis.yaml
#
#   Calibration: compute_sv gets nothing, so echopype uses each file's recorded
#   gains, sound speed and absorption. Before the 18 July calibration the raw
#   gains differ from the .cal values by 0.1 dB at 18 kHz and 0.5 dB at
#   38 kHz; the recorded sound speeds move range by up to 1.4%.
#
#   Depth: the recorded transducer depth, 6 or 9 m on the dive dates, without
#   heave, added once in level 2b.
#
#   Scope: only the 24 dive files are read, out of 3322; the catalogue query
#   keeps them through its file_names param. Everything from the query down is
#   this recipe's own cache. The first run streams about 1.2 GB and takes tens
#   of minutes; every per-file product is checkpointed.
#
# THE SHARED LEVEL FILES ARE TOLD WHAT TO MAP OVER
#
#   Levels 1, 2b and 3 get per_file_source: ${query_ncei.raw_urls}, here the
#   dive files, and level 2b gets sv_source: ${crop_dive_range.ds_Sv}. Every
#   per-file include needs the same per_file_source, and nothing non-mapped may
#   be declared between the level 1 and level 3 includes.
#
# Literal values here are not reachable with --input; edit them here. Check
# the shape before a long run:
#   aa-recipe dry-run dive_analysis_raw_cal.yaml --visualize

recipe:
  name: "hb1603_dive_analysis_raw_cal"
  description: "Pooled HDBSCAN clustering of 13 HB1603 sperm whale dives with per-dive SVCodes, Sv calibrated from the raw files."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:

  # Shared by levels 2b, 3 and 5; wire all three from this one input.
  ping_time_bin:
    type: str
    default: "10s"
    description: >
      Ping-time bin width of the MVBS grid, as a duration string such as
      "10s". The sparse-bin mask, the cell statistics and the SVCode duration
      tables use the same bin.

steps:

  # Every localized HB1603 dive except SWD_20160703-OE20, whose dive data is
  # incorrect. SWD_20160707-OE20-OE29-OE32 is a combined view of three listed
  # dives, not a dive of its own.
  - include: sub_recipes/dive_plan.yaml
    input_overrides:
      json_dir: "./Auxiliary/JSON_Files"
      evl_root: "./Auxiliary"
      pad_minutes: 0.0
      dive_labels:
        - "SWD_20160707-OE20"
        - "SWD_20160707-OE29"
        - "SWD_20160707-OE32"
        - "SWD_20160719-OE07"
        - "SWD_20160725-OE50"
        - "SWD_20160725-OE54"
        - "SWD_20160725-OE61"
        - "SWD_20160725-OE62"
        - "SWD_20160725-OE64"
        - "SWD_20160802-OE16"
        - "SWD_20160814-OE03"
        - "SWD_20160814-OE09"
        - "SWD_20160814-OE44"

  # Raw-calibration levels

  # The survey's query with one addition: it keeps only the dive files.
  - include: sub_recipes/processing_lvl_0_raw_cal.yaml
    input_overrides:
      dive_raw_files: ${plan_dives.raw_files}

  - include: sub_recipes/processing_lvl_1_per_file.yaml
    input_overrides:
      per_file_source: ${query_ncei.raw_urls}

  - include: sub_recipes/processing_lvl_2_raw_cal.yaml
    input_overrides:
      per_file_source: ${query_ncei.raw_urls}
      # No range cap: the dives use the whole recorded water column, down to
      # the seabed line.
      crop_max_range_m: null

  # User levels: the same files and values as dive_analysis.yaml

  - include: sub_recipes/processing_lvl_2_user.yaml
    input_overrides:
      per_file_source: ${query_ncei.raw_urls}
      sv_source: ${crop_dive_range.ds_Sv}
      dive_windows: ${plan_dives.windows}
      ping_time_bin: ${inputs.ping_time_bin}
      # The only add_depth on this path: the file's recorded transducer depth,
      # without heave. 0.0 would give range from the transducer instead.
      dive_depth_offset: ${compute_transducer_depth.transducer_depth}
      surface_depth_m: 10.0
      frequencies_to_mask: [70, 120, 200]
      seabed_lines_dir: "./Auxiliary/seabed_lines"
      seabed_min_coverage: 0.99
      seafloor_buffer_m: 10.0
      noise_range_sample_num: 10
      noise_ping_num: 5
      noise_snr_threshold: "6.0dB"
      noise_background_max: "-66dB"

  - include: sub_recipes/processing_lvl_3_user.yaml
    input_overrides:
      per_file_source: ${query_ncei.raw_urls}
      ping_time_bin: ${inputs.ping_time_bin}
      range_bin: "2m"
      range_var: "depth"
      nan_threshold: 0.99
      # Clears HB1603's deepest recorded range, 2960 to 3003 m. Depth here adds
      # the 6 or 9 m transducer depth, so the last few metres of the deepest
      # files fall past it; they lie below the seabed and are masked anyway.
      mvbs_range_var_max: "3010m"
      dive_chunk_ping_time: 1000

  - include: sub_recipes/processing_lvl_4.yaml
    input_overrides:
      mvbs: ${rechunk_dive_mvbs.ds_Sv}
      cell_stats_sv: ${merge_dive_files_cell_stats.merged}
      dive_windows: ${plan_dives.windows}
      sample_size: 1200000
      min_cluster_size_fraction: 0.01
      min_samples: 4

  - include: sub_recipes/processing_lvl_5_sv_codes.yaml
    input_overrides:
      clustered: ${embed_results.ds_normalized}
      dive_windows: ${plan_dives.windows}
      ping_time_bin: ${inputs.ping_time_bin}
      code_output_dir: "./outputs/sv_codes"
      depth_interval_m: 200.0
