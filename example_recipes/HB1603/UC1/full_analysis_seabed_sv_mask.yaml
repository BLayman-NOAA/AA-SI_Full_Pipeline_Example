# HB1603 full dive-profile analysis, seabed masked on Sv: 13 dives.
#
# full_analysis.yaml with one difference: the seabed is masked on
# full-resolution Sv, per dive window, before noise removal and gridding,
# instead of on the gridded product afterwards. From the pooled machine
# learning down the two are identical, so their outputs compare directly.
# full_analysis.yaml stays the working reference; this is the experiment.
#
#   survey tier   calibration and per-file Sv, cropped, from the shared cache
#                 (byte-identical include, every step a cache hit)
#   plan          read the dive configs, keep the 13 named below
#   dive chain    per file, only the pings inside a dive window:
#                 surface + frequency + SEABED masks -> noise removal
#                 -> sparse-bin mask -> grid onto the pinned depth axis
#                 -> per-cell CV; then fan in           [this recipe's own]
#   user tier     one slice per dive off the pooled grid, fanned in
#   ML, report    identical to full_analysis.yaml
#
#   aa-recipe run full_analysis_seabed_sv_mask.yaml --executor dask --dask-workers 16
#
# WHERE THIS BRANCHES OFF THE CACHE
#
#   At crop_survey_range, the deepest checkpointed survey step. The masks,
#   noise removal and sparse-bin mask below it are never written, so they are
#   reapplied here; they are lazy and cheap. The two includes match
#   full_analysis.yaml's down to the input values; sv_window_example.yaml's
#   header explains why the query and the includes must not change.
#
# HOW A DIVE CHAIN RUNS OVER A WHOLE SURVEY
#
#   dive_sv runs on every file and keeps the pings inside any window. For the
#   roughly 3280 files no window touches it returns nothing, every later step
#   is skipped for that file and the fan-in drops it, so real work happens on
#   about 40 of 3322. Nothing may be declared between the survey_sv_per_file
#   include and dive_sv, which is why plan_dives is declared first.
#
# WHY THE SEABED IS MASKED HERE AND NOT IN THE SURVEY TIER
#
#   The noise estimate takes a minimum over range, so samples below the seabed
#   feed it; six of the 13 dives have the seabed inside the 1800 m crop. The
#   seabed lines cover only the six dive dates, and a ping with no line depth
#   is masked whole without error, so a survey-wide mask would silently empty
#   most of the cruise. Inside the dive windows every ping is covered, and
#   seabed_min_coverage turns any gap into a failed step.
#
# THE SEABED LINE SOURCE
#
#   The mask reads the seabed_lines_dir folder, not the per-dive seabed_evl on
#   the window: a per-file instance cannot read the window dict, and the
#   per-dive path is one of the same half-day files. The 7 July export has nine
#   points over twelve hours, interpolated flat at 2985 m; that is below the
#   crop, so nothing on 7 July is masked, which is also correct there.
#
# TWO THINGS TO KEEP IN MIND WHEN COMPARING
#
#   Noise removal sees only a file's in-window pings, as few as a few dozen
#   against 516 per file in the survey tier. Two windows in one file are
#   selected as one block, so a noise bin can span the gap between them (at
#   most once, on 7 July).
#
# OVERLAPPING DIVES
#
#   OE29/OE32 on 7 July and OE61/OE62/OE64 on 25 July share minutes. The union
#   select keeps each shared ping once per file, so the pooled grid has no
#   duplicates. The user tier still slices per dive and fans in with
#   on_duplicate "first", as full_analysis does, which keeps the downstream
#   identical and fails loudly if a window selects no pings. Dive lines are
#   read per dive downstream, as there.
#
# Check the shape before a long run:
#   aa-recipe dry-run full_analysis_seabed_sv_mask.yaml --visualize

recipe:
  name: "hb1603_full_analysis_seabed_sv_mask"
  description: "As full_analysis, with the seabed masked on full-resolution Sv before noise removal, per dive window."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  cal_input_folder:
    type: path
    default: "../calibration_files/HB201607_cal"
    description: "Folder of manufacturer calibration files (.cal for EK60, .xml for EK80), a local path or a gs:// URL."
  calibration_output_dir:
    type: path
    default: "./outputs/calibration"
    description: "Root folder the calibration artifacts are written under."
  mvbs_range_var_max:
    type: str
    default: "1810m"
    description: >
      Deepest depth the MVBS grid covers, such as "1810m", pinned so every
      file shares one depth axis. It must clear the range crop plus the
      transducer depth, or the deepest bins are dropped.
  crop_max_range_m:
    type: float
    default: 1800.0
    description: "Range ceiling in metres; samples beyond it are dropped even if they hold data. Changing it recomputes the whole survey Sv."
  seafloor_buffer_m:
    type: float
    default: 10.0
    description: >
      Height above the seabed line, in metres, that is also masked, to drop the
      bottom echo and detection error.
  json_dir:
    type: path
    default: "./Auxiliary/JSON_Files"
    description: "Folder of the SWD_*.json dive configs."
  evl_root:
    type: path
    default: "./Auxiliary"
    description: "Folder searched recursively for the .evl line files the dive configs name."
  pad_minutes:
    type: float
    default: 0.0
    description: "Minutes added either side of each dive's line span."
  dive_labels:
    type: list
    default:
      - "SWD_20160707-OE20"
      - "SWD_20160707-OE29"
      - "SWD_20160707-OE32"
      - "SWD_20160719-OE07"
      - "SWD_20160725-OE50"
      - "SWD_20160725-OE54"
      - "SWD_20160725-OE61"
      - "SWD_20160725-OE62"
      - "SWD_20160725-OE64"
      - "SWD_20160802-OE16"
      - "SWD_20160814-OE03"
      - "SWD_20160814-OE09"
      - "SWD_20160814-OE44"
    description: >
      Labels of the dives to analyse, one per dive config. The default is every
      localized HB1603 dive except SWD_20160703-OE20, whose dive data is
      incorrect. A label with no matching config stops the run.
  sample_size:
    type: int
    default: 1200000
    description: "Cap on the points HDBSCAN is fitted on; points over the cap are dropped at random and get no label. Set it above the valid cell count."
  min_cluster_size_fraction:
    type: float
    default: 0.01
    description: "Smallest cluster HDBSCAN keeps, as a fraction of the points it is fitted on."
  min_samples:
    type: int
    default: 4
    description: "Neighbourhood size HDBSCAN uses to judge density; higher values leave more points unclustered as noise."
  code_output_dir:
    type: path
    default: "./outputs/sv_codes"
    description: "Folder the per-dive SV code CSVs and the duration tables are written to."
  depth_interval_m:
    type: float
    default: 200.0
    description: "Depth bin of the SV code duration tables, in metres. 200 m matches the report."

  # The per-dive Sv chain. Defaults mirror sub_recipes/survey_mvbs.yaml's, so a
  # first run compares like for like with full_analysis.yaml; changes cost
  # minutes, since the chain runs only on the dive windows.

  seabed_lines_dir:
    type: path
    default: "./Auxiliary/seabed_lines"
    description: >
      Folder of half-day Echoview .evl seabed exports; each per-file instance
      reads the folder and interpolates the line onto its own pings.
  seabed_min_coverage:
    type: float
    default: 0.99
    description: >
      Fraction of a file's selected pings (0 to 1) that must get a seabed
      depth, or the step fails. A ping with no seabed depth is masked out
      entirely.
  surface_depth_m:
    type: float
    default: 10.0
    description: "Range from the transducer, in metres, above which samples are masked, to remove the transmit pulse and ringdown."
  frequencies_to_mask:
    type: list
    default: [70, 120, 200]
    description: >
      Nominal channel frequencies in kHz to blank, such as [70, 120, 200];
      every sample on those channels is masked. An empty list keeps every
      channel.
  noise_range_sample_num:
    type: int
    default: 10
    description: "Range samples per bin for the background noise estimate."
  noise_ping_num:
    type: int
    default: 5
    description: "Pings per bin for the background noise estimate."
  noise_snr_threshold:
    type: str
    default: "3.0dB"
    description: >
      Samples whose noise-corrected Sv is less than this above the noise
      estimate are masked, as a dB string such as "3.0dB". Raise it for a
      cleaner, shallower picture.
  noise_background_max:
    type: str
    default: null
    description: >
      Ceiling on the background noise estimate, as a dB string such as
      "-125dB". Null leaves it unbounded.
  range_bin:
    type: str
    default: "2m"
    description: >
      Depth bin height of the MVBS grid, as a length string such as "2m". The
      sparse-bin mask and the cell statistics use the same bin.
  ping_time_bin:
    type: str
    default: "10s"
    description: >
      Ping-time bin width of the MVBS grid, as a duration string such as
      "10s". The sparse-bin mask and the cell statistics use the same bin.
  range_var:
    type: str
    default: "depth"
    description: >
      Variable the bins are built on: "depth" (below the surface, shared
      across files and channels) or "echo_range" (from the transducer face).
  nan_threshold:
    type: float
    default: .99
    description: "Fraction of NaN samples (0 to 1) above which the sparse-bin mask drops a bin."
  dive_chunk_ping_time:
    type: int
    default: 1000
    description: "Ping-time chunk size of the pooled dive store, counted in MVBS time bins."

steps:

  # Declared first; see HOW A DIVE CHAIN RUNS OVER A WHOLE SURVEY.
  - id: plan_dives
    op: custom
    checkpoint: always
    params:
      json_dir: ${inputs.json_dir}
      evl_root: ${inputs.evl_root}
      pad_minutes: ${inputs.pad_minutes}
      include_labels: ${inputs.dive_labels}
    custom_spec:
      description: Turn the NEFSC dive configs into recipe windows.
      callable_path: aa_si_utils.dive_profiles.plan_dive_datasets
      cache_key: dive_profiles_plan_dive_datasets
      version: "1"
      params:
        json_dir: {type: path}
        evl_root: {type: path}
        pad_minutes: {type: float}
        include_labels: {type: list}
      outputs:
        windows: {type: list}
        raw_files: {type: list}
      output_map:
        windows: "['windows']"
        raw_files: "['raw_files']"
      dependency:
        name: aa-si-utils
        version: ">=0.1.0"
        source: git
        url: https://github.com/BLayman-NOAA/AA-SI_Utils.git

  # Survey tier: per-file Sv from the shared cache

  - include: sub_recipes/calibration_from_ncei.yaml
    input_overrides:
      cal_input_folder: ${inputs.cal_input_folder}
      calibration_output_dir: ${inputs.calibration_output_dir}

  # These per-file steps are frozen (see the header of that file), so every
  # crop_survey_range checkpoint already written is a hit here.
  - include: sub_recipes/survey_sv_per_file.yaml
    input_overrides:
      calibration_dict: ${build_cal_mapping.calibration_dict}
      mapping_dict: ${build_cal_mapping.mapping_dict}
      crop_max_range_m: ${inputs.crop_max_range_m}

  # Dive chain: per file, only the pings a dive window touches. Must come
  # directly after the include above; every step maps over the same source, so
  # it joins that chain and sees one file's Sv per instance.

  # snap_to_bin widens each window to whole ping-time bins, so the first and
  # last bins average all their pings; select_window still trims the grid to
  # the true window.
  - id: dive_sv
    op: select_ping_time_range
    map_over: ${query_ncei.raw_urls}
    inputs:
      ds_Sv: ${crop_survey_range.ds_Sv}
    params:
      windows: ${plan_dives.windows}
      allow_empty: true
      snap_to_bin: ${inputs.ping_time_bin}

  - id: dive_surface_mask
    op: create_surface_mask
    map_over: ${query_ncei.raw_urls}
    inputs:
      ds_Sv: ${dive_sv.ds_Sv}
    params:
      surface_depth_m: ${inputs.surface_depth_m}

  - id: dive_frequency_mask
    op: create_frequency_mask
    map_over: ${query_ncei.raw_urls}
    inputs:
      ds_Sv: ${dive_sv.ds_Sv}
    params:
      frequencies_to_mask: ${inputs.frequencies_to_mask}

  # The folder, read whole, onto this file's selected pings. edge_extend_s is
  # left at 0, so a ping outside the line's span is NaN rather than held at
  # the end depth, and seabed_min_coverage makes any such ping a failure.
  - id: dive_seabed_line
    op: read_seafloor_line
    map_over: ${query_ncei.raw_urls}
    inputs:
      ds_Sv: ${dive_sv.ds_Sv}
    params:
      evl_path: ${inputs.seabed_lines_dir}
      min_coverage: ${inputs.seabed_min_coverage}

  - id: dive_seabed_mask
    op: create_seafloor_mask
    map_over: ${query_ncei.raw_urls}
    inputs:
      ds_Sv: ${dive_sv.ds_Sv}
      seafloor_depth: ${dive_seabed_line.seafloor_depth}
    params:
      seafloor_buffer_m: ${inputs.seafloor_buffer_m}

  - id: dive_combine_masks
    op: combine_masks
    map_over: ${query_ncei.raw_urls}
    inputs:
      masks:
        - ${dive_surface_mask.mask}
        - ${dive_frequency_mask.mask}
        - ${dive_seabed_mask.mask}
    params:
      mode: "and"

  - id: dive_apply_mask
    op: apply_sv_mask
    map_over: ${query_ncei.raw_urls}
    inputs:
      ds_Sv: ${dive_sv.ds_Sv}
      mask: ${dive_combine_masks.mask}

  # Now on seabed-masked Sv: the point of this recipe.
  - id: dive_remove_noise
    op: remove_background_noise
    map_over: ${query_ncei.raw_urls}
    inputs:
      ds_Sv: ${dive_apply_mask.ds_Sv}
    params:
      range_sample_num: ${inputs.noise_range_sample_num}
      ping_num: ${inputs.noise_ping_num}
      SNR_threshold: ${inputs.noise_snr_threshold}
      background_noise_max: ${inputs.noise_background_max}

  - id: dive_mask_sparse
    op: mask_sparse_bins
    map_over: ${query_ncei.raw_urls}
    inputs:
      ds_Sv: ${dive_remove_noise.ds_Sv}
    params:
      range_bin: ${inputs.range_bin}
      ping_time_bin: ${inputs.ping_time_bin}
      range_var: ${inputs.range_var}
      nan_threshold: ${inputs.nan_threshold}

  # Pinned depth axis for the same reason the survey tier pins it: every file
  # gets the same range_sample length, so the fan-in has nothing to pad.
  - id: dive_file_mvbs
    op: compute_mvbs
    map_over: ${query_ncei.raw_urls}
    # dive_file_mvbs and dive_cell_stats are collected by the fan-in after
    # read_raw disposes its scratch, so both must be reloaded from a checkpoint
    # rather than carried as a lazy graph over deleted stores.
    checkpoint: always
    inputs:
      ds_Sv: ${dive_mask_sparse.ds_Sv}
    params:
      range_bin: ${inputs.range_bin}
      ping_time_bin: ${inputs.ping_time_bin}
      range_var: ${inputs.range_var}
      range_var_max: ${inputs.mvbs_range_var_max}

  # From the same pre-sparse Sv as the survey tier, now seabed-masked too, so
  # no cell under the seabed carries a CV.
  - id: dive_cell_stats
    op: compute_per_cell_statistics
    map_over: ${query_ncei.raw_urls}
    checkpoint: always
    inputs:
      ds_Sv: ${dive_remove_noise.ds_Sv}
    params:
      range_bin: ${inputs.range_bin}
      ping_time_bin: ${inputs.ping_time_bin}
      range_var: ${inputs.range_var}
      range_var_max: ${inputs.mvbs_range_var_max}
      statistics:
        - cv
      cells_only: true

  # Fan-in: the files no window touched drop out here. Time bins anchor to a
  # global origin, so a file boundary inside a bin makes both files emit it;
  # averaging keeps the index unique.

  - id: merge_dive_files_mvbs
    op: merge_datasets
    collect: ${dive_file_mvbs.ds_MVBS}
    inputs:
      datasets: ${dive_file_mvbs.ds_MVBS}
    params:
      dim: "ping_time"
      on_duplicate: "mean"

  # The pooled dive store on the grid. Checkpointed: it is what this recipe
  # adds, and everything below reads it.
  - id: rechunk_dive_mvbs
    op: rechunk_dataset
    checkpoint: always
    inputs:
      ds_Sv: ${merge_dive_files_mvbs.merged}
    params:
      ping_time_chunk: ${inputs.dive_chunk_ping_time}

  - id: merge_dive_files_cell_stats
    op: merge_datasets
    collect: ${dive_cell_stats.ds_Sv}
    checkpoint: always
    inputs:
      datasets: ${dive_cell_stats.ds_Sv}
    params:
      dim: "cell_ping_time"
      on_duplicate: "mean"

  # User tier: one slice per dive off the pooled grid. As in full_analysis,
  # minus the seabed steps; allow_empty stays at its default so a window that
  # selects no pings fails here.

  - id: select_window
    op: select_ping_time_range
    map_over: ${plan_dives.windows}
    inputs:
      ds_Sv: ${rechunk_dive_mvbs.ds_Sv}
    params:
      window: ${_item}

  - id: select_cell_window
    op: select_ping_time_range
    map_over: ${plan_dives.windows}
    inputs:
      ds_Sv: ${merge_dive_files_cell_stats.merged}
    params:
      window: ${_item}
      dim: "cell_ping_time"

  # Same ids as full_analysis, so everything below is the same text.
  - id: merge_dive_mvbs
    op: merge_datasets
    collect: ${select_window.ds_Sv}
    checkpoint: always
    inputs:
      datasets: ${select_window.ds_Sv}
    params:
      dim: "ping_time"
      on_duplicate: "first"

  - id: merge_dive_cell_stats
    op: merge_datasets
    collect: ${select_cell_window.ds_Sv}
    checkpoint: always
    inputs:
      datasets: ${select_cell_window.ds_Sv}
    params:
      dim: "cell_ping_time"
      on_duplicate: "first"

  # Machine learning over the pooled cells

  - id: reshape_ml
    op: reshape_for_ml
    inputs:
      ds_MVBS: ${merge_dive_mvbs.merged}
    params:
      data_var: "Sv"
      dataset_name: "ml_dataset"
      feature_strategy: "mean_centered"
      baseline_channel: 0

  - id: add_aux_features
    op: add_auxiliary_features
    inputs:
      ds_ml: ${reshape_ml.ds_ml_ready}
      ds_sv: ${merge_dive_cell_stats.merged}
    params:
      dataset_name: "ml_dataset"
      features:
        - cell_cv

  - id: normalize_ml
    op: normalize_ml_data
    checkpoint: always
    inputs:
      ds_ml: ${add_aux_features.ds_ml_ready}
    params:
      method: "flatten"
      dataset_name: "ml_dataset"
      normalization_name: "normalized_flatten_mean_centered"
      shift_positive: false

  # Checkpointed so the report gets the fitted model without refitting. The
  # model saves as pickle, tied to this environment's hdbscan and scikit-learn
  # versions and refused by the shared survey tier. If it fails to load,
  # delete this step's cache entry and the fit reruns once.
  - id: run_hdbscan
    op: run_hdbscan
    checkpoint: always
    inputs:
      ds_normalized: ${normalize_ml.ds_normalized}
    params:
      dataset_name: "ml_dataset"
      normalization_name: "normalized_flatten_mean_centered"
      ml_result_name: "hdbscan_results"
      min_cluster_size_fraction: ${inputs.min_cluster_size_fraction}
      min_samples: ${inputs.min_samples}
      sample_size: ${inputs.sample_size}
      cluster_selection_method: "leaf"
      use_hdbscan: true
      soft_membership_threshold: .1

  # The guard for sample_size binding: cells past the cap would otherwise come
  # back unlabelled. checkpoint: never because embed_results holds the labels,
  # and a rerun gets the model from run_hdbscan's checkpoint.
  - id: label_all_points
    op: assign_clusters_to_all_points
    checkpoint: never
    inputs:
      ds_normalized: ${normalize_ml.ds_normalized}
      clustering_results: ${run_hdbscan.clustering_results}
      clustering_model: ${run_hdbscan.clustering_model}
    params:
      dataset_name: "ml_dataset"
      normalization_name: "normalized_flatten_mean_centered"

  - id: embed_results
    op: embed_clustering_results
    checkpoint: always
    inputs:
      ds_normalized: ${normalize_ml.ds_normalized}
      clustering_results: ${label_all_points.clustering_results}
    params:
      dataset_name: "ml_dataset"
      ml_result_name: "hdbscan_results"

  # Labels come from the embed_results checkpoint. clustering_results and
  # clustering_model feed the HDBSCAN hierarchy panel, loaded from
  # run_hdbscan's checkpoint, so redrawing the report does not refit.
  - id: plot_clustering_report
    op: plot_clustering_report
    regenerate: if-missing
    inputs:
      ds_normalized: ${embed_results.ds_normalized}
      clustering_results: ${run_hdbscan.clustering_results}
      clustering_model: ${run_hdbscan.clustering_model}
      ds_Sv: ${merge_dive_mvbs.merged}
    params:
      dataset_name: "ml_dataset"
      ml_result_name: "hdbscan_results"
      # The op defaults to "datetime"; see THE PLOTS MUST USE x_axis_units: bins
      # in full_analysis.yaml.
      x_axis_units: "bins"
      # Pin a 16:9 panel; the data aspect, about 1300 bins by 1500 m, would
      # otherwise give a panel taller than it is wide.
      y_to_x_aspect_ratio_override: 1.78
      plot_window: [0, 1500] 
      cluster_stats_sv_data_var: "Sv"
      # Per-dive profile and 99% bounds, each dive its own segment; see
      # OVERLAPPING DIVES.
      overlay_windows: ${plan_dives.windows}
      # Each style dict is merged over the op's default, so naming just one
      # key restyles that and leaves the others. linestyle takes matplotlib's
      # spellings: ":" dotted, "--" dashed, "-." dash-dot, "-" solid.
      overlay_fit_style: {color: "#23FFFF", linewidth: 3.0}
      overlay_bound_style: {color: "#D08BFF", linewidth: 1.8, linestyle: ":"}

  # SVCodes and the report tables

  # Per-cell CSVs in the reference layout, plus the per-ping summary the
  # duration table uses: each ping adds its 10 s bin to the code that
  # dominates the cells between its 99% bounds. Each row carries the cell's 18
  # and 38 kHz Sv, so grouping by code describes each cluster. The dive lines
  # are read here, per dive; see OVERLAPPING DIVES.
  - id: generate_sv_codes
    op: custom
    checkpoint: always
    inputs:
      ds: ${embed_results.ds_normalized}
    params:
      windows: ${plan_dives.windows}
      output_dir: ${inputs.code_output_dir}
      dataset_name: "ml_dataset"
      ml_result_name: "hdbscan_results"
      range_var: "depth"
      ping_time_bin_s: 10.0
    custom_spec:
      description: Write per-dive SVCode CSVs from the embedded clustering.
      callable_path: aa_si_utils.dive_profiles.generate_sv_codes
      cache_key: dive_profiles_generate_sv_codes
      version: "2"
      inputs:
        ds: {type: Dataset}
      params:
        windows: {type: list}
        output_dir:
          type: path
          constraints:
            must_exist: false
        dataset_name: {type: str}
        ml_result_name: {type: str}
        range_var: {type: str}
        ping_time_bin_s: {type: float}
      outputs:
        code_csv_paths: {type: list}
        summary_csv_path: {type: path}
        dive_labels: {type: list}
      output_map:
        code_csv_paths: "['code_csv_paths']"
        summary_csv_path: "['summary_csv_path']"
        dive_labels: "['dive_labels']"
      dependency:
        name: aa-si-utils
        version: ">=0.1.0"
        source: git
        url: https://github.com/BLayman-NOAA/AA-SI_Utils.git

  # "Percent of total dive duration the whale spent at 200 m depth intervals
  # per code." Depth comes from the fitted dive profile, not from the cells:
  # the question is how long the whale spent at a depth, and the code says what
  # was around it there.
  - id: sv_code_depth_table
    op: custom
    checkpoint: always
    params:
      summary_csv_path: ${generate_sv_codes.summary_csv_path}
