# Branching off the per-file Sv cache - a worked example
#
# Proves the thing full_analysis.yaml's restructure is supposed to buy:
# that moving the fan-in below MVBS does not cut users off from the Sv. This
# recipe computes no Sv of its own. It reuses the per-file checkpoints the
# survey run already wrote, takes a time window out of them, grids each file
# on its own terms, and fans in only what the window touched.
#
#   [cached]   read_raw -> ... -> crop_survey_range     (3322 cache hits)
#   [new]      window_sv     per file: the window's pings, or nothing
#   [new]      window_mvbs   per file: YOUR bins, on the files that survived
#   [fan-in]   merge_window_mvbs -> the window on your grid
#
#   aa-recipe run sv_window_example.yaml --executor dask --dask-workers 16
#
# No --cache-write-tier survey: this is an analysis, it reads the shared tier
# and writes its own results to the user tier.
#
# HOW THE CACHE IS REACHED, AND THE TWO WAYS TO LOSE IT
#
#   A per-file checkpoint is addressed by derive_instance_hash(base_hash,
#   {"item": <raw file URL>}). The discriminator carries the URL and NO ordinal
#   index, so a recipe mapping over a different-length list still hits the same
#   entries. The base_hash is the catch: it is a Merkle hash over the step's
#   parents, so anything upstream that moves takes every per-file entry with it.
#
#   1. DO NOT narrow the catalogue query to get a subset. query_ncei is a parent
#      of the whole chain; narrowing file_time_start changes every per-file hash
#      and you recompute the survey from raw. Measured, not assumed: all seven
#      chain steps change. Map the whole cruise and select AFTER the fan-out,
#      which is what window_sv below does.
#
#   2. DO NOT edit sub_recipes/survey_sv_per_file.yaml or change what this
#      recipe passes into it. The include below is byte-identical to the one in
#      full_analysis.yaml, down to the input values, because a step
#      fingerprint folds in the pipeline inputs it references. That identity is
#      the whole mechanism, and it is checked: all twelve steps above
#      crop_survey_range hash identically in the two recipes.
#
# WHAT A RUN COSTS
#
#   The chain still visits all 3322 files, but a visited file is cheap. The six
#   members above crop_survey_range are skipped outright, since nothing that
#   still has to run reads them. crop_survey_range is loaded once per file, in
#   the worker, because window_sv reads it there; the client does not load it
#   again to fold the chain, since nothing outside the chain reads it. Then
#   window_sv slices, and for the ~3300 files outside the window that is the
#   end of it: they are EMPTY INSTANCES, and window_mvbs is never invoked for
#   them. The first run of a new window is dominated by those 3322 loads;
#   a second run of the same window prunes the whole chain behind the fan-in's
#   checkpoint and takes seconds.
#
# EMPTY INSTANCES
#
#   select_ping_time_range with allow_empty returns None for a file the window
#   does not touch. Nothing downstream can run on None, so the chain treats
#   every later member that reads it as empty for that file too: no call, None
#   outputs, no checkpoint. merge_datasets drops them when it collects. That is
#   what lets per-file steps sit between the slice and the fan-in. Add masks or
#   noise removal between window_sv and window_mvbs exactly as survey_mvbs.yaml
#   does, and they inherit the same behaviour.
#
# WHY THE GRID IS PER FILE, NOT AFTER THE MERGE
#
#   Concatenating raw per-file Sv on ping_time silently NaN-pads any mismatch
#   in range_sample, and HB1603 has 17 distinct lengths. Within one dive's files
#   they usually agree, but a window is a time range, not a promise about
#   sampling, and the failure is silent: echo_range comes back with NaN in it
#   and every downstream binning reads that. So this recipe never merges raw
#   Sv. It grids each file to your pinned depth axis first, where the file's
#   own range_sample stops mattering, and merges the grids. That is the same
#   correctness argument survey_mvbs.yaml makes, applied to your bins.
#
#   The fan-in uses on_duplicate: "mean" for the same reason the survey tier
#   does: compute_mvbs anchors its time bins to a global origin, so a file
#   boundary inside a bin makes both files emit it, each holding part of its
#   pings. Averaged in the linear domain, unweighted.
#
# WHY window_sv IS DECLARED WHERE IT IS
#
#   Directly after the include, with no step in between. The parser keeps a
#   mapped chain contiguous by DECLARATION order and only groups consecutive
#   members, so a step landing between crop_survey_range and this one splits the
#   chain - and a split chain's members stop sharing an element context, so
#   ${crop_survey_range.ds_Sv} would resolve to the whole 3322-item list instead
#   of this file's Sv.

recipe:
  name: "hb1603_sv_window_example"
  description: "Take a time window out of the cached per-file Sv and grid it your own way, without recomputing Sv."
  version: "1.1"
  author: "<Your Name>"
  schema_version: "1"

inputs:

  # --- These three MUST match full_analysis.yaml exactly -----------
  #
  # They are the inputs the cached chain references, so a different value here
  # is a different fingerprint and a full recompute. Changing one is a decision
  # about the survey tier, not about this analysis.

  cal_input_folder:
    type: path
    default: "../calibration_files/HB201607_cal"
    description: "Manufacturer .cal files. Must match the survey run."
  calibration_output_dir:
    type: path
    default: "./outputs/calibration"
    description: "Must match the survey run."
  crop_max_range_m:
    type: float
    default: 1800.0
    description: "Must match the survey run, or every per-file Sv is recomputed."

  # --- Yours to vary freely -----------------------------------------------
  #
  # Everything below sits under the cached chain, so it changes only this
  # recipe's own steps.

  window_start:
    type: str
    default: "2016-07-07T00:00:00"
    description: "Inclusive ISO lower bound of the window to pull out of the survey."
  window_end:
    type: str
    default: "2016-07-08T00:00:00"
    description: "Inclusive ISO upper bound."
  range_bin:
    type: str
    default: "1m"
    description: >
      Your own depth bin, deliberately finer than the survey store's 2m. The
      point of branching off the Sv rather than the gridded store is that this
      is yours to choose.
  ping_time_bin:
    type: str
    default: "5s"
    description: "Your own ping bin."
  range_var_max:
    type: str
    default: "1810m"
    description: >
      Pinned for the same reason the survey tier pins it: every file gets the
      same depth axis, so the fan-in has nothing to pad, and the step stays
      lazy. Must clear the deepest depth the crop can produce.

steps:

  # --- The cached survey tier, included verbatim ---------------------------

  - include: sub_recipes/calibration_from_ncei.yaml
    input_overrides:
      cal_input_folder: ${inputs.cal_input_folder}
      calibration_output_dir: ${inputs.calibration_output_dir}

  - include: sub_recipes/survey_sv_per_file.yaml
    input_overrides:
      calibration_dict: ${build_cal_mapping.calibration_dict}
      mapping_dict: ${build_cal_mapping.mapping_dict}
      crop_max_range_m: ${inputs.crop_max_range_m}

  # --- The branch: still mapped, still contiguous --------------------------

  # Mapped over the same source as the chain above so it joins that chain and
  # sees one file's Sv per instance. Nothing may be declared between this and
  # the include above; see the header.
  #
  # Not checkpointed: it is a cheap slice of an already-durable input, and
  # caching it would write one entry per catalogue file per window.
  - id: window_sv
    op: select_ping_time_range
    map_over: ${query_ncei.raw_urls}
    inputs:
      ds_Sv: ${crop_survey_range.ds_Sv}
    params:
      start: ${inputs.window_start}
      end: ${inputs.window_end}
      allow_empty: true

  # Your own grid, at your own resolution, per file, on Sv you did not pay to
  # compute. Empty instances from window_sv pass straight through. Not
  # checkpointed either: the fan-in below is the durable product.
  - id: window_mvbs
    op: compute_mvbs
    map_over: ${query_ncei.raw_urls}
    # Collected by the fan-in after read_raw disposes its scratch, so it must
    # be reloaded from a checkpoint rather than carried as a lazy graph.
    checkpoint: always
    inputs:
      ds_Sv: ${window_sv.ds_Sv}
    params:
      range_bin: ${inputs.range_bin}
      ping_time_bin: ${inputs.ping_time_bin}
      range_var: "depth"
      range_var_max: ${inputs.range_var_max}

  # Collects only the files the window touched; the empties are dropped here.
  - id: merge_window_mvbs
    op: merge_datasets
    collect: ${window_mvbs.ds_MVBS}
    checkpoint: always
    inputs:
      datasets: ${window_mvbs.ds_MVBS}
    params:
      dim: "ping_time"
      on_duplicate: "mean"

  # --- Branch out from here ------------------------------------------------
  #
  # merge_window_mvbs.merged is the window on your grid. Anything in
  # full_analysis.yaml's user tier reads a store of exactly this shape.

outputs:
  window_mvbs:
    step_id: merge_window_mvbs
    output_name: merged
