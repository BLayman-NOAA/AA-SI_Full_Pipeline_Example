# Branching off the per-file Sv cache: a worked example.
#
# Shows that fanning in below MVBS does not cut users off from the Sv. This
# recipe computes no Sv: it reuses the survey run's per-file checkpoints,
# takes a time window out of them, grids each file your own way, and fans in
# only what the window touched.
#
#   [cached]   read_raw -> ... -> crop_survey_range     (3322 cache hits)
#   [new]      window_sv     per file: the window's pings, or nothing
#   [new]      window_mvbs   per file: YOUR bins, on the files that survived
#   [fan-in]   merge_window_mvbs -> the window on your grid
#
#   aa-recipe run sv_window_example.yaml --executor dask --dask-workers 16
#
# No --cache-write-tier survey: it reads the shared tier and writes to the user
# tier.
#
# HOW THE CACHE IS REACHED, AND THE TWO WAYS TO LOSE IT
#
#   Per-file checkpoints are keyed on the raw file URL, not list position, but
#   their base hash covers every parent.
#
#   1. Do not narrow the catalogue query: query_ncei is a parent of the whole
#      chain, so every per-file hash changes. Select after the fan-out, as
#      window_sv does.
#   2. Do not edit survey_sv_per_file.yaml or change what this recipe passes
#      into it. The include matches full_analysis.yaml's down to the input
#      values, and all twelve steps through crop_survey_range hash identically.
#
# WHAT A RUN COSTS
#
#   The chain visits all 3322 files, cheaply: the members above
#   crop_survey_range are skipped, crop_survey_range is loaded per file, and
#   window_sv returns nothing for the ~3300 files outside the window, so
#   window_mvbs never runs for them. A second run of the same window prunes the
#   chain behind the fan-in's checkpoint and takes seconds.
#
# EMPTY INSTANCES
#
#   With allow_empty, select_ping_time_range returns None for a file the window
#   misses; every later member is then skipped for that file and merge_datasets
#   drops it. Masks or noise removal added between window_sv and window_mvbs
#   behave the same way.
#
# WHY THE GRID IS PER FILE, NOT AFTER THE MERGE
#
#   Merging raw per-file Sv silently NaN-pads mismatched range_sample lengths,
#   and HB1603 has 17. Gridding each file to the pinned depth axis first makes
#   range_sample irrelevant. on_duplicate "mean" handles a file boundary inside
#   a time bin, as in the survey tier.
#
# WHY window_sv IS DECLARED WHERE IT IS
#
#   Directly after the include: a step between crop_survey_range and window_sv
#   splits the mapped chain, and ${crop_survey_range.ds_Sv} would then resolve
#   to the whole 3322-item list.

recipe:
  name: "hb1603_sv_window_example"
  description: "Take a time window out of the cached per-file Sv and grid it your own way, without recomputing Sv."
  version: "1.1"
  author: "<Your Name>"
  schema_version: "1"

inputs:

  # These three must match full_analysis.yaml exactly: the cached chain
  # references them, so a different value recomputes the survey tier.

  cal_input_folder:
    type: path
    default: "../calibration_files/HB201607_cal"
    description: "Folder of manufacturer calibration files (.cal for EK60, .xml for EK80), a local path or a gs:// URL."
  calibration_output_dir:
    type: path
    default: "./outputs/calibration"
    description: "Root folder the calibration artifacts are written under."
  crop_max_range_m:
    type: float
    default: 1800.0
    description: "Range ceiling in metres; samples beyond it are dropped even if they hold data. Changing it recomputes the whole survey Sv."

  # Yours to vary freely: everything below changes only this recipe's steps.

  window_start:
    type: str
    default: "2016-07-07T00:00:00"
    description: "Inclusive ISO UTC datetime start of the window taken out of the survey Sv."
  window_end:
    type: str
    default: "2016-07-08T00:00:00"
    description: "Inclusive ISO UTC datetime end of the window."
  # Deliberately finer than the survey store's 2m; branching off the Sv rather
  # than the gridded store is what makes it yours to choose.
  range_bin:
    type: str
    default: "1m"
    description: >
      Depth bin height of the window's MVBS grid, as a length string such as
      "1m".
  ping_time_bin:
    type: str
    default: "5s"
    description: >
      Ping-time bin width of the window's MVBS grid, as a duration string such
      as "5s".
  range_var_max:
    type: str
    default: "1810m"
    description: >
      Deepest depth the MVBS grid covers, such as "1810m", pinned so every
      file shares one depth axis. It must clear the range crop plus the
      transducer depth, or the deepest bins are dropped.

steps:

  # The cached survey tier, included verbatim

  - include: sub_recipes/calibration_from_ncei.yaml
    input_overrides:
      cal_input_folder: ${inputs.cal_input_folder}
      calibration_output_dir: ${inputs.calibration_output_dir}

  - include: sub_recipes/survey_sv_per_file.yaml
    input_overrides:
      calibration_dict: ${build_cal_mapping.calibration_dict}
      mapping_dict: ${build_cal_mapping.mapping_dict}
      crop_max_range_m: ${inputs.crop_max_range_m}

  # The branch: still mapped, still contiguous

  # Mapped over the same source so it joins the chain above and sees one file's
  # Sv per instance; see the header. Not checkpointed: a cheap slice of a
  # durable input, which would otherwise write one entry per file per window.
  - id: window_sv
    op: select_ping_time_range
    map_over: ${query_ncei.raw_urls}
    inputs:
      ds_Sv: ${crop_survey_range.ds_Sv}
    params:
      start: ${inputs.window_start}
      end: ${inputs.window_end}
      allow_empty: true

  # Your own grid, per file, on Sv you did not pay to compute. Empty instances
  # from window_sv pass straight through.
  - id: window_mvbs
    op: compute_mvbs
    map_over: ${query_ncei.raw_urls}
    # Collected by the fan-in after read_raw disposes its scratch, so it must
    # be reloaded from a checkpoint rather than carried as a lazy graph.
    checkpoint: always
    inputs:
      ds_Sv: ${window_sv.ds_Sv}
    params:
      range_bin: ${inputs.range_bin}
      ping_time_bin: ${inputs.ping_time_bin}
      range_var: "depth"
      range_var_max: ${inputs.range_var_max}

  # Collects only the files the window touched; the empties are dropped here.
  - id: merge_window_mvbs
    op: merge_datasets
    collect: ${window_mvbs.ds_MVBS}
    checkpoint: always
    inputs:
      datasets: ${window_mvbs.ds_MVBS}
    params:
      dim: "ping_time"
      on_duplicate: "mean"

  # Branch out from here: merge_window_mvbs.merged is the window on your grid,
  # the same shape full_analysis.yaml's user tier reads.

outputs:
  window_mvbs:
    step_id: merge_window_mvbs
    output_name: merged
