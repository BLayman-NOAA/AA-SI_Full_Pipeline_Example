# HB1603 demo dive analysis: dive_analysis.yaml narrowed to one dive.
#
# A small recipe for testing and demonstrating the recipe manager client: dive
# SWD_20160814-OE09 (14:54 to 15:06 UTC) over the three raw files of
# demo_survey_sv.yaml. OE09 is on the 1000 W side of the cruise, so its 18 and
# 38 kHz match the 18 July calibration outright.
#
# Run from this folder, the survey first:
#
#   aa-recipe run demo_survey_sv.yaml --cache-write-tier survey
#   aa-recipe run demo_dive_analysis.yaml
#
# Levels 0 to 2a match demo_survey_sv.yaml and load from ./demo/survey_cache.
# Level 2b reads the uncropped Sv, which is not checkpointed, so this run
# streams the dive files again. Caches, scratch and outputs go under ./demo,
# set in demo_dive_analysis.config.yaml. The user-level values are
# dive_analysis.yaml's, apart from the dive list and the output folder.

recipe:
  name: "hb1603_demo_dive_analysis"
  description: "HDBSCAN clustering and SVCodes for one HB1603 dive over three raw files, for client demos."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:

  # Survey level: must equal demo_survey_sv.yaml's, or the cached survey chain
  # is recomputed.
  cal_input_folder:
    type: path
    default: "../calibration_files/HB201607_cal"
    description: "Folder of manufacturer calibration files (.cal for EK60, .xml for EK80), a local path or a gs:// URL."
  calibration_output_dir:
    type: path
    default: "./demo/outputs/calibration"
    description: "Root folder the calibration artifacts are written under."
  crop_max_range_m:
    type: float
    default: 1800.0
    description: "Range ceiling in metres; samples beyond it are dropped even if they hold data. Changing it recomputes the whole survey Sv."

  # Shared by levels 2b, 3 and 5; wire all three from this one input.
  ping_time_bin:
    type: str
    default: "10s"
    description: >
      Ping-time bin width of the MVBS grid, as a duration string such as
      "10s". The sparse-bin mask, the cell statistics and the SVCode duration
      tables use the same bin.

steps:

  - include: sub_recipes/dive_plan.yaml
    input_overrides:
      json_dir: "./Auxiliary/JSON_Files"
      evl_root: "./Auxiliary"
      pad_minutes: 0.0
      dive_labels:
        - "SWD_20160814-OE09"

  # Survey levels: keep in step with demo_survey_sv.yaml.

  - include: sub_recipes/processing_lvl_0_user.yaml
    input_overrides:
      cal_input_folder: ${inputs.cal_input_folder}
      calibration_output_dir: ${inputs.calibration_output_dir}
      file_time_start: "2016-08-14T14:40:00"
      file_time_end: "2016-08-14T15:25:00"

  - include: sub_recipes/processing_lvl_1_per_file.yaml
    input_overrides:
      per_file_source: ${query_ncei.raw_urls}

  - include: sub_recipes/processing_lvl_2_survey.yaml
    input_overrides:
      per_file_source: ${query_ncei.raw_urls}
      calibration_dict: ${build_cal_mapping.calibration_dict}
      mapping_dict: ${build_cal_mapping.mapping_dict}
      crop_max_range_m: ${inputs.crop_max_range_m}

  # User levels.

  - include: sub_recipes/processing_lvl_2_user.yaml
    input_overrides:
      per_file_source: ${query_ncei.raw_urls}
      sv_source: ${ep_add_depth.ds_Sv}
      dive_windows: ${plan_dives.windows}
      ping_time_bin: ${inputs.ping_time_bin}
      dive_depth_offset: 0.0
      surface_depth_m: 10.0
      frequencies_to_mask: [70, 120, 200]
      seabed_lines_dir: "./Auxiliary/seabed_lines"
      seabed_min_coverage: 0.99
      seafloor_buffer_m: 10.0
      noise_range_sample_num: 10
      noise_ping_num: 5
      noise_snr_threshold: "6.0dB"
      noise_background_max: "-66dB"

  - include: sub_recipes/processing_lvl_3_user.yaml
    input_overrides:
      per_file_source: ${query_ncei.raw_urls}
      ping_time_bin: ${inputs.ping_time_bin}
      range_bin: "2m"
      range_var: "depth"
      nan_threshold: 0.99
      mvbs_range_var_max: "3010m"
      dive_chunk_ping_time: 1000

  - include: sub_recipes/processing_lvl_4.yaml
    input_overrides:
      mvbs: ${rechunk_dive_mvbs.ds_Sv}
      cell_stats_sv: ${merge_dive_files_cell_stats.merged}
      dive_windows: ${plan_dives.windows}
      sample_size: 1200000
      min_cluster_size_fraction: 0.01
      min_samples: 4

  - include: sub_recipes/processing_lvl_5_sv_codes.yaml
    input_overrides:
      clustered: ${embed_results.ds_normalized}
      dive_windows: ${plan_dives.windows}
      ping_time_bin: ${inputs.ping_time_bin}
      code_output_dir: "./demo/outputs/sv_codes"
      depth_interval_m: 200.0
