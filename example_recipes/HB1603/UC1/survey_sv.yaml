# HB1603 survey Sv: the shared artifact, levels 0 to 2a.
#
# The survey-level recipe of the survey/user split, and the only one that
# builds the calibration and computes Sv from raw: one checkpointed,
# range-cropped Sv per catalogue file, 3322 of them. Run it once per cruise
# into the shared tier:
#
#   aa-recipe run survey_sv.yaml --executor dask --dask-workers 16 --cache-write-tier survey
#
#   level 0 (survey)  catalogue, channel scan, calibration files and mapping
#   level 1           per file: raw ingest
#   level 2a          per file: calibration parameters, Sv, surface-referenced
#                     depth, range crop
#
# It stops at the crop: range_sample differs between HB1603 files, so the
# survey cannot be merged at full resolution, and everything past the crop is
# an analyst's choice. dive_analysis.yaml picks up from crop_survey_range.
#
# survey_preprocess.yaml's first two includes are these same twelve steps with
# the same hashes, so running either fills the same cache entries.

recipe:
  name: "hb1603_survey_sv"
  description: "Per-file, range-cropped Sv for the whole HB1603 cruise, streamed from NCEI."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  cal_input_folder:
    type: path
    default: "../calibration_files/HB201607_cal"
    description: "Folder of manufacturer calibration files (.cal for EK60, .xml for EK80), a local path or a gs:// URL."
  calibration_output_dir:
    type: path
    default: "./outputs/calibration"
    description: "Root folder the calibration artifacts are written under."
  crop_max_range_m:
    type: float
    default: 1800.0
    description: "Range ceiling in metres; samples beyond it are dropped even if they hold data. Changing it recomputes the whole survey Sv."

steps:

  - include: sub_recipes/processing_lvl_0_survey.yaml
    input_overrides:
      cal_input_folder: ${inputs.cal_input_folder}
      calibration_output_dir: ${inputs.calibration_output_dir}

  - include: sub_recipes/processing_lvl_1_per_file.yaml
    input_overrides:
      per_file_source: ${query_ncei.raw_urls}

  - include: sub_recipes/processing_lvl_2_survey.yaml
    input_overrides:
      per_file_source: ${query_ncei.raw_urls}
      calibration_dict: ${build_cal_mapping.calibration_dict}
      mapping_dict: ${build_cal_mapping.mapping_dict}
      crop_max_range_m: ${inputs.crop_max_range_m}
