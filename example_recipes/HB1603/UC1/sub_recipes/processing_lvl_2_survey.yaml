# Processing level 2a (survey): per-file Sv and depth, cropped. No fan-in.
#
#   compute_sv -> compute_transducer_depth -> ep_add_depth -> crop_range
#
# The survey half of level 2, and the boundary of the shared artifact: the
# checkpointed per-file Sv at crop_survey_range. It is computed once per
# cruise. Every user recipe includes this file verbatim, hits those entries,
# and picks up from crop_survey_range.
#
# WHY THERE IS NO SURVEY FAN-IN
#
#
#   range_sample is not a shared axis across HB1603. max_range_m is a ceiling,
#   not a fixed length, and the cruise runs sample intervals differing by about
#   11x, so the per-file Sv comes back with 17 distinct range_sample lengths
#   between 1017 and 11289. Concatenating on ping_time outer-joins all of them
#   up to the longest and NaN-pads the rest, which puts NaN into echo_range,
#   where every downstream range binning reads it. Sample index k is also a
#   different depth in different files, so even equal lengths would silently
#   stack incomparable depths.
#
#   So the survey cannot be merged at this level at all. What it CAN do is hand
#   out per-file Sv, and let each consumer bin onto a shared physical grid
#   before it fans in. processing_lvl_2_user.yaml and processing_lvl_3_user.yaml are that
#   consumer for the dive analysis.
#
# THE STEPS BELOW ARE FROZEN
#
#   Same rule as level 1. crop_max_range_m is shared with every consumer: a
#   different ceiling is a different fingerprint and a full recompute. Keep it
#   generous. Nothing below about 1400 m is coded by the dive analysis, but the
#   quiet water between the deepest dive cell and the ceiling is where the
#   noise estimator in level 2b finds its floor.

recipe:
  name: "hb1603_processing_lvl_2_survey"
  description: "Per-file Sv with surface-referenced depth, cropped. The shared survey artifact."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  crop_max_range_m:
    type: float
    default: 1800.0
    description: "Fixed range ceiling applied per file. See the note above before changing."

steps:

  - id: compute_sv
    op: compute_sv
    map_over: ${query_ncei.raw_urls}
    checkpoint: always
    inputs:
      echodata: ${combine_raw.echodata}
      cal_params: ${extract_cal_params.cal_params}
      env_params: ${extract_cal_params.env_params}

  # The vertical reference, computed explicitly rather than left to
  # echopype's use_platform_vertical_offsets. On an EK60 file that setting is
  # wrong by twice the transducer draft: the ER60 leaves transducer_offset_z
  # at zero and echopype maps the per-ping transducer depth into water_level,
  # which the formula subtracts, so the transducer lands 8.92 m ABOVE the sea
  # surface instead of below it. Measured on HB1603: depth came out
  # echo_range - 8.92 where it should be echo_range + 8.92.
  #
  # Everything vertical in this workflow depends on getting this right. The
  # dive profiles, their 99% CI bounds and the seabed lines are all Echoview
  # EVL files referenced to the sea surface, and the report bins by depth.
  #
  # The heave sign is inherited from HB2407, where it was verified against a
  # hand-drawn EVL seabed line. It has not been verified here. It could be:
  # the seabed is inside crop_max_range_m on 25 July and 14 August, as shallow
  # as 1333 m, so the same comparison against the Echoview seabed lines is
  # available. The term is worth at most +/- 0.45 m against a 2 m depth bin,
  # so it is carried rather than tuned.
  - id: compute_transducer_depth
    op: compute_transducer_depth
    map_over: ${query_ncei.raw_urls}
    checkpoint: always
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
      echodata: ${combine_raw.echodata}
    params:
      use_heave: true
      heave_sign: 1.0

  # Surface-referenced depth, added here because it needs this file's
  # EchoData, which the fan-in below is the last point that still has.
  - id: ep_add_depth
    op: ep_add_depth
    map_over: ${query_ncei.raw_urls}
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
      echodata: ${combine_raw.echodata}
    params:
      depth_offset: ${compute_transducer_depth.transducer_depth}

  # checkpoint: always because this is the chain's surviving output and
  # read_raw's stores are disposable. The client reloads a checkpointed member
  # from the cache when it folds the chain in (_member_outputs), so the fan-in
  # below reads durable artifacts; left uncheckpointed it would carry a dask
  # graph still rooted in the exe_temp store that disposal has just deleted.
  # This is what lets exe_temp hold one store per concurrent worker instead of
  # one per file in the survey.
  - id: crop_survey_range
    op: crop_range
    map_over: ${query_ncei.raw_urls}
    checkpoint: always
    inputs:
      ds_Sv: ${ep_add_depth.ds_Sv}
    params:
      max_range_m: ${inputs.crop_max_range_m}
      drop_trailing_all_nan: false
      outlier_sigma: null
