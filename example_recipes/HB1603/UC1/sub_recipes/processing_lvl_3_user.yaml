# Processing level 3 (user): sparse masking, MVBS and per-cell statistics.
#
#   [per file]  mask_sparse_bins -> compute_mvbs (pinned depth grid)
#               compute_per_cell_statistics (from the pre-sparse Sv)
#   [fan-in]    merge the files a dive window touched -> the pooled dive grid
#   [per dive]  one slice per dive off the pooled grid, fanned back in
#
# The first three steps continue the per-file chain from level 2b, so include
# this file directly after it. The fan-in belongs here and not at level 2
# because range_sample is not a shared axis across HB1603: files can only be
# merged once they are on the pinned depth grid.
#
# The per-cell CV comes off the same denoised Sv the grid is built from, which
# in this recipe set is already seabed-masked, so no cell under the seabed
# carries a statistic.
#
# THE PER-FILE FAN-IN AVERAGES, THE PER-DIVE FAN-IN TAKES THE FIRST
#
#   compute_mvbs and compute_per_cell_statistics anchor their time bins to a
#   global origin, so a file boundary landing inside a bin makes both files
#   emit that bin, each holding part of its pings. on_duplicate "mean" is what
#   keeps the merged index unique there. The per-dive slices are cut from one
#   pooled store, so a duplicate between them is the same cell twice and
#   "first" is exact.
#
# OVERLAPPING DIVES
#
#   OE29/OE32 on 7 July share ten minutes and OE61/OE62/OE64 on 25 July share
#   eleven to fourteen minutes each. The union select keeps each shared ping
#   once per file, so the pooled grid is built without duplicates. The user
#   tier below still slices per dive and fans back in with on_duplicate
#   "first", exactly as full_analysis does: it costs nothing, keeps the
#   downstream identical, and fails loudly if a window selects no pings,
#   which the union select alone would not.
#
#   A dive's lines still cannot ride on the merged dataset (two whales, one
#   ping, one variable), so generate_sv_codes and the report read each dive's
#   lines onto its own slice from the paths on its window, as before.

recipe:
  name: "hb1603_processing_lvl_3_user"
  description: "Per-file sparse masking, MVBS on a pinned depth grid and per-cell CV, fanned in and sliced per dive."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  dive_windows:
    type: list
    description: >
      Window dicts, one per dive, each with start and end. Wire it to
      plan_dives.windows. Any list of windows works, which is what lets this
      level serve an analysis other than the dives.
  range_bin:
    type: str
    default: "2m"
    description: "Depth bin of the per-dive grid."
  ping_time_bin:
    type: str
    default: "10s"
    description: "Ping-time bin of the per-dive grid."
  range_var:
    type: str
    default: "depth"
    description: "Variable the bins are built on. depth keeps the grid shared across files."
  nan_threshold:
    type: float
    default: .99
    description: "Fraction of a bin that may be NaN before the bin is dropped."
  mvbs_range_var_max:
    type: str
    default: "1810m"
    description: >
      Depth the per-window MVBS grid is built out to, as the unit string
      echopype parses. It is pinned rather than measured so every window shares
      one depth axis and the fan-in has nothing to pad.

      It must clear the deepest depth the survey tier can produce, which is not
      crop_max_range_m: the crop is applied to echo_range, range from the
      transducer, while depth adds the transducer's own depth below the surface
      on top of it. HB1603's transducer sits about 8.9 m down, so a 1800 m
      echo_range ceiling reaches roughly 1809 m of depth and 1810 m is the next
      2 m bin edge above it. Raise both together, and keep the margin if you
      move the crop: a ceiling below the data silently drops the deepest bins.
  dive_chunk_ping_time:
    type: int
    default: 1000
    description: "Ping-time chunk of the pooled dive store, on the MVBS grid."

steps:

  - id: dive_mask_sparse
    op: mask_sparse_bins
    map_over: ${query_ncei.raw_urls}
    inputs:
      ds_Sv: ${dive_remove_noise.ds_Sv}
    params:
      range_bin: ${inputs.range_bin}
      ping_time_bin: ${inputs.ping_time_bin}
      range_var: ${inputs.range_var}
      nan_threshold: ${inputs.nan_threshold}

  # Pinned depth axis for the same reason the survey tier pins it: every file
  # gets the same range_sample length, so the fan-in has nothing to pad.
  - id: dive_file_mvbs
    op: compute_mvbs
    map_over: ${query_ncei.raw_urls}
    inputs:
      ds_Sv: ${dive_mask_sparse.ds_Sv}
    params:
      range_bin: ${inputs.range_bin}
      ping_time_bin: ${inputs.ping_time_bin}
      range_var: ${inputs.range_var}
      range_var_max: ${inputs.mvbs_range_var_max}

  # From the same pre-sparse Sv as the survey tier, now seabed-masked too, so
  # no cell under the seabed carries a CV.
  - id: dive_cell_stats
    op: compute_per_cell_statistics
    map_over: ${query_ncei.raw_urls}
    inputs:
      ds_Sv: ${dive_remove_noise.ds_Sv}
    params:
      range_bin: ${inputs.range_bin}
      ping_time_bin: ${inputs.ping_time_bin}
      range_var: ${inputs.range_var}
      range_var_max: ${inputs.mvbs_range_var_max}
      statistics:
        - cv
      cells_only: true

  - id: merge_dive_files_mvbs
    op: merge_datasets
    collect: ${dive_file_mvbs.ds_MVBS}
    inputs:
      datasets: ${dive_file_mvbs.ds_MVBS}
    params:
      dim: "ping_time"
      on_duplicate: "mean"

  # The pooled dive store on the grid. Checkpointed: it is what this recipe
  # adds, and everything below reads it.
  - id: rechunk_dive_mvbs
    op: rechunk_dataset
    checkpoint: always
    inputs:
      ds_Sv: ${merge_dive_files_mvbs.merged}
    params:
      ping_time_chunk: ${inputs.dive_chunk_ping_time}

  - id: merge_dive_files_cell_stats
    op: merge_datasets
    collect: ${dive_cell_stats.ds_Sv}
    checkpoint: always
    inputs:
      datasets: ${dive_cell_stats.ds_Sv}
    params:
      dim: "cell_ping_time"
      on_duplicate: "mean"

  - id: select_window
    op: select_ping_time_range
    map_over: ${inputs.dive_windows}
    inputs:
      ds_Sv: ${rechunk_dive_mvbs.ds_Sv}
    params:
      window: ${_item}

  - id: select_cell_window
    op: select_ping_time_range
    map_over: ${inputs.dive_windows}
    inputs:
      ds_Sv: ${merge_dive_files_cell_stats.merged}
    params:
      window: ${_item}
      dim: "cell_ping_time"

  # Same ids as full_analysis, so everything below is the same text.
  - id: merge_dive_mvbs
    op: merge_datasets
    collect: ${select_window.ds_Sv}
    checkpoint: always
    inputs:
      datasets: ${select_window.ds_Sv}
    params:
      dim: "ping_time"
      on_duplicate: "first"

  - id: merge_dive_cell_stats
    op: merge_datasets
    collect: ${select_cell_window.ds_Sv}
    checkpoint: always
    inputs:
      datasets: ${select_cell_window.ds_Sv}
    params:
      dim: "cell_ping_time"
      on_duplicate: "first"
