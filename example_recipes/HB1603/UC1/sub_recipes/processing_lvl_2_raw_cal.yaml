# Processing level 2a (raw calibration): per-file Sv from the file's own
# gains and environment, transducer depth without heave, cropped.
#
#   compute_sv -> compute_transducer_depth -> crop_range
#
# The raw-calibration counterpart of processing_lvl_2_survey.yaml, for
# dive_analysis_raw_cal.yaml:
#
#   * compute_sv gets no calibration or environment, so echopype uses each
#     file's recorded gains, sound speed (1522.6 to 1543.3 m/s over the
#     cruise) and absorption, as the NEFSC reference analysis did. The survey
#     tier applies the 18 July calibration day's values to every file.
#   * compute_transducer_depth runs without heave: the file's static depth,
#     6 or 9 m on the dive dates, on every ping.
#   * No ep_add_depth: level 2b adds depth once. crop_range needs only
#     echo_range.
#
# compute_sv's inputs differ from the survey's, so every hash from here down is
# this path's own; hence the chain maps over the dive files only.

recipe:
  name: "hb1603_processing_lvl_2_raw_cal"
  description: "Per-file Sv from raw-file calibration and environment, static transducer depth, range crop."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  per_file_source:
    type: str
    description: >
      The step output list the per-file steps map over, one instance per
      entry, normally ${query_ncei.raw_urls}. Required; give every level in
      the chain the same value.
  crop_max_range_m:
    type: float
    default: 1800.0
    description: >
      Range ceiling in metres; samples beyond it are dropped even if they hold
      data. Unset keeps the whole recorded range.

steps:

  # Handed nothing but the EchoData: gains and environment come from the file.
  - id: compute_sv
    op: compute_sv
    map_over: ${inputs.per_file_source}
    checkpoint: always
    inputs:
      echodata: ${combine_raw.echodata}

  # Reads the ER60 per-ping transducer depth, which echopype's own
  # platform-offset formula gets the wrong sign on for EK60. Without heave it
  # is one value per file, so level 2b can add it to a windowed subset.
  - id: compute_transducer_depth
    op: compute_transducer_depth
    map_over: ${inputs.per_file_source}
    checkpoint: always
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
      echodata: ${combine_raw.echodata}
    params:
      use_heave: false

  # The chain's surviving per-file output, so it is checkpointed and read_raw's
  # scratch stores can be disposed of as instances finish.
  - id: crop_dive_range
    op: crop_range
    map_over: ${inputs.per_file_source}
    checkpoint: always
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
    params:
      max_range_m: ${inputs.crop_max_range_m}
      drop_trailing_all_nan: false
      outlier_sigma: null
