# HB1603 Per-File Sv - the survey tier's shared, fannable-out half
#
# read_raw -> combine_raw -> extract_cal_params -> compute_sv
#          -> compute_transducer_depth -> ep_add_depth -> crop_range
#
# One chain, mapped over the catalogue's raw URLs, ending at a checkpointed
# per-file Sv. There is deliberately NO fan-in here.
#
# WHY THIS IS ITS OWN FILE
#
#   range_sample is not a shared axis across HB1603. max_range_m is a ceiling,
#   not a fixed length, and the cruise runs sample intervals differing by about
#   11x, so the per-file Sv comes back with 17 distinct range_sample lengths
#   between 1017 and 11289. Concatenating on ping_time outer-joins all of them
#   up to the longest and NaN-pads the rest, which puts NaN into echo_range,
#   where every downstream range binning reads it. Sample index k is also a
#   different depth in different files, so even equal lengths would silently
#   stack incomparable depths.
#
#   So the survey cannot be merged at this level at all. What it CAN do is hand
#   out per-file Sv, and let each consumer bin onto a shared physical grid
#   before it fans in. survey_mvbs.yaml is one such consumer; a user recipe
#   selecting its own window is another.
#
# THE STEPS BELOW ARE BYTE-IDENTICAL TO survey_sv.yaml
#
#   A step's fingerprint folds in its wiring, params and parents, not the file
#   it was declared in, so every recipe including this file addresses the same
#   per-file checkpoints. That is what lets a new analysis reuse Sv it did not
#   compute. Editing anything here invalidates the whole survey tier, so treat
#   these steps as frozen and put new work in the recipe that includes them.
#
#   Instances are content-addressed on the raw file URL with no ordinal index,
#   so list position does not matter. The catalogue query DOES: query_ncei is a
#   parent, and narrowing file_time_start moves every hash beneath it. Never
#   narrow the query to get a subset - map the whole cruise and select after
#   the fan-out.

recipe:
  name: "hb1603_survey_sv_per_file"
  description: "Per-file Sv and depth streamed from NCEI. No fan-in: range_sample is not a shared axis."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  calibration_dict:
    type: dict
    description: "Standardized calibration data, from build_cal_mapping."
  mapping_dict:
    type: dict
    description: "Raw channel to calibration key mapping, from build_cal_mapping."
  sonar_model:
    type: str
    default: "EK60"
    description: "Sonar model string for echopype."
  crop_max_range_m:
    type: float
    default: 1800.0
    description: "Fixed range ceiling applied per file. See the note above before changing."

steps:

  # --- Per-file chain, mapped over the catalogue's raw URLs ---------------

  # checkpoint: never because the output is an exe_temp store path that the
  # run deletes; the Sv below is what is worth caching. Mapping over plain URL
  # strings keeps each instance content-addressed by its own file, so an
  # interrupted survey resumes from what it already converted.
  #
  # intermediate_format IS THE RUN'S LARGEST CONSUMER OF LOCAL DISK
  #
  #   temp_dir/data is cleared once, when the run ends, not as instances
  #   finish. So "zarr" and "netcdf" both leave one store per CATALOGUE FILE on
  #   disk simultaneously - per file, not per worker, so changing the worker
  #   count does not change the total. Measured on the three-dive smoke test:
  #   335 files in the slice, 36+ GB in exe_temp.
  #
  #   "zarr" is what lets those stores live on a bucket instead, by pointing
  #   temp_dir at a gs:// URL. "none" writes nothing at all and holds each
  #   file's EchoData in memory, which does scale with worker count and has
  #   read_raw_files' use_swap="auto" as its backstop.
  #
  #   It is a literal rather than an input on purpose: a step's fingerprint
  #   folds in the pipeline inputs it references, so merely wiring this to an
  #   input changes read_raw's hash and re-runs the whole survey tier even when
  #   the value is unchanged. Editing the literal costs the same recompute, but
  #   only when you actually change it.
  - id: read_raw
    op: read_raw_files
    map_over: ${query_ncei.raw_urls}
    checkpoint: never
    # Delete each file's intermediate store as soon as its instance finishes,
    # instead of letting temp_dir/data grow to one store per catalogue file.
    # Safe because crop_survey_range below is checkpointed: the client reloads
    # a checkpointed member from the cache when it folds the chain in, so
    # nothing that outlives the instance is still rooted in the deleted store.
    dispose_outputs: [raw_stores]
    execution:
      dask_config:
        scheduler: processes
    inputs:
      raw_file_paths:
        - ${_item}
    params:
      sonar_model: ${inputs.sonar_model}
      include_bot: false
      intermediate_format: "zarr"

  - id: combine_raw
    op: combine_raw_files
    map_over: ${query_ncei.raw_urls}
    inputs:
      raw_stores: ${read_raw.raw_stores}

  # Path(url).name gives the bare filename, which is the key the calibration
  # mapping is built under, so a URL resolves the same as a local path would.
  #
  # unmapped_channels is left at its "warn" default, so a channel no
  # calibration file matched falls back to the values the raw file records for
  # it and says so on the terminal. Set it to "error" for a survey where an
  # unmatched channel should stop the run.
  #
  # HB1603 needs this, but not for the transmit power difference the match
  # tolerance in calibration_from_ncei.yaml now covers. It is pulse length: on
  # the first 151 files of the cruise, 27 and 28 June, the 18 kHz channel ran
  # at 2.048 ms and 120 and 200 kHz at 0.256 ms, against calibrations measured
  # at 1.024 ms. 120 and 200 kHz transmit at exactly their calibrated power, so
  # no power tolerance reaches them. Widening transmit_duration_nominal is not
  # the answer either: pulse length sets the effective pulse duration and the
  # equivalent beam correction, so a 2x or 4x difference is a different
  # measurement rather than a tolerance question. Those files end on 28 June
  # and the earliest dive is 7 July, so no dive is affected, but the merged
  # survey Sv store does carry them on fallback calibration.
  #
  # mapping_files/calibration_provenance.yaml is where that is written down
  # per channel, with the time range of each stretch and the field behind it.
  - id: extract_cal_params
    op: extract_standardized_cal_params
    map_over: ${query_ncei.raw_urls}
    inputs:
      calibration_dict: ${inputs.calibration_dict}
      mapping_dict: ${inputs.mapping_dict}
      echodata: ${combine_raw.echodata}
    params:
      raw_file_path: ${_item}

  - id: compute_sv
    op: compute_sv
    map_over: ${query_ncei.raw_urls}
    checkpoint: always
    inputs:
      echodata: ${combine_raw.echodata}
      cal_params: ${extract_cal_params.cal_params}
      env_params: ${extract_cal_params.env_params}

  # The vertical reference, computed explicitly rather than left to
  # echopype's use_platform_vertical_offsets. On an EK60 file that setting is
  # wrong by twice the transducer draft: the ER60 leaves transducer_offset_z
  # at zero and echopype maps the per-ping transducer depth into water_level,
  # which the formula subtracts, so the transducer lands 8.92 m ABOVE the sea
  # surface instead of below it. Measured on HB1603: depth came out
  # echo_range - 8.92 where it should be echo_range + 8.92.
  #
  # Everything vertical in this workflow depends on getting this right. The
  # dive profiles, their 99% CI bounds and the seabed lines are all Echoview
  # EVL files referenced to the sea surface, and the report bins by depth.
  #
  # The heave sign is inherited from HB2407, where it was verified against a
  # hand-drawn EVL seabed line. It cannot be verified the same way here: the
  # HB1603 seabed sits near 2990 m, well below crop_max_range_m, so it is not
  # in this data at all. The term is worth at most +/- 0.45 m against a 2 m
  # depth bin, so it is carried rather than tuned, but it is not confirmed.
  - id: compute_transducer_depth
    op: compute_transducer_depth
    map_over: ${query_ncei.raw_urls}
    checkpoint: always
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
      echodata: ${combine_raw.echodata}
    params:
      use_heave: true
      heave_sign: 1.0

  # Surface-referenced depth, added here because it needs this file's
  # EchoData, which the fan-in below is the last point that still has.
  - id: ep_add_depth
    op: ep_add_depth
    map_over: ${query_ncei.raw_urls}
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
      echodata: ${combine_raw.echodata}
    params:
      depth_offset: ${compute_transducer_depth.transducer_depth}

  # checkpoint: always because this is the chain's surviving output and
  # read_raw's stores are disposable. The client reloads a checkpointed member
  # from the cache when it folds the chain in (_member_outputs), so the fan-in
  # below reads durable artifacts; left uncheckpointed it would carry a dask
  # graph still rooted in the exe_temp store that disposal has just deleted.
  # This is what lets exe_temp hold one store per concurrent worker instead of
  # one per file in the survey.
  - id: crop_survey_range
    op: crop_range
    map_over: ${query_ncei.raw_urls}
    checkpoint: always
    inputs:
      ds_Sv: ${ep_add_depth.ds_Sv}
    params:
      max_range_m: ${inputs.crop_max_range_m}
      drop_trailing_all_nan: false
      outlier_sigma: null
