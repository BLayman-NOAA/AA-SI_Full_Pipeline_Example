# HB1603 per-file Sv: the survey tier's shared, mapped half.
#
#   read_raw -> combine_raw -> extract_cal_params -> compute_sv
#            -> compute_transducer_depth -> ep_add_depth -> crop_range
#
# One chain, mapped over the catalogue's raw URLs, ending at a checkpointed
# per-file Sv, with no fan-in: range_sample is not a shared axis across HB1603
# (17 lengths from 1017 to 11289, and sample k is a different depth in
# different files), so each consumer bins onto a shared depth grid before it
# fans in. survey_mvbs.yaml is one such consumer; sv_window_example.yaml is
# another.
#
# THE STEPS BELOW ARE FROZEN
#
#   A fingerprint folds in wiring, params and parents, not the declaring file,
#   so survey_preprocess.yaml, full_analysis.yaml and sv_window_example.yaml
#   all hit the same 3322 crop_survey_range entries. Editing anything here
#   invalidates the survey tier; put new work in the including recipe.
#   Instances are keyed on the raw file URL, but query_ncei is a parent: never
#   narrow the query to get a subset, select after the fan-out.

recipe:
  name: "hb1603_survey_sv_per_file"
  description: "Per-file Sv and depth streamed from NCEI. No fan-in: range_sample is not a shared axis."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  calibration_dict:
    type: dict
    description: "Standardized calibration values keyed by calibration key, from the calibration mapping step."
  mapping_dict:
    type: dict
    description: "Mapping from each raw file's channels to their calibration key, from the calibration mapping step."
  sonar_model:
    type: str
    default: "EK60"
    description: >
      Echosounder model as echopype names it, such as "EK60" or "EK80".
  crop_max_range_m:
    type: float
    default: 1800.0
    description: "Range ceiling in metres; samples beyond it are dropped even if they hold data. Changing it recomputes the whole survey Sv."

steps:

  # Per-file chain, mapped over the catalogue's raw URLs

  # checkpoint: never because the output is a scratch store the run deletes.
  # Keyed on its own URL, each instance resumes independently.
  #
  # intermediate_format is the run's largest local disk consumer: "zarr" and
  # "netcdf" keep one store per catalogue file until the run ends unless
  # disposed (below). "zarr" can live on a bucket through a gs:// temp_dir;
  # "none" holds each file's EchoData in memory instead. It is a literal, not
  # an input, because wiring it to an input changes read_raw's hash.
  - id: read_raw
    op: read_raw_files
    map_over: ${query_ncei.raw_urls}
    checkpoint: never
    # Delete each file's store when its instance finishes. Safe because
    # crop_survey_range is checkpointed, so nothing that outlives the instance
    # still reads the deleted store.
    dispose_outputs: [raw_stores]
    execution:
      dask_config:
        scheduler: processes
    inputs:
      raw_file_paths:
        - ${_item}
    params:
      sonar_model: ${inputs.sonar_model}
      include_bot: false
      intermediate_format: "zarr"

  - id: combine_raw
    op: combine_raw_files
    map_over: ${query_ncei.raw_urls}
    inputs:
      raw_stores: ${read_raw.raw_stores}

  # Path(url).name is the key the calibration mapping is built under, so a URL
  # resolves like a local path.
  #
  # unmapped_channels stays at "warn": a channel no calibration matched uses
  # the raw file's own values, with a warning. HB1603 needs this for pulse
  # length, not power: on the first 151 files (27 and 28 June) 18 kHz ran at
  # 2.048 ms and 120 and 200 kHz at 0.256 ms, against calibrations at 1.024 ms,
  # a different measurement rather than a tolerance question. No dive is
  # affected (the first is 7 July). mapping_files/calibration_provenance.yaml
  # records it per channel.
  - id: extract_cal_params
    op: extract_standardized_cal_params
    map_over: ${query_ncei.raw_urls}
    inputs:
      calibration_dict: ${inputs.calibration_dict}
      mapping_dict: ${inputs.mapping_dict}
      echodata: ${combine_raw.echodata}
    params:
      raw_file_path: ${_item}

  - id: compute_sv
    op: compute_sv
    map_over: ${query_ncei.raw_urls}
    checkpoint: always
    inputs:
      echodata: ${combine_raw.echodata}
      cal_params: ${extract_cal_params.cal_params}
      env_params: ${extract_cal_params.env_params}

  # Computed explicitly rather than with echopype's
  # use_platform_vertical_offsets, which puts an EK60 transducer 8.92 m above
  # the surface instead of below it. The dive profiles, their 99% bounds and
  # the seabed lines are all surface referenced, so this has to be right.
  #
  # The heave sign is HB2407's, verified there against an EVL seabed line but
  # not on HB1603 (it could be, on 25 July and 14 August, where the seabed is
  # inside the crop). It is worth at most +/- 0.45 m against a 2 m bin.
  - id: compute_transducer_depth
    op: compute_transducer_depth
    map_over: ${query_ncei.raw_urls}
    checkpoint: always
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
      echodata: ${combine_raw.echodata}
    params:
      use_heave: true
      heave_sign: 1.0

  # Surface-referenced depth, added here while this file's EchoData is at hand.
  - id: ep_add_depth
    op: ep_add_depth
    map_over: ${query_ncei.raw_urls}
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
      echodata: ${combine_raw.echodata}
    params:
      depth_offset: ${compute_transducer_depth.transducer_depth}

  # Checkpointed: the chain's surviving output. A fan-in reloads it from the
  # cache, so read_raw's scratch stores can be deleted as instances finish.
  - id: crop_survey_range
    op: crop_range
    map_over: ${query_ncei.raw_urls}
    checkpoint: always
    inputs:
      ds_Sv: ${ep_add_depth.ds_Sv}
    params:
      max_range_m: ${inputs.crop_max_range_m}
      drop_trailing_all_nan: false
      outlier_sigma: null
