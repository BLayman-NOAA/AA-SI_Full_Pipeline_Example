# HB1603 survey MVBS: the per-file clean-and-grid half, fanned in.
#
#   [per file]  surface + frequency masks -> apply -> remove_background_noise
#               -> mask_sparse_bins -> compute_mvbs (pinned depth grid)
#   [fan-in]    merge_survey_mvbs -> rechunk -> the shared survey store
#
# Include this immediately after survey_sv_per_file.yaml: the steps map over
# the same ${query_ncei.raw_urls}, and a mapped chain is kept contiguous by
# declaration order. A non-mapped step in between splits it, and
# ${crop_survey_range.ds_Sv} then resolves to the whole 3322-item list.
#
# WHY THE GRID IS HERE
#
#   range_sample is not comparable across HB1603 files, so they can only be
#   merged once binned. compute_mvbs bins by the value of range_var, not the
#   sample index, and with range_var_max pinned every file gets identical bin
#   edges. Left unset, each file picks its own axis length, and reading the
#   extent forces a compute.
#
# WHAT IT COSTS
#
#   Masking and noise removal must precede binning, so every analysis of this
#   store inherits one bin size, one noise setting and one sparsity threshold.
#   An analysis needing others can map its own chain over the per-file Sv
#   (sv_window_example.yaml). Noise is estimated per file, about 516 pings,
#   rather than per dive window. The seafloor mask is not here: its line comes
#   from a per-dive config, so it is applied to the gridded product later.

recipe:
  name: "hb1603_survey_mvbs"
  description: "Per-file masking, noise removal and MVBS on a pinned depth grid, fanned in to the shared HB1603 store."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  surface_depth_m:
    type: float
    default: 10.0
    description: "Range from the transducer, in metres, above which samples are masked, to remove the transmit pulse and ringdown."
  frequencies_to_mask:
    type: list
    default: [70, 120, 200]
    description: >
      Nominal channel frequencies in kHz to blank, such as [70, 120, 200];
      every sample on those channels is masked. An empty list keeps every
      channel.
  noise_range_sample_num:
    type: int
    default: 10
    description: "Range samples per bin for the background noise estimate."
  noise_ping_num:
    type: int
    default: 5
    description: "Pings per bin for the background noise estimate."
  range_bin:
    type: str
    default: "2m"
    description: >
      Depth bin height of the MVBS grid, as a length string such as "2m". The
      sparse-bin mask and the cell statistics use the same bin.
  ping_time_bin:
    type: str
    default: "10s"
    description: >
      Ping-time bin width of the MVBS grid, as a duration string such as
      "10s". The sparse-bin mask and the cell statistics use the same bin.
  range_var:
    type: str
    default: "depth"
    description: >
      Variable the bins are built on: "depth" (below the surface, shared
      across files and channels) or "echo_range" (from the transducer face).
  range_var_max:
    type: str
    default: "1810m"
    description: >
      Deepest depth the MVBS grid covers, such as "1810m", pinned so every
      file shares one depth axis. It must clear the range crop plus the
      transducer depth, or the deepest bins are dropped.
  nan_threshold:
    type: float
    default: .99
    description: "Fraction of NaN samples (0 to 1) above which the sparse-bin mask drops a bin."
  survey_chunk_ping_time:
    type: int
    default: 1000
    description: >
      Ping-time chunk size of the shared survey store, which sets the
      granularity a window reads at. Size it near the window users usually ask
      for.

steps:

  # Per-file clean and grid, contiguous with the chain above

  - id: survey_surface_mask
    op: create_surface_mask
    map_over: ${query_ncei.raw_urls}
    inputs:
      ds_Sv: ${crop_survey_range.ds_Sv}
    params:
      surface_depth_m: ${inputs.surface_depth_m}

  - id: survey_frequency_mask
    op: create_frequency_mask
    map_over: ${query_ncei.raw_urls}
    inputs:
      ds_Sv: ${crop_survey_range.ds_Sv}
    params:
      frequencies_to_mask: ${inputs.frequencies_to_mask}

  - id: survey_combine_masks
    op: combine_masks
    map_over: ${query_ncei.raw_urls}
    inputs:
      masks:
        - ${survey_surface_mask.mask}
        - ${survey_frequency_mask.mask}
    params:
      mode: "and"

  - id: survey_apply_mask
    op: apply_sv_mask
    map_over: ${query_ncei.raw_urls}
    inputs:
      ds_Sv: ${crop_survey_range.ds_Sv}
      mask: ${survey_combine_masks.mask}

  - id: survey_remove_noise
    op: remove_background_noise
    map_over: ${query_ncei.raw_urls}
    inputs:
      ds_Sv: ${survey_apply_mask.ds_Sv}
    params:
      range_sample_num: ${inputs.noise_range_sample_num}
      ping_num: ${inputs.noise_ping_num}

  - id: survey_mask_sparse
    op: mask_sparse_bins
    map_over: ${query_ncei.raw_urls}
    inputs:
      ds_Sv: ${survey_remove_noise.ds_Sv}
    params:
      range_bin: ${inputs.range_bin}
      ping_time_bin: ${inputs.ping_time_bin}
      range_var: ${inputs.range_var}
      nan_threshold: ${inputs.nan_threshold}

  # checkpoint: always for the same reason crop_survey_range is checkpointed:
  # it is this half's surviving per-file output, and the fan-in below reloads
  # it from the cache rather than carrying a graph rooted in deleted scratch.
  - id: survey_file_mvbs
    op: compute_mvbs
    map_over: ${query_ncei.raw_urls}
    checkpoint: always
    inputs:
      ds_Sv: ${survey_mask_sparse.ds_Sv}
    params:
      range_bin: ${inputs.range_bin}
      ping_time_bin: ${inputs.ping_time_bin}
      range_var: ${inputs.range_var}
      range_var_max: ${inputs.range_var_max}

  # Per-cell CV on the same grid and from the same pre-sparse Sv as the MVBS.
  # range_var_max is pinned so the fan-in has no cell_echo_range to pad.
  - id: survey_cell_stats
    op: compute_per_cell_statistics
    map_over: ${query_ncei.raw_urls}
    checkpoint: always
    inputs:
      ds_Sv: ${survey_remove_noise.ds_Sv}
    params:
      range_bin: ${inputs.range_bin}
      ping_time_bin: ${inputs.ping_time_bin}
      range_var: ${inputs.range_var}
      range_var_max: ${inputs.range_var_max}
      statistics:
        - cv
      # Only cell_cv is read downstream; without this the checkpoint would also
      # hold a full copy of the per-file Sv.
      cells_only: true

  # Fan-in: safe now that every file shares one depth axis

  # Not checkpointed: it feeds the rechunk immediately below, and writing both
  # would store the survey twice. The rechunk is the store users read.
  - id: merge_survey_mvbs
    op: merge_datasets
    collect: ${survey_file_mvbs.ds_MVBS}
    inputs:
      datasets: ${survey_file_mvbs.ds_MVBS}
    params:
      dim: "ping_time"
      # Time bins anchor to a global origin, so a file boundary inside a bin
      # makes both files emit it; averaging keeps the merged index unique,
      # which every downstream reindex needs.
      on_duplicate: "mean"

  - id: rechunk_survey_mvbs
    op: rechunk_dataset
    checkpoint: always
    inputs:
      ds_Sv: ${merge_survey_mvbs.merged}
    params:
      ping_time_chunk: ${inputs.survey_chunk_ping_time}

  # Concatenated on the cell grid's own time axis. Safe for the same reason the
  # MVBS merge is: every file was binned to the same pinned extent.
  - id: merge_survey_cell_stats
    op: merge_datasets
    collect: ${survey_cell_stats.ds_Sv}
    checkpoint: always
    inputs:
      datasets: ${survey_cell_stats.ds_Sv}
    params:
      dim: "cell_ping_time"
      on_duplicate: "mean"
