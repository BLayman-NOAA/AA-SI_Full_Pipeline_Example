# Processing level 2b (viewer): masking and noise removal for the whole survey.
#
#   surface + frequency masks -> apply -> remove noise
#
# The viewer's half of level 2, per file, for every file in the catalogue. It
# starts from the shared per-file Sv at crop_survey_range, exactly where
# processing_lvl_2_user.yaml starts, and differs from it in three ways that all
# follow from the product being a picture of the survey, not an analysis of
# the dives:
#
#   * No window. Every file is processed.
#   * No seabed mask. The seabed lines cover only the six dive dates, and a
#     ping with no line depth would be masked out entirely, so a survey-wide
#     seabed mask would silently delete most of the cruise. The seabed stays
#     in the picture, which is where a viewer wants it anyway.
#   * Every frequency is kept by default. See below.
#
# WHY THE HIGH FREQUENCIES ARE KEPT HERE AND DROPPED IN THE ANALYSIS
#
#   The dive analysis masks 70, 120 and 200 kHz because the clustering needs
#   one feature vector at every depth a whale reaches, and those channels carry
#   nothing below a few hundred metres. That is a requirement of the
#   clustering, not a verdict on the data: in the upper water column they are
#   the channels that separate zooplankton from fish, and a viewer is where
#   that is looked at.
#
#   They also do not need a depth limit drawn by hand. remove_background_noise
#   estimates each channel's noise floor and masks every sample less than
#   noise_snr_threshold above it. The floor rises with range as the
#   time-varied gain amplifies it, so each channel blanks itself at the range
#   where it stops carrying signal, 200 kHz first and 18 kHz last, and that
#   range moves with conditions the way a fixed cutoff cannot.
#
#   frequencies_to_mask is still here, empty, for a store that should match the
#   analysis channel for channel.
#
# WHAT "BELOW THE WATER COLUMN" MEANS HERE
#
#   Without a seabed line the only survey-wide limit is a fixed one, and the
#   shared Sv already carries it: crop_survey_range cut every file at 1800 m of
#   range. Over the abyssal plain that is all water. Over the shelf, where the
#   seabed is as shallow as 13 m, most of each ping is below the bottom and is
#   drawn as such: the bottom echo, then its multiples and reverberation. To
#   cut the picture off shallower, lower grid_max_depth in level 3.
#
# Include directly after processing_lvl_2_survey.yaml: these steps continue the
# per-file chain mapped over query_ncei.raw_urls.

recipe:
  name: "hb1603_processing_lvl_2_viewer"
  description: "Per file, the whole survey: surface and optional frequency masks, then noise removal. No seabed mask."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  surface_depth_m:
    type: float
    default: 10.0
    description: >
      Range from the transducer, in metres, above which samples are masked. It
      removes the transmit pulse and ringdown. The transducer sits about 8.9 m
      down, so 10 m of range is roughly the top 19 m of water.
  frequencies_to_mask:
    type: list
    default: []
    description: >
      Channel frequencies in kHz to blank. Empty keeps all five. Set
      [70, 120, 200] for a store that matches the dive analysis.
  noise_range_sample_num:
    type: int
    default: 10
    description: "Range samples per noise-estimation bin."
  noise_ping_num:
    type: int
    default: 5
    description: "Pings per noise-estimation bin."
  noise_snr_threshold:
    type: str
    default: "3.0dB"
    description: >
      Samples whose corrected Sv sits less than this above the noise estimate
      are masked. This is what limits each channel in depth; raise it for a
      cleaner, shallower picture.
  noise_background_max:
    type: str
    default: null
    description: "Ceiling on the noise estimate, e.g. \"-160.0dB\". Null leaves it unbounded."

steps:

  - id: viewer_surface_mask
    op: create_surface_mask
    map_over: ${query_ncei.raw_urls}
    inputs:
      ds_Sv: ${crop_survey_range.ds_Sv}
    params:
      surface_depth_m: ${inputs.surface_depth_m}

  # All true when frequencies_to_mask is empty, and lazy either way.
  - id: viewer_frequency_mask
    op: create_frequency_mask
    map_over: ${query_ncei.raw_urls}
    inputs:
      ds_Sv: ${crop_survey_range.ds_Sv}
    params:
      frequencies_to_mask: ${inputs.frequencies_to_mask}

  - id: viewer_combine_masks
    op: combine_masks
    map_over: ${query_ncei.raw_urls}
    inputs:
      masks:
        - ${viewer_surface_mask.mask}
        - ${viewer_frequency_mask.mask}
    params:
      mode: "and"

  - id: viewer_apply_mask
    op: apply_sv_mask
    map_over: ${query_ncei.raw_urls}
    inputs:
      ds_Sv: ${crop_survey_range.ds_Sv}
      mask: ${viewer_combine_masks.mask}

  # Per file, as in the survey tier. The estimator needs contiguous pings and
  # one raw file is contiguous.
  - id: viewer_remove_noise
    op: remove_background_noise
    map_over: ${query_ncei.raw_urls}
    inputs:
      ds_Sv: ${viewer_apply_mask.ds_Sv}
    params:
      range_sample_num: ${inputs.noise_range_sample_num}
      ping_num: ${inputs.noise_ping_num}
      SNR_threshold: ${inputs.noise_snr_threshold}
      background_noise_max: ${inputs.noise_background_max}
