# Processing level 2b (viewer): masking and noise removal for the whole survey.
#
#   surface + frequency masks -> apply -> remove noise
#
# The viewer's half of level 2, per file, for every catalogue file, starting
# from crop_survey_range like processing_lvl_2_user.yaml. It differs because the
# product is a picture of the survey, not a dive analysis:
#
#   * No window: every file is processed.
#   * No seabed mask: the seabed lines cover only the six dive dates, and a
#     ping with no line depth is masked whole, so a survey-wide seabed mask
#     would silently delete most of the cruise.
#   * Every frequency is kept by default.
#
# WHY THE HIGH FREQUENCIES ARE KEPT HERE
#
#   The dive analysis drops 70, 120 and 200 kHz because the clustering needs
#   one feature vector at every depth a whale reaches. In the upper water
#   column those channels separate zooplankton from fish, which a viewer should
#   show. Noise removal limits each channel's depth on its own: the noise floor
#   rises with range, so each channel blanks where it stops carrying signal,
#   200 kHz first.
#
# Below the seabed the picture shows the bottom echo and its multiples, down
# to the survey's 1800 m range crop; lower grid_max_depth in level 3 to cut it
# off shallower. Include directly after processing_lvl_2_survey.yaml: these
# steps continue the per-file chain mapped over query_ncei.raw_urls.

recipe:
  name: "hb1603_processing_lvl_2_viewer"
  description: "Per file, the whole survey: surface and optional frequency masks, then noise removal. No seabed mask."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  # HB1603: the transducer sits about 8.9 m down, so 10 m of range is roughly
  # the top 19 m of water.
  surface_depth_m:
    type: float
    default: 10.0
    description: "Range from the transducer, in metres, above which samples are masked, to remove the transmit pulse and ringdown."
  frequencies_to_mask:
    type: list
    default: []
    description: >
      Nominal channel frequencies in kHz to blank, such as [70, 120, 200];
      every sample on those channels is masked. An empty list keeps every
      channel.
  noise_range_sample_num:
    type: int
    default: 10
    description: "Range samples per bin for the background noise estimate."
  noise_ping_num:
    type: int
    default: 5
    description: "Pings per bin for the background noise estimate."
  noise_snr_threshold:
    type: str
    default: "3.0dB"
    description: >
      Samples whose noise-corrected Sv is less than this above the noise
      estimate are masked, as a dB string such as "3.0dB". Raise it for a
      cleaner, shallower picture.
  noise_background_max:
    type: str
    default: null
    description: >
      Ceiling on the background noise estimate, as a dB string such as
      "-125dB". Null leaves it unbounded.

steps:

  - id: viewer_surface_mask
    op: create_surface_mask
    map_over: ${query_ncei.raw_urls}
    inputs:
      ds_Sv: ${crop_survey_range.ds_Sv}
    params:
      surface_depth_m: ${inputs.surface_depth_m}

  # All true when frequencies_to_mask is empty, and lazy either way.
  - id: viewer_frequency_mask
    op: create_frequency_mask
    map_over: ${query_ncei.raw_urls}
    inputs:
      ds_Sv: ${crop_survey_range.ds_Sv}
    params:
      frequencies_to_mask: ${inputs.frequencies_to_mask}

  - id: viewer_combine_masks
    op: combine_masks
    map_over: ${query_ncei.raw_urls}
    inputs:
      masks:
        - ${viewer_surface_mask.mask}
        - ${viewer_frequency_mask.mask}
    params:
      mode: "and"

  - id: viewer_apply_mask
    op: apply_sv_mask
    map_over: ${query_ncei.raw_urls}
    inputs:
      ds_Sv: ${crop_survey_range.ds_Sv}
      mask: ${viewer_combine_masks.mask}

  # Per file, as in the survey tier. The estimator needs contiguous pings and
  # one raw file is contiguous.
  - id: viewer_remove_noise
    op: remove_background_noise
    map_over: ${query_ncei.raw_urls}
    inputs:
      ds_Sv: ${viewer_apply_mask.ds_Sv}
    params:
      range_sample_num: ${inputs.noise_range_sample_num}
      ping_num: ${inputs.noise_ping_num}
      SNR_threshold: ${inputs.noise_snr_threshold}
      background_noise_max: ${inputs.noise_background_max}
