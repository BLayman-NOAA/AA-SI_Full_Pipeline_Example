# Processing level 0 (survey): catalogue, channel scan and calibration.
#
# Everything needed before a raw file can be calibrated, streamed from NCEI
# without downloading a file: the scan range-reads each raw file's opening
# bytes over HTTPS.
#
#   query_ncei          one catalogue query for the whole cruise
#   scan_raw_config     one instance per file, reading its leading bytes
#   record_raw_configs  fans the per-file results in, writes raw_file_configs.yaml
#   standardize_cal     parses the manufacturer .cal files, one file per channel
#   build_cal_mapping   matches raw channels to calibration data
#
# THE SURVEY VARIANT, AND THE ONLY ONE THAT WRITES FILES
#
#   The last three steps carry regenerate attributes because their real
#   product is the calibration files under calibration_output_dir.
#   processing_lvl_0_user.yaml is the same five steps without them; regenerate
#   is not fingerprinted, so both hash identically and share one cache. Change
#   a step here and make the same change there.
#
# WHY max_scan_bytes IS 1 MiB AND NOT SMALLER
#
#   HB1603's configuration settles within 256 KiB, so 1 MiB is one small read
#   per file: about 3 GB for the cruise against 175 GB of whole files. At
#   64 KiB the channel list is complete, but EK60 power fields still hold CON0's
#   configured value; the transmitted power is in each channel's first RAW0
#   datagram. The scanner refuses a prefix until it has one RAW0 per channel,
#   so a cap that is too small costs a whole-file read, not a wrong value.
#
# WHY transmit_power IS WIDENED
#
#   Leg 1 (HB1603_L1-*, 3 and 7 July) ran 18 and 38 kHz at 2000 W, later files
#   at 1000 W, and the only .cal files (18 July) were measured at 1000 W.
#   Matched to 1 W, leg 1's 18 and 38 kHz match nothing and four of the 14
#   dives lose the two frequencies the SVCode analysis uses. 1001 W is the
#   smallest tolerance admitting both; frequency is matched first and stays
#   exact.
#
#   It is a scientific trade: the 1000 W gain biases leg-1 38 kHz Sv low by
#   roughly 0.2 to 0.6 dB, but it keeps every pooled dive on one calibration
#   instead of four on the sounder's own values. The override is reported on
#   the terminal every run.
#
# WHERE TO READ WHAT THE MATCH DID
#
#   build_cal_mapping writes mapping_files/calibration_provenance.yaml, one
#   segmented entry per channel: matched, matched under the widened tolerance
#   (3 and 7 July, power) or unmatched (27 and 28 June, pulse length; see
#   processing_lvl_2_survey.yaml). unmapped_channels is not passed here: params
#   are fingerprinted, so adding it would change the whole survey Sv's hashes.
#
# THE STEPS BELOW ARE FROZEN
#
#   These five sit above the whole survey Sv in the hash chain: changing the
#   query window, scan cap, cruise id or a tolerance recomputes every per-file
#   Sv. conflict_resolution is "error" so an unattended run fails rather than
#   waits on a prompt.

recipe:
  name: "hb1603_processing_lvl_0_survey"
  description: "Scan HB1603 channel configurations in place from NCEI, write the calibration files and build the mapping."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  cruise_name:
    type: str
    default: "HB1603"
    description: >
      Cruise name searched for in the NCEI catalogue, such as "HB1603".
  # Wider than the cruise (2016-06-27 to 2016-08-25) so it states intent. Keep
  # it fixed once a scan is cached: moving it reruns every per-file step.
  file_time_start:
    type: str
    default: "2016-06-01T00:00:00"
    description: >
      Start of the NCEI catalogue query, an inclusive ISO UTC datetime such as
      "2016-07-25T20:58". Every file overlapping the window is fetched.
  file_time_end:
    type: str
    default: "2016-09-01T00:00:00"
    description: >
      End of the NCEI catalogue query, an inclusive ISO UTC datetime such as
      "2016-07-25T21:45". Every file overlapping the window is fetched.
  cal_input_folder:
    type: path
    description: >
      Folder of manufacturer calibration files (.cal for EK60, .xml for EK80),
      a local path or a gs:// URL.
  # Passed directly rather than taken from initial_setup, which needs a local
  # raw folder. Every survey-tier recipe must pass the survey run's value.
  calibration_output_dir:
    type: path
    default: "./outputs/calibration"
    description: "Root folder the calibration artifacts are written under."
  cruise_id:
    type: str
    default: "HB1603"
    description: >
      Cruise identifier, such as "HB1603", recorded in every generated
      single-channel calibration file so it stays traceable to the survey.
  record_author:
    type: str
    default: "<Your Name>"
    description: "Name recorded as the author of every generated single-channel calibration file."
  # See WHY max_scan_bytes IS 1 MiB in the header before lowering it.
  max_scan_bytes:
    type: int
    default: 1048576
    description: >
      Most leading bytes read from each raw file to find its channel
      configuration. The default, 1 MiB, settles every HB1603 file in one
      small read.
  # See WHY transmit_power IS WIDENED in the header.
  match_tolerances:
    type: dict
    default:
      transmit_power: 1001.0
    description: >
      Per-field tolerances for matching a raw channel to a calibration file
      (Hz, W, or s), merged over exact defaults. The default widens
      transmit_power to 1001 W.

steps:

  - id: query_ncei
    op: query_ncei_data
    checkpoint: always
    params:
      file_time_start: ${inputs.file_time_start}
      file_time_end: ${inputs.file_time_end}
      filters:
        CRUISE_NAME: ${inputs.cruise_name}

  # One instance per file, content-addressed by its URL, so an interrupted
  # scan resumes from what it already read rather than starting over.
  # verbose is off because one banner per file buries the rest of the log.
  - id: scan_raw_config
    op: read_raw_file_config
    map_over: ${query_ncei.raw_urls}
    checkpoint: always
    params:
      raw_file_path: ${_item}
      verbose: false
      max_scan_bytes: ${inputs.max_scan_bytes}

  - id: record_raw_configs
    op: record_raw_file_configs
    collect: ${scan_raw_config.file_config}
    checkpoint: always
    regenerate: if-missing
    inputs:
      file_configs: ${scan_raw_config.file_config}
    params:
      output_base: ${inputs.calibration_output_dir}

  - id: standardize_cal
    op: standardize_calibration_files
    checkpoint: always
    regenerate: if-missing
    inputs:
      frequencies: ${record_raw_configs.frequencies}
    params:
      cal_input_folder: ${inputs.cal_input_folder}
      output_base: ${inputs.calibration_output_dir}
      cruise_id: ${inputs.cruise_id}
      record_author: ${inputs.record_author}
      short_filenames: true

  # regenerate: always because its real product is the files on disk, which
  # its cache key cannot see, so a hand-edited single-channel file still takes
  # effect. It is a few small local reads.
  - id: build_cal_mapping
    op: build_calibration_mapping
    checkpoint: always
    regenerate: always
    inputs:
      raw_file_configs: ${record_raw_configs.raw_file_configs}
    params:
      output_base: ${inputs.calibration_output_dir}
      single_channel_dir: ${standardize_cal.single_channel_dir}
      raw_configs_path: ${record_raw_configs.raw_configs_path}
      short_filenames: true
      tolerances: ${inputs.match_tolerances}
      # Keep unmatched calibration files rather than deleting them: they are
      # the evidence when a channel comes out unmapped.
      keep_unused: true
      conflict_resolution: "error"
