# Processing level 2b (user): window selection, masking and noise removal.
#
#   dive_sv -> depth -> surface + frequency + SEABED masks -> apply -> remove noise
#
# The user half of level 2, still per file. It starts from the shared per-file
# Sv, keeps only the pings inside a dive window, and masks the seabed on
# full-resolution Sv BEFORE noise removal, the reason this recipe set exists.
# Nothing between the survey crop and the grid is checkpointed, so the surface
# and frequency masks are applied here too; they are lazy and cheap.
#
# WHAT THE STEPS MAP OVER AND START FROM
#
#   per_file_source must equal what levels 1 to 3 get, or the chain splits.
#   Off the shared survey they are ${query_ncei.raw_urls} and
#   ${crop_survey_range.ds_Sv}; off the raw-calibration path, the query
#   narrowed to the dive files and ${crop_dive_range.ds_Sv}. Both are
#   substituted textually.
#
# HOW A DIVE CHAIN RUNS OVER A WHOLE SURVEY
#
#   dive_sv runs on every file and keeps the pings inside any window. For the
#   roughly 3280 files no window touches it returns nothing, every later step
#   is skipped for that file and the fan-in drops it, so real work happens on
#   about 40 of 3322. Nothing may be declared between the level 2a include and
#   dive_sv.
#
# DEPTH IS RE-ADDED HERE
#
#   dive_depth sets depth to echo_range plus dive_depth_offset, leaving the
#   shared Sv alone. 0.0 is range from the transducer, as the NEFSC reference
#   binned; wiring ${compute_transducer_depth.transducer_depth} restores the
#   survey's depth. The seabed mask and the level 3 grid follow this choice,
#   so at 0.0 the surface-referenced Echoview lines sit 6 or 9 m off the data.
#   In dive_analysis_raw_cal.yaml this is the only add_depth (static depth, no
#   heave); echopype aligns the offset to the windowed pings by ping_time.
#
# WHY THE SEABED IS MASKED HERE AND NOT IN THE SURVEY TIER
#
#   The noise estimate takes a minimum over range, so samples below the seabed
#   feed it; six of the 13 dives have the seabed inside the 1800 m crop. The
#   seabed lines cover only the six dive dates, and a ping with no line depth
#   is masked whole without error, so a survey-wide mask would silently empty
#   most of the cruise. Inside the dive windows every ping is covered, and
#   seabed_min_coverage turns any gap into a failed step.
#
# THE SEABED LINE SOURCE
#
#   The mask reads the seabed_lines_dir folder, not the per-dive seabed_evl on
#   the window: a per-file instance cannot read the window dict, and the
#   per-dive path is one of the same half-day files. The 7 July export has nine
#   points over twelve hours, interpolated flat at 2985 m; that is below the
#   crop, so nothing on 7 July is masked, which is also correct there.
#
# TWO THINGS TO KEEP IN MIND WHEN COMPARING
#
#   Noise removal sees only a file's in-window pings, as few as a few dozen
#   against 516 per file in the survey tier. Two windows in one file are
#   selected as one block, so a noise bin can span the gap between them (at
#   most once, on 7 July).

recipe:
  name: "hb1603_processing_lvl_2_user"
  description: "Per file, inside the dive windows: surface, frequency and seabed masks, then noise removal."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  per_file_source:
    type: str
    description: >
      The step output list the per-file steps map over, one instance per
      entry, normally ${query_ncei.raw_urls}. Required; give every level in
      the chain the same value.
  sv_source:
    type: str
    description: >
      Per-file Sv this level starts from, as a step output reference:
      ${crop_survey_range.ds_Sv} off the shared survey,
      ${crop_dive_range.ds_Sv} off the raw-calibration path. Required.
  # Wire it to plan_dives.windows. Any window list works, which lets the level
  # serve analyses other than the dives.
  dive_windows:
    type: list
    description: "Dive time windows, a list of dicts each with start and end, one per dive."
  ping_time_bin:
    type: str
    default: "10s"
    description: >
      Ping-time bin of the level 3 grid, as a duration string such as "10s".
      Each dive window is widened to whole bins of it, so it must equal level
      3's value.
  # See DEPTH IS RE-ADDED HERE in the header.
  dive_depth_offset:
    type: float
    description: >
      Metres added to echo_range to give depth on the dive pings. 0.0 gives
      range from the transducer; wire compute_transducer_depth.transducer_depth
      for surface-referenced depth.
  surface_depth_m:
    type: float
    default: 10.0
    description: "Range from the transducer, in metres, above which samples are masked, to remove the transmit pulse and ringdown."
  # The HB1603 default drops the high frequencies, which at depth carry only
  # range-amplified noise. Blanked channels are all NaN, the source of noise
  # removal's harmless "All-NaN slice" warning.
  frequencies_to_mask:
    type: list
    default: [70, 120, 200]
    description: >
      Nominal channel frequencies in kHz to blank, such as [70, 120, 200];
      every sample on those channels is masked. An empty list keeps every
      channel.
  # See THE SEABED LINE SOURCE in the header for why the folder and not the
  # per-dive path.
  seabed_lines_dir:
    type: path
    default: "./Auxiliary/seabed_lines"
    description: >
      Folder of half-day Echoview .evl seabed exports; each per-file instance
      reads the folder and interpolates the line onto its own pings.
  seabed_min_coverage:
    type: float
    default: 0.99
    description: >
      Fraction of a file's selected pings (0 to 1) that must get a seabed
      depth, or the step fails. A ping with no seabed depth is masked out
      entirely.
  seafloor_buffer_m:
    type: float
    default: 10.0
    description: >
      Height above the seabed line, in metres, that is also masked, to drop the
      bottom echo and detection error.
  noise_range_sample_num:
    type: int
    default: 10
    description: "Range samples per bin for the background noise estimate."
  noise_ping_num:
    type: int
    default: 5
    description: "Pings per bin for the background noise estimate."
  # The NEFSC reference analysis uses 6.0dB; 3.0dB is the survey tier's value.
  noise_snr_threshold:
    type: str
    default: "3.0dB"
    description: >
      Samples whose noise-corrected Sv is less than this above the noise
      estimate are masked, as a dB string such as "3.0dB". Raise it for a
      cleaner, shallower picture.
  # Null matches the survey tier.
  noise_background_max:
    type: str
    default: null
    description: >
      Ceiling on the background noise estimate, as a dB string such as
      "-125dB". Null leaves it unbounded.

steps:

  - id: dive_sv
    op: select_ping_time_range
    map_over: ${inputs.per_file_source}
    inputs:
      ds_Sv: ${inputs.sv_source}
    params:
      windows: ${inputs.dive_windows}
      allow_empty: true
      snap_to_bin: ${inputs.ping_time_bin}

  # Needs no EchoData: a constant or wired depth_offset is all add_depth reads.
  - id: dive_depth
    op: ep_add_depth
    map_over: ${inputs.per_file_source}
    inputs:
      ds_Sv: ${dive_sv.ds_Sv}
    params:
      depth_offset: ${inputs.dive_depth_offset}

  - id: dive_surface_mask
    op: create_surface_mask
    map_over: ${inputs.per_file_source}
    inputs:
      ds_Sv: ${dive_depth.ds_Sv}
    params:
      surface_depth_m: ${inputs.surface_depth_m}

  - id: dive_frequency_mask
    op: create_frequency_mask
    map_over: ${inputs.per_file_source}
    inputs:
      ds_Sv: ${dive_depth.ds_Sv}
    params:
      frequencies_to_mask: ${inputs.frequencies_to_mask}

  # The folder, read whole, onto this file's selected pings. edge_extend_s is
  # left at 0, so a ping outside the line's span is NaN rather than held at
  # the end depth, and seabed_min_coverage makes any such ping a failure.
  - id: dive_seabed_line
    op: read_seafloor_line
    map_over: ${inputs.per_file_source}
    inputs:
      ds_Sv: ${dive_depth.ds_Sv}
    params:
      evl_path: ${inputs.seabed_lines_dir}
      min_coverage: ${inputs.seabed_min_coverage}

  - id: dive_seabed_mask
    op: create_seafloor_mask
    map_over: ${inputs.per_file_source}
    inputs:
      ds_Sv: ${dive_depth.ds_Sv}
      seafloor_depth: ${dive_seabed_line.seafloor_depth}
    params:
      seafloor_buffer_m: ${inputs.seafloor_buffer_m}

  - id: dive_combine_masks
    op: combine_masks
    map_over: ${inputs.per_file_source}
    inputs:
      masks:
        - ${dive_surface_mask.mask}
        - ${dive_frequency_mask.mask}
        - ${dive_seabed_mask.mask}
    params:
      mode: "and"

  - id: dive_apply_mask
    op: apply_sv_mask
    map_over: ${inputs.per_file_source}
    inputs:
      ds_Sv: ${dive_depth.ds_Sv}
      mask: ${dive_combine_masks.mask}

  # Now on seabed-masked Sv: the point of this recipe.
  - id: dive_remove_noise
    op: remove_background_noise
    map_over: ${inputs.per_file_source}
    inputs:
      ds_Sv: ${dive_apply_mask.ds_Sv}
    params:
      range_sample_num: ${inputs.noise_range_sample_num}
      ping_num: ${inputs.noise_ping_num}
      SNR_threshold: ${inputs.noise_snr_threshold}
      background_noise_max: ${inputs.noise_background_max}
