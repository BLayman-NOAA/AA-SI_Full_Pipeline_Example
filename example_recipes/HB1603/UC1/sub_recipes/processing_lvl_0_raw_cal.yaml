# Processing level 0 (raw calibration): the catalogue, narrowed to the dive files.
#
#   query_ncei   the survey's catalogue query, keeping only the files the
#                dive plan names; its raw_urls are what levels 1 to 3 map over
#
# Level 0 of dive_analysis_raw_cal.yaml. No calibration files are read:
# compute_sv takes gains and environment from each raw file.
#
# WHY ONLY THE DIVE FILES
#
#   A recalibrating recipe cannot reuse the survey's per-file Sv, so mapping
#   the whole catalogue would compute Sv for 3322 files to use 24. file_names
#   matches on the D{date}-T{time} stamp, so a config's bare file name matches
#   the archive's HB1603_L1- form, and a dive file the catalogue lacks fails
#   the step. The time window stays the survey's; the names do the narrowing.
#
#   file_names makes this step's hash differ from the survey's query, so it
#   runs (seconds) rather than loading.

recipe:
  name: "hb1603_processing_lvl_0_raw_cal"
  description: "The NCEI catalogue query and the dive files' URLs, with no calibration files involved."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  cruise_name:
    type: str
    default: "HB1603"
    description: >
      Cruise name searched for in the NCEI catalogue, such as "HB1603".
  file_time_start:
    type: str
    default: "2016-06-01T00:00:00"
    description: >
      Start of the NCEI catalogue query, an inclusive ISO UTC datetime such as
      "2016-07-25T20:58". Every file overlapping the window is fetched.
  file_time_end:
    type: str
    default: "2016-09-01T00:00:00"
    description: >
      End of the NCEI catalogue query, an inclusive ISO UTC datetime such as
      "2016-07-25T21:45". Every file overlapping the window is fetched.
  # Wire it to plan_dives.raw_files.
  dive_raw_files:
    type: list
    description: "Raw file names the dives touch, from the dive plan. The catalogue query keeps only these files."

steps:

  - id: query_ncei
    op: query_ncei_data
    checkpoint: always
    params:
      file_time_start: ${inputs.file_time_start}
      file_time_end: ${inputs.file_time_end}
      filters:
        CRUISE_NAME: ${inputs.cruise_name}
      file_names: ${inputs.dive_raw_files}
