# HB1603 demo survey Sv: survey_sv.yaml narrowed to three raw files.
#
# A small recipe for testing and demonstrating the recipe manager client. The
# catalogue query is cut to 2016-08-14 14:40 to 15:25 UTC, which NCEI resolves
# to three raw files:
#
#   D20160814-T143539   dive SWD_20160814-OE09 starts here
#   D20160814-T145828   dive SWD_20160814-OE09 ends here
#   D20160814-T152116   no dive pings, dropped by the dive analysis
#
# Files stream from NCEI over HTTPS, as in survey_sv.yaml. Caches, scratch and
# outputs go under ./demo, set in demo_survey_sv.config.yaml. Run from this
# folder, the survey first:
#
#   aa-recipe run demo_survey_sv.yaml --cache-write-tier survey
#   aa-recipe run demo_dive_analysis.yaml
#
# demo_dive_analysis.yaml includes these levels with the same values, so they
# load from the demo survey cache; keep the two files in step. The narrowed
# query is a parent of every per-file step, so the demo caches are separate
# from the full cruise cache.

recipe:
  name: "hb1603_demo_survey_sv"
  description: "Per file, range cropped Sv for three HB1603 raw files around one dive, for client demos."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  cal_input_folder:
    type: path
    default: "../calibration_files/HB201607_cal"
    description: "Folder of manufacturer calibration files (.cal for EK60, .xml for EK80), a local path or a gs:// URL."
  calibration_output_dir:
    type: path
    default: "./demo/outputs/calibration"
    description: "Root folder the calibration artifacts are written under."
  crop_max_range_m:
    type: float
    default: 1800.0
    description: "Range ceiling in metres; samples beyond it are dropped even if they hold data. Changing it recomputes the whole survey Sv."

steps:

  # The window is the only narrowing. Files overlapping it are kept, so it
  # takes the file recording at 14:40 and the one starting at 15:21:16.
  - include: sub_recipes/processing_lvl_0_survey.yaml
    input_overrides:
      cal_input_folder: ${inputs.cal_input_folder}
      calibration_output_dir: ${inputs.calibration_output_dir}
      file_time_start: "2016-08-14T14:40:00"
      file_time_end: "2016-08-14T15:25:00"

  - include: sub_recipes/processing_lvl_1_per_file.yaml
    input_overrides:
      per_file_source: ${query_ncei.raw_urls}

  - include: sub_recipes/processing_lvl_2_survey.yaml
    input_overrides:
      per_file_source: ${query_ncei.raw_urls}
      calibration_dict: ${build_cal_mapping.calibration_dict}
      mapping_dict: ${build_cal_mapping.mapping_dict}
      crop_max_range_m: ${inputs.crop_max_range_m}
