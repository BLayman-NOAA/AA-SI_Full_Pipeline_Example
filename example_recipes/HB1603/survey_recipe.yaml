# HB1603 survey-level recipe over a GCS bucket. user_recipe.yaml repeats these
# steps unchanged, so they hash the same, and adds the plots and level 4.

recipe:
  name: "processing_levels_pipeline_gcs"
  description: "HB1603 survey-level pipeline over raw files in a GCS bucket: levels 1 to 3, from calibration through Sv cleaning to MVBS and per-cell statistics."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  raw_input_folder:
    type: path
    # Hash the folder's contents, not its location, so a local copy and the
    # bucket give the same survey hash.
    fingerprint_mode: auto
    description: "Folder of raw .raw files, a local path or a gs:// URL."
  cal_input_folder:
    type: path
    default: "./calibration_files/HB201607_cal"
    description: "Folder of manufacturer calibration files (.cal for EK60, .xml for EK80), a local path or a gs:// URL."
  # Unused here: no step draws the line.
  line_file_path:
    type: path
    default: "./line_files/SpermWhaleClicks_click_data_HB1603_SpermWhaleDive_Span0.2_07252016_2120_UTC.csv"
    description: "Line file drawn over the MVBS grid and echograms, such as a sperm whale click track (.csv) or an Echoview .evl line. A local path or a gs:// URL."

  # Display window for plotting steps, unused here since none run.
  min_depth:
    type: float
    default: 0
    description: "Shallowest depth shown on the echograms, in metres."
  max_depth:
    type: float
    default: 1800
    description: "Deepest depth shown on the echograms, in metres. Unset uses the deepest depth in the data."
  time_min:
    type: str
    description: "Start of the echogram window, as a UTC timestamp such as \"2024-10-15T12:30\". Unset starts at the first ping."
  time_max:
    type: str
    description: "End of the echogram window, as a UTC timestamp such as \"2024-10-15T12:30\". Unset runs to the last ping."
  x_axis_units:
    type: str
    default: "datetime"
    description: "Echogram x axis: \"datetime\" (UTC clock time), \"seconds\" from the first ping shown, \"pings\", \"meters\" travelled, or \"bins\" (MVBS only)."
  y_axis_units:
    type: str
    default: "meters"
    description: "Echogram y axis: \"meters\", \"range_sample\", or \"bins\" (MVBS only)."


steps:

  - include: sub_recipes/processing_lvl_1_gcs.yaml
    input_overrides:
      raw_input_folder: ${inputs.raw_input_folder}
      cal_input_folder: ${inputs.cal_input_folder}
      # Clear both to process the whole bucket folder.
      file_time_start: "2016-07-25T20:58"
      file_time_end: "2016-07-25T21:45"
      cruise_id: "HB1603"
      record_author: "<Your Name>"
      sonar_model: "EK60"

  - include: sub_recipes/processing_lvl_2.yaml
    input_overrides:
      echodata: ${combine_raw.echodata}
      cal_params: ${extract_cal_params.cal_params}
      env_params: ${extract_cal_params.env_params}
      depth_offset: 6
      seafloor_buffer_m: 100
      surface_mask_depth: 10.0
      noise_range_sample_num: 10
      noise_ping_num: 5

  - include: sub_recipes/processing_lvl_3.yaml
    input_overrides:
      sv_clean_unmasked: ${remove_noise.ds_Sv}
      range_bin: "20m"
      ping_time_bin: "20s"
      nan_threshold: 0.6
