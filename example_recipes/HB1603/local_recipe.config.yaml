
# Config for user_recipe_parallel.yaml.
#
# Auto-discovered locations (first found wins; only one file is loaded):
#   1. --config <path>                        (explicit flag)
#   2. $AA_RECIPE_CONFIG                      (explicit path via env var)
#   3. <recipe_dir>/<recipe_stem>.config.yaml (PER-RECIPE — this file, picked
#      up automatically by `aa-recipe run user_recipe_parallel.yaml`)
#   4. ./aa-recipe.config.yaml                (generic shared defaults, cwd)
#   5. ~/.config/aa-recipe/config.yaml
#
# CLI flags override these values; these values override the recipe's own
# input defaults.

# Checkpoint cache stays in the bucket: these are the durable, shareable
# artifacts and the whole point of the survey tier.
user_cache_dir: ./user_cache

# temp_dir is LOCAL here, and that is the deliberate difference from
# survey_recipe.config.yaml.
#
# temp_dir holds the per-file zarr intermediates that read_raw writes and
# combine_raw immediately reads back, and which are deleted at the end of the
# run. Pointing it at the bucket cost 174.8s writing plus 30.5s reading in the
# baseline run, for data that never outlives the run. Nothing durable is lost
# by keeping it local.
#
# REVERSE THIS (back to gs://.../exe_temp) if the workstation is genuinely
# disk-constrained. Peak local usage is roughly one raw file plus its zarr
# store at a time under the sequential executor, multiplied by the concurrency
# if you run with --executor dask. Note also that since the 2026-07-31
# _stage_parent_dir() fix, remote checkpoint writes stage through temp_dir
# before uploading, so this volume also needs room for remove_noise's staged
# store (~6.6 GB uncompressed for a full window).
temp_dir: ./exe_temp

# outputs_dir must stay LOCAL for now: calibration artifacts and images are
# written through pathlib and cannot target object storage yet.
outputs_dir: ./outputs

# survey-level cache
survey_cache_dir: ./survey_cache

# fsspec storage options for remote paths. Leave commented for Application
# Default Credentials (the usual case on a Cloud Workstation). Only set this for
# non-default credentials, e.g. a service-account token file.
# storage_options:
#   token: /path/to/service-account.json

# shared recipe. CLI --input NAME=VALUE still overrides these.
inputs:
  # using same raws as Brett
  raw_input_folder: ./raw_file_inputs

  # cal_input_folder: gs://ggn-nmfs-aa-dev-1-data/Test_Layman/HB1603/calibration
  # line_file_path:   gs://ggn-nmfs-aa-dev-1-data/Test_Layman/HB1603/line_files/your_line_file.csv
