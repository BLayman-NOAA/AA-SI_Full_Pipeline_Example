# Config for local_recipe.yaml, picked up automatically by
# `aa-recipe run local_recipe.yaml`. Everything is local here, no bucket.
# CLI flags override these values, which override the recipe input defaults.

user_cache_dir: ./user_cache

# Per-file zarr intermediates, deleted after the run. Remote checkpoint writes
# also stage here, so leave room for the largest staged store.
temp_dir: ./exe_temp

# Must stay local: calibration artifacts and images cannot target object
# storage yet.
outputs_dir: ./outputs

survey_cache_dir: ./survey_cache

# fsspec storage options for remote paths. Leave unset for Application Default
# Credentials; set only for other credentials, such as a service-account token.
# storage_options:
#   token: /path/to/service-account.json

# Recipe input values; --input NAME=VALUE overrides them.
inputs:
  raw_input_folder: ./raw_file_inputs

  # cal_input_folder: gs://ggn-nmfs-aa-dev-1-data/Test_Layman/HB1603/calibration
  # line_file_path:   gs://ggn-nmfs-aa-dev-1-data/Test_Layman/HB1603/line_files/your_line_file.csv
