# Processing Level 2 - Sv Computation and Noise Removal
#
# Starts from the combined echodata plus extracted calibration parameters,
# computes Sv, builds and applies the masking stack, and performs background
# noise removal.

recipe:
  name: "processing_lvl_2"
  description: "Compute Sv, build masks, and remove noise."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  echodata:
    type: echodata
    description: "Combined EchoData object from the raw ingest stage."
  cal_params:
    type: dict
    description: "Calibration parameters extracted from the standardized mapping."
  env_params:
    type: dict
    description: "Environmental parameters extracted from the standardized mapping."
  depth_offset:
    type: float
    default: 0.0
    description: >
      Transducer depth in meters below the waterline, added to range to give
      depth. Fixed for the whole survey rather than derived per ping.
  seafloor_buffer_m:
    type: float
    default: 0.0
    description: >
      Metres above the detected seafloor at which the seafloor mask starts
      excluding samples, so the bottom echo and its ringing are dropped.
  surface_depth_m:
    type: float
    default: 10.0
    description: "Depth in meters above which the surface mask excludes samples."
  noise_range_sample_num:
    type: int
    default: 10
    description: "Number of range samples per bin used for background noise estimation."
  noise_ping_num:
    type: int
    default: 5
    description: "Number of pings per bin used for background noise estimation."

steps:

  - id: compute_sv
    op: compute_sv
    checkpoint: always
    inputs:
      echodata: ${inputs.echodata}
      cal_params: ${inputs.cal_params}
      env_params: ${inputs.env_params}

  - id: ep_add_depth
    op: ep_add_depth
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
      echodata: ${inputs.echodata}
    params:
      depth_offset: ${inputs.depth_offset}

  - id: ep_add_splitbeam_angle
    op: ep_add_splitbeam_angle
    inputs:
      ds_Sv: ${ep_add_depth.ds_Sv}
      echodata: ${inputs.echodata}
    params:
      waveform_mode: "CW"
      encode_mode: "power"
      to_disk: false

  - id: log_seafloor_stats
    op: log_seafloor_detection_stats
    inputs:
      echodata: ${inputs.echodata}
      ds_Sv: ${compute_sv.ds_Sv}
    params:
      min_valid_depth_m: 10.0

  - id: detect_seafloor
    op: detect_seafloor
    depends_on: [log_seafloor_stats]
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
      echodata: ${inputs.echodata}
    params:
      min_valid_depth_m: 10.0

  # - id: detect_seafloor
  #   op: ep_detect_seafloor
  #   checkpoint: save
  #   inputs:
  #     ds_Sv: ${ep_add_splitbeam_angle.ds_Sv}
  #   params:
  #     method: "basic"
  #     method_params:
  #       var_name: "Sv"
  #       channel: "GPT  38 kHz 0090720346bc 1-1 ES38B"


  - id: create_seafloor_mask
    op: create_seafloor_mask
    inputs:
      ds_Sv: ${ep_add_splitbeam_angle.ds_Sv}
      seafloor_depth: ${detect_seafloor.seafloor_depth}
    params:
      seafloor_buffer_m: ${inputs.seafloor_buffer_m}

  - id: create_surface_mask
    op: create_surface_mask
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
    params:
      surface_depth_m: ${inputs.surface_depth_m}

  - id: create_frequency_mask
    op: create_frequency_mask
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
    params:
      frequencies_to_mask: [70, 120, 200]

  - id: combine_masks
    op: combine_masks
    inputs:
      masks:
        - ${create_seafloor_mask.mask}
        - ${create_surface_mask.mask}
        - ${create_frequency_mask.mask}
    params:
      mode: "and"

  - id: apply_mask
    op: apply_sv_mask
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
      mask: ${combine_masks.mask}

  - id: remove_noise
    op: remove_background_noise
    checkpoint: always
    inputs:
      ds_Sv: ${apply_mask.ds_Sv}
    params:
      noise_range_sample_num: ${inputs.noise_range_sample_num}
      noise_ping_num: ${inputs.noise_ping_num}