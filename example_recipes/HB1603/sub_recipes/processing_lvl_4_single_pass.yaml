# Processing level 4 (single pass): machine learning.

recipe:
  name: "processing_lvl_4_single_pass"
  description: "Reshape the MVBS for ML, add the cell CV feature, normalize, cluster once with HDBSCAN, and plot the clustering report."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  mvbs_with_lines:
    type: dataset
    description: "Gridded MVBS with the line overlay variables added, flattened into one ML sample per cell."
  # The feature list these recipes use does not need it.
  echodata:
    type: echodata
    description: "Raw EchoData supplying the echosounder's own bottom pick for the 'seafloor_depth' and 'altitude' features. Used only when seafloor_depth is not wired."
  overlay_line_var:
    type: str
    default: "overlay_line"
    description: "Name of the line variable drawn over the clustering report plots."
  sv_clean_unmasked:
    type: dataset
    description: >
      Noise-removed Sv before sparse-bin masking, used as the backdrop and ping
      reference for the ML and cluster echograms.
  cell_stats_sv:
    type: dataset
    description: "Per-cell statistics, such as the coefficient of variation, on the MVBS grid. Needed when the cell_cv feature is listed."
  min_depth:
    type: float
    default: 0
    description: "Shallowest depth shown on the ML and clustering echograms, in metres."
  max_depth:
    type: float
    default: 1800
    description: "Deepest depth shown on the ML and clustering echograms, in metres. Unset uses the deepest depth in the data."
  time_min:
    type: str
    description: >
      Start of the window of the ML and clustering echograms, as a UTC timestamp
      such as "2024-10-15T12:30". Unset starts at the first ping.
  time_max:
    type: str
    description: >
      End of the window of the ML and clustering echograms, as a UTC timestamp
      such as "2024-10-15T12:30". Unset runs to the last ping.
  x_axis_units:
    type: str
    default: "datetime"
    description: "Echogram x axis: \"datetime\" (UTC clock time), \"seconds\" from the first ping shown, \"pings\", \"meters\" travelled, or \"bins\" (MVBS only)."
  y_axis_units:
    type: str
    default: "meters"
    description: "Echogram y axis: \"meters\", \"range_sample\", or \"bins\" (MVBS only)."

steps:

  - id: reshape_ml
    op: reshape_for_ml
    inputs:
      ds_MVBS: ${inputs.mvbs_with_lines}
    params:
      data_var: "Sv"
      dataset_name: "ml_dataset"
      feature_strategy: "mean_centered"
      baseline_channel: 0

  - id: add_aux_features
    op: add_auxiliary_features
    inputs:
      ds_ml: ${reshape_ml.ds_ml_ready}
      echodata: ${inputs.echodata}
      ds_sv: ${inputs.cell_stats_sv}
    params:
      dataset_name: "ml_dataset"
      features:
        - cell_cv

  - id: normalize_ml
    op: normalize_ml_data
    checkpoint: always
    inputs:
      ds_ml: ${add_aux_features.ds_ml_ready}
    params:
      method: "flatten"
      dataset_name: "ml_dataset"
      normalization_name: "norm_flat_clr"
      shift_positive: false

  - id: plot_normalized_ml
    op: plot_ml_echogram
    regenerate: if-missing
    inputs:
      ds_normalized: ${normalize_ml.ds_normalized}
      ds_Sv: ${inputs.sv_clean_unmasked}
    params:
      dataset_name: "ml_dataset"
      normalization_name: "norm_flat_clr"
      min_depth: ${inputs.min_depth}
      max_depth: ${inputs.max_depth}
      time_min: ${inputs.time_min}
      time_max: ${inputs.time_max}
      x_axis_units: ${inputs.x_axis_units}
      y_axis_units: ${inputs.y_axis_units}
      dpi: 50

  - id: run_hdbscan
    op: run_hdbscan
    inputs:
      ds_normalized: ${normalize_ml.ds_normalized}
    params:
      dataset_name: "ml_dataset"
      normalization_name: "norm_flat_clr"
      ml_result_name: "hdbscan_results"
      min_cluster_size_fraction: 0.02
      min_samples: 4
      sample_size: 1000000
      cluster_selection_method: "leaf"
      use_hdbscan: true

  - id: embed_results
    op: embed_clustering_results
    checkpoint: always
    inputs:
      ds_normalized: ${normalize_ml.ds_normalized}
      clustering_results: ${run_hdbscan.clustering_results}
    params:
      dataset_name: "ml_dataset"
      ml_result_name: "hdbscan_results"

  - id: plot_clustering_report
    op: plot_clustering_report
    regenerate: if-missing
    inputs:
      ds_normalized: ${embed_results.ds_normalized}
      clustering_results: ${run_hdbscan.clustering_results}
      clustering_model: ${run_hdbscan.clustering_model}
      ds_Sv: ${inputs.sv_clean_unmasked}
    params:
      dataset_name: "ml_dataset"
      ml_result_name: "hdbscan_results"
      # Depth limits only; time_min and time_max set the horizontal window.
      plot_window:
        - ${inputs.min_depth}
        - ${inputs.max_depth}
      time_min: ${inputs.time_min}
      time_max: ${inputs.time_max}
      x_axis_units: ${inputs.x_axis_units}
      y_axis_units: ${inputs.y_axis_units}
      dpi: 50
      overlay_line_var: ${inputs.overlay_line_var}
      cluster_colors:
        - "#9D00FF"
        - "#35E200"
        - "#FF0000"
        - "#2F00FF"
        - "#FF8800"
        - "#FFFB1C"
        - "#FF44E9"
        - "#00BE8BCA"
        - "#00FFE5"
        - "#3D8D00FF"
        - "#9C67FFFF"
      cluster_stats_sv_data_var: "Sv"