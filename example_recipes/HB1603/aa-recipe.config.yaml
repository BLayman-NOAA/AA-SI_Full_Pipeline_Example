
# Config for the HB1603 recipes in this folder.
#
# Config discovery, first found wins:
#   1. --config <path>
#   2. $AA_RECIPE_CONFIG
#   3. <recipe_dir>/<recipe_stem>.config.yaml, picked up automatically for a
#      single recipe
#   4. ./aa-recipe.config.yaml, this file
#   5. ~/.config/aa-recipe/config.yaml
#
# CLI flags override these values, which in turn override the recipe's own
# input defaults.

# Checkpoint cache stays in the bucket: these are the durable, shareable
# artifacts and the point of the survey tier.
user_cache_dir: gs://ggn-nmfs-aa-dev-1-data/Jech_Test/HB1603/recipe_1/user_cache

# temp_dir holds the per-file zarr intermediates that read_raw writes and
# combine_raw reads straight back, all deleted at the end of the run. Keeping it
# local avoids round-tripping them through the bucket for nothing.
#
# Point it back at gs://.../exe_temp if the workstation is disk-constrained.
# Local usage peaks at about one raw file plus its zarr store per concurrent
# instance, and remote checkpoint writes stage through here before uploading, so
# leave room for the largest staged store as well.
temp_dir: ./exe_temp

# outputs_dir must stay local for now: calibration artifacts and images are
# written through pathlib and cannot target object storage yet.
outputs_dir: ./outputs

# survey-level cache
survey_cache_dir: gs://ggn-nmfs-aa-dev-1-data/Jech_Test/HB1603/recipe_1/survey_cache

# fsspec storage options for remote paths. Leave commented for Application
# Default Credentials (the usual case on a Cloud Workstation). Only set this for
# non-default credentials, e.g. a service-account token file.
# storage_options:
#   token: /path/to/service-account.json

# shared recipe. CLI --input NAME=VALUE still overrides these.
inputs:
  # using same raws as Brett
  raw_input_folder: gs://ggn-nmfs-aa-dev-1-data/Test_Layman/HB1603/raw

  # cal_input_folder: gs://ggn-nmfs-aa-dev-1-data/Test_Layman/HB1603/calibration
  # line_file_path:   gs://ggn-nmfs-aa-dev-1-data/Test_Layman/HB1603/line_files/your_line_file.csv
