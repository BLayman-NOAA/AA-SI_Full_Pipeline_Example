# HB1603 user-level recipe, built on the parallel survey-level checkpoints.
#
# Levels 1 through 3 are byte-for-byte the same includes, with the same
# input_overrides, as survey_recipe_parallel.yaml. That is the only way this
# recipe hits the survey-tier checkpoints that recipe publishes: the cache is
# keyed on each step's definition and its parents' hashes, so it is structural,
# not semantic, and an edit anywhere in those blocks silently recomputes
# everything below it.
#
# For the same reason the plain and parallel pairs share no cached work.
# Populate the survey tier with the matching survey recipe:
#
#   aa-recipe run survey_recipe_parallel.yaml --cache-write-tier survey
#   aa-recipe run user_recipe_parallel.yaml
#
# Level 4 is unchanged from the plain recipe: its steps are compute-bound rather
# than upload-bound.

recipe:
  name: "processing_levels_pipeline_gcs_parallel"
  description: "HB1603 GCS user pipeline built on the parallel survey-level checkpoints."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  raw_input_folder:
    type: path
    # Content-fingerprint the (remote) folder so the cache key tracks the file set
    fingerprint_mode: auto
  cal_input_folder:
    type: path
    default: "./calibration_files/HB201607_cal"
  line_file_path:
    type: path
    default: "./line_files/SpermWhaleClicks_click_data_HB1603_SpermWhaleDive_Span0.2_07252016_2120_UTC.csv"

  # Default display window shared by every plotting step in this pipeline
  # You can override these by hardcoding values for a specific step or sub-recipe
  min_depth:
    type: float
    default: 0
  max_depth:
    type: float
    default: 1800
  # With no defaults the echograms span the whole time range. Set either to a
  # UTC timestamp, for example "2016-07-18T09:30", to window them instead.
  time_min:
    type: str
  time_max:
    type: str
  x_axis_units:
    type: str
    default: "datetime"
  y_axis_units:
    type: str
    default: "meters"


steps:

  # Levels 1-3. Keep identical to survey_recipe_parallel.yaml: any edit here
  # changes these steps' hashes and loses the survey-tier hits.

  - include: sub_recipes/processing_lvl_1_gcs_parallel.yaml
    input_overrides:
      raw_input_folder: ${inputs.raw_input_folder}
      cal_input_folder: ${inputs.cal_input_folder}
      # Data time range: clear both to process the whole bucket folder.
      file_time_start: "2016-07-25T20:58"
      file_time_end: "2016-07-25T21:45"
      cruise_id: "HB1603"
      record_author: "<Your Name>"
      sonar_model: "EK60"

  # Must follow level 1 directly: it continues the same mapped chain.
  - include: sub_recipes/processing_lvl_2_parallel.yaml
    input_overrides:
      echodata: ${combine_raw.echodata}
      cal_params: ${extract_cal_params.cal_params}
      env_params: ${extract_cal_params.env_params}
      # Fixed transducer depth below the waterline for the whole survey.
      depth_offset: 6
      # seafloor mask
      seafloor_buffer_m: 100
      # surface mask
      surface_mask_depth: 10.0
      # parameters for echopype's remove_background_noise:
      range_sample_num: 10
      ping_num: 5
      # Must stay below the window's real ping count (~516 here) or it clamps
      # to a single chunk and silently does nothing.
      noise_chunk_ping_time: 100

  - id: plot_sv_clean
    op: plot_sv_echogram
    regenerate: if-missing
    inputs:
      ds_Sv: ${remove_noise.ds_Sv}
    params:
      min_depth: ${inputs.min_depth}
      max_depth: ${inputs.max_depth}
      time_min: ${inputs.time_min}
      time_max: ${inputs.time_max}
      x_axis_units: ${inputs.x_axis_units}
      y_axis_units: ${inputs.y_axis_units}
      dpi: 100

  - include: sub_recipes/processing_lvl_3.yaml
    input_overrides:
      sv_clean_unmasked: ${remove_noise.ds_Sv}
      # MVBS bin size:
      range_bin: "20m"
      ping_time_bin: "20s"
      nan_threshold: 0.6 # mask bin if NAN's exceed this fraction of data in the cell

  # User-level additions, with no survey-tier equivalent.

  - id: add_line_overlay
    op: add_line_overlay
    inputs:
      ds: ${compute_mvbs.ds_MVBS}
    params:
      line_file_path: ${inputs.line_file_path}
      line_name: "sw_dive_profile"

  - id: plot_mvbs
    op: plot_sv_echogram
    regenerate: if-missing
    inputs:
      ds_Sv: ${add_line_overlay.ds}
      ds_Sv_source: ${mask_sparse.ds_Sv}
    params:
      min_depth: ${inputs.min_depth}
      max_depth: ${inputs.max_depth}
      time_min: ${inputs.time_min}
      time_max: ${inputs.time_max}
      x_axis_units: ${inputs.x_axis_units}
      y_axis_units: ${inputs.y_axis_units}
      dpi: 50
      overlay_lines:
        - var: "sw_dive_profile_fit"
          style:
            color: "red"
            linewidth: 3.5

  # Level 4 uses the _parallel variant because echodata cannot be wired here:
  # combine_raw is mapped, so ${combine_raw.echodata} is a list of one EchoData
  # per raw file. The seafloor line detect_seafloor already produced is passed
  # through instead, which is a few KB rather than gigabytes of EchoData.
  #
  # It goes through merge_seafloor rather than a direct
  # ${detect_seafloor.seafloor_depth} reference, which resolves on a cold run
  # but fails on a resumed one once the mapped chain is pruned. merge_seafloor
  # lives here rather than in processing_lvl_2_parallel because that sub-recipe
  # is shared with survey_recipe_parallel.yaml, where nothing consumes the line.
  #
  # depends_on is ordering only, and it is required: a non-mapped step placed
  # mid-chain splits the chain, and the members after the split would then read
  # folded per-file lists instead of their own element.
  - id: merge_seafloor
    op: merge_datasets
    collect: ${detect_seafloor.seafloor_depth}
    checkpoint: always
    depends_on: [merge_sv]
    inputs:
      datasets: ${detect_seafloor.seafloor_depth}
    params:
      dim: "ping_time"

  - include: sub_recipes/processing_lvl_4_parallel.yaml
    input_overrides:
      mvbs_with_lines: ${add_line_overlay.ds}
      seafloor_depth: ${merge_seafloor.merged}
      overlay_line_var: "sw_dive_profile"
      sv_clean_unmasked: ${remove_noise.ds_Sv}
      cell_stats_sv: ${compute_cell_stats.ds_Sv}
      min_depth: ${inputs.min_depth}
      max_depth: ${inputs.max_depth}
      time_min: ${inputs.time_min}
      time_max: ${inputs.time_max}
      x_axis_units: ${inputs.x_axis_units}
      y_axis_units: ${inputs.y_axis_units}
