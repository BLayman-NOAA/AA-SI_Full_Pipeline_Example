# HB1603 user-level recipe, built on the parallel survey-level checkpoints.
# The cache is keyed on step definitions, so levels 1 to 3 hit the survey tier
# only while they match survey_recipe_parallel.yaml exactly. For the same reason
# the plain and parallel recipe pairs share no cached work.
#
#   aa-recipe run survey_recipe_parallel.yaml --cache-write-tier survey
#   aa-recipe run user_recipe_parallel.yaml

recipe:
  name: "processing_levels_pipeline_gcs_parallel"
  description: "HB1603 pipeline over raw files in a GCS bucket with per-file parallel levels 1 and 2: levels 1 to 4, through MVBS to HDBSCAN clustering, with the sperm whale dive line drawn on the echograms."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  raw_input_folder:
    type: path
    # Hash the folder's contents, not its location.
    fingerprint_mode: auto
    description: "Folder of raw .raw files, a local path or a gs:// URL."
  cal_input_folder:
    type: path
    default: "./calibration_files/HB201607_cal"
    description: "Folder of manufacturer calibration files (.cal for EK60, .xml for EK80), a local path or a gs:// URL."
  line_file_path:
    type: path
    default: "./line_files/SpermWhaleClicks_click_data_HB1603_SpermWhaleDive_Span0.2_07252016_2120_UTC.csv"
    description: "Line file drawn over the MVBS grid and echograms, such as a sperm whale click track (.csv) or an Echoview .evl line. A local path or a gs:// URL."

  # Display window shared by every plotting step; a step can override it.
  min_depth:
    type: float
    default: 0
    description: "Shallowest depth shown on the echograms, in metres."
  max_depth:
    type: float
    default: 1800
    description: "Deepest depth shown on the echograms, in metres. Unset uses the deepest depth in the data."
  time_min:
    type: str
    description: "Start of the echogram window, as a UTC timestamp such as \"2024-10-15T12:30\". Unset starts at the first ping."
  time_max:
    type: str
    description: "End of the echogram window, as a UTC timestamp such as \"2024-10-15T12:30\". Unset runs to the last ping."
  x_axis_units:
    type: str
    default: "datetime"
    description: "Echogram x axis: \"datetime\" (UTC clock time), \"seconds\" from the first ping shown, \"pings\", \"meters\" travelled, or \"bins\" (MVBS only)."
  y_axis_units:
    type: str
    default: "meters"
    description: "Echogram y axis: \"meters\", \"range_sample\", or \"bins\" (MVBS only)."


steps:

  # Levels 1 to 3: keep identical to survey_recipe_parallel.yaml, or these steps
  # rehash and miss the survey tier.

  - include: sub_recipes/processing_lvl_1_gcs_parallel.yaml
    input_overrides:
      raw_input_folder: ${inputs.raw_input_folder}
      cal_input_folder: ${inputs.cal_input_folder}
      # Clear both to process the whole bucket folder.
      file_time_start: "2016-07-25T20:58"
      file_time_end: "2016-07-25T21:45"
      cruise_id: "HB1603"
      record_author: "<Your Name>"
      sonar_model: "EK60"

  # Must follow level 1 directly: it continues the same mapped chain.
  - include: sub_recipes/processing_lvl_2_parallel.yaml
    input_overrides:
      echodata: ${combine_raw.echodata}
      cal_params: ${extract_cal_params.cal_params}
      env_params: ${extract_cal_params.env_params}
      depth_offset: 6
      seafloor_buffer_m: 100
      surface_mask_depth: 10.0
      range_sample_num: 10
      ping_num: 5
      # Must stay below the window's ping count (~516 here) or it is one chunk.
      noise_chunk_ping_time: 100

  - id: plot_sv_clean
    op: plot_sv_echogram
    regenerate: if-missing
    inputs:
      ds_Sv: ${remove_noise.ds_Sv}
    params:
      min_depth: ${inputs.min_depth}
      max_depth: ${inputs.max_depth}
      time_min: ${inputs.time_min}
      time_max: ${inputs.time_max}
      x_axis_units: ${inputs.x_axis_units}
      y_axis_units: ${inputs.y_axis_units}
      dpi: 100

  - include: sub_recipes/processing_lvl_3.yaml
    input_overrides:
      sv_clean_unmasked: ${remove_noise.ds_Sv}
      range_bin: "20m"
      ping_time_bin: "20s"
      nan_threshold: 0.6

  # User-level additions, with no survey-tier equivalent.

  - id: add_line_overlay
    op: add_line_overlay
    inputs:
      ds: ${compute_mvbs.ds_MVBS}
    params:
      line_file_path: ${inputs.line_file_path}
      line_name: "sw_dive_profile"

  - id: plot_mvbs
    op: plot_sv_echogram
    regenerate: if-missing
    inputs:
      ds_Sv: ${add_line_overlay.ds}
      ds_Sv_source: ${mask_sparse.ds_Sv}
    params:
      min_depth: ${inputs.min_depth}
      max_depth: ${inputs.max_depth}
      time_min: ${inputs.time_min}
      time_max: ${inputs.time_max}
      x_axis_units: ${inputs.x_axis_units}
      y_axis_units: ${inputs.y_axis_units}
      dpi: 50
      overlay_lines:
        - var: "sw_dive_profile_fit"
          style:
            color: "red"
            linewidth: 3.5

  # Level 4 takes the seafloor line instead of echodata, a per-file list here.
  # merge_seafloor collects it because a direct ${detect_seafloor.seafloor_depth}
  # reference fails on a resumed run once the mapped chain is pruned. It is not
  # in level 2 because survey_recipe_parallel.yaml shares that and has no use for it.
  # depends_on is required: a non-mapped step mid-chain would split the chain
  # and the later members would read per-file lists instead of their element.
  - id: merge_seafloor
    op: merge_datasets
    collect: ${detect_seafloor.seafloor_depth}
    checkpoint: always
    depends_on: [merge_sv]
    inputs:
      datasets: ${detect_seafloor.seafloor_depth}
    params:
      dim: "ping_time"

  - include: sub_recipes/processing_lvl_4_parallel.yaml
    input_overrides:
      mvbs_with_lines: ${add_line_overlay.ds}
      seafloor_depth: ${merge_seafloor.merged}
      overlay_line_var: "sw_dive_profile"
      sv_clean_unmasked: ${remove_noise.ds_Sv}
      cell_stats_sv: ${compute_cell_stats.ds_Sv}
      min_depth: ${inputs.min_depth}
      max_depth: ${inputs.max_depth}
      time_min: ${inputs.time_min}
      time_max: ${inputs.time_max}
      x_axis_units: ${inputs.x_axis_units}
      y_axis_units: ${inputs.y_axis_units}
