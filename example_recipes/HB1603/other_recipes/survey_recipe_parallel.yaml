# HB1603 survey-level recipe, tuned for a bandwidth-limited gs:// cache.
#
# Parallel variant of survey_recipe.yaml. Most of a baseline bucket run was
# checkpoint upload rather than compute, so this recipe trims uploads first and
# adds parallelism second:
#
#   1. No checkpoint on ep_add_splitbeam_angle. It was the largest upload in the
#      run for almost no compute, and its arrays are re-uploaded inside
#      remove_noise anyway.
#   2. No checkpoint on combine_raw. Per file it only materializes what read_raw
#      just wrote, and compute_sv downstream is checkpointed.
#   3. temp_dir on local disk, set in the config file. Its zarr intermediates
#      are deleted at the end of the run, so round-tripping them through the
#      bucket is pure cost. Reverse it if the workstation is disk-constrained.
#   4. rechunk_before_noise added, which cuts remove_noise's compute.
#   5. Per-file map_over through ingest, Sv and masking, with the fan-in after
#      Sv, so --executor dask can overlap the per-file network I/O.
#
# --executor dask is worth trying here but measure it: a whole chain instance
# runs as one task, so no per-file intermediate crosses a task boundary, but
# whether concurrency helps depends on whether the uplink caps per stream.
#
# Run:  aa-recipe run survey_recipe_parallel.yaml --cache-write-tier survey

recipe:
  name: "processing_levels_pipeline_gcs_parallel"
  description: "HB1603 GCS pipeline with per-file parallel ingest and upload-minimized checkpoints."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  raw_input_folder:
    type: path
    # Content-fingerprint the (remote) folder so the cache key tracks the file set
    fingerprint_mode: auto
  cal_input_folder:
    type: path
    default: "./calibration_files/HB201607_cal"
  line_file_path:
    type: path
    default: "./line_files/SpermWhaleClicks_click_data_HB1603_SpermWhaleDive_Span0.2_07252016_2120_UTC.csv"

  # Default display window shared by every plotting step in this pipeline
  # You can override these by hardcoding values for a specific step or sub-recipe
  min_depth:
    type: float
    default: 0
  max_depth:
    type: float
    default: 1800
  # With no defaults the echograms span the whole time range. Set either to a
  # UTC timestamp, for example "2016-07-18T09:30", to window them instead.
  time_min:
    type: str
  time_max:
    type: str
  x_axis_units:
    type: str
    default: "datetime"
  y_axis_units:
    type: str
    default: "meters"


steps:

  - include: sub_recipes/processing_lvl_1_gcs_parallel.yaml
    input_overrides:
      raw_input_folder: ${inputs.raw_input_folder}
      cal_input_folder: ${inputs.cal_input_folder}
      # Data time range: clear both to process the whole bucket folder.
      file_time_start: "2016-07-25T20:58"
      file_time_end: "2016-07-25T21:45"
      cruise_id: "HB1603"
      record_author: "<Your Name>"
      sonar_model: "EK60"

  # Must follow level 1 directly: it continues the same mapped chain.
  - include: sub_recipes/processing_lvl_2_parallel.yaml
    input_overrides:
      echodata: ${combine_raw.echodata}
      cal_params: ${extract_cal_params.cal_params}
      env_params: ${extract_cal_params.env_params}
      # Fixed transducer depth below the waterline for the whole survey.
      depth_offset: 6
      # seafloor mask
      seafloor_buffer_m: 100
      # surface mask
      surface_mask_depth: 10.0
      # parameters for echopype's remove_background_noise:
      range_sample_num: 10
      ping_num: 5
      # Must stay below the window's real ping count (~516 here) or it clamps
      # to a single chunk and silently does nothing.
      noise_chunk_ping_time: 100

  # - id: plot_sv_clean
  #   op: plot_sv_echogram
  #   regenerate: if-missing
  #   inputs:
  #     ds_Sv: ${remove_noise.ds_Sv}
  #   params:
  #     min_depth: ${inputs.min_depth}
  #     max_depth: ${inputs.max_depth}
  #     time_min: ${inputs.time_min}
  #     time_max: ${inputs.time_max}
  #     x_axis_units: ${inputs.x_axis_units}
  #     y_axis_units: ${inputs.y_axis_units}
  #     dpi: 100

  # Unchanged from survey_recipe.yaml: level 3 is survey-wide and its checkpoint
  # is cheap to upload.
  - include: sub_recipes/processing_lvl_3.yaml
    input_overrides:
      sv_clean_unmasked: ${remove_noise.ds_Sv}
      # MVBS bin size:
      range_bin: "20m"
      ping_time_bin: "20s"
      nan_threshold: 0.6 # mask bin if NAN's exceed this fraction of data in the cell

