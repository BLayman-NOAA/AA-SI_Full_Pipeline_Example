# Config for the HB1603 recipes in this folder. CLI flags override these
# values, which override the recipe input defaults. Search order: --config,
# $AA_RECIPE_CONFIG, <recipe_stem>.config.yaml beside the recipe, this file,
# ~/.config/aa-recipe/config.yaml.

# Checkpoints stay in the bucket: they are the durable, shared artifacts.
user_cache_dir: gs://ggn-nmfs-aa-dev-1-data/Jech_Test/HB1603/recipe_1/user_cache

# Per-file zarr intermediates, deleted after the run; local avoids a bucket
# round trip (use gs://.../exe_temp if disk is short). Leave room for one raw
# file and its zarr per concurrent instance plus the largest staged checkpoint.
temp_dir: ./exe_temp

# Must stay local: calibration artifacts and images cannot target object
# storage yet.
outputs_dir: ./outputs

survey_cache_dir: gs://ggn-nmfs-aa-dev-1-data/Jech_Test/HB1603/recipe_1/survey_cache

# fsspec storage options for remote paths. Leave unset for Application Default
# Credentials; set only for other credentials, such as a service-account token.
# storage_options:
#   token: /path/to/service-account.json

# Recipe input values; --input NAME=VALUE overrides them.
inputs:
  raw_input_folder: gs://ggn-nmfs-aa-dev-1-data/Test_Layman/HB1603/raw

  # cal_input_folder: gs://ggn-nmfs-aa-dev-1-data/Test_Layman/HB1603/calibration
  # line_file_path:   gs://ggn-nmfs-aa-dev-1-data/Test_Layman/HB1603/line_files/your_line_file.csv
