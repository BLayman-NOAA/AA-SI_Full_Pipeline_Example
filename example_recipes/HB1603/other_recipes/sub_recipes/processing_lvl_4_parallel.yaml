# Processing Level 4 (Parallel) - Machine Learning
#
# Reshapes MVBS for ML, adds auxiliary features, normalizes the ML dataset,
# runs HDBSCAN clustering, and produces the clustering report outputs.
#
# Identical to processing_lvl_4.yaml except for how the seafloor line reaches
# add_aux_features. In a per-file map_over pipeline there is no survey-wide
# EchoData to read detected_seafloor_depth from -- combine_raw is mapped, so
# ${combine_raw.echodata} is a LIST of one EchoData per raw file. Rather than
# collecting ~1.2 GB of EchoData back together to reach ~20 KB of seafloor
# data, this variant feeds add_aux_features the line that detect_seafloor
# already produced per file.
#
# Two consequences worth knowing:
#
#   * The ML seafloor is now the line detect_seafloor CHOSE (best channel, or
#     whichever method the recipe uses), not a mean across all channels as
#     add_auxiliary_features computes internally from raw EchoData. It is also
#     the same line create_seafloor_mask masked with, so masking and ML agree.
#
#   * VERTICAL REFERENCE: no action needed. 'altitude' is a difference
#     (seafloor minus sample), so a constant offset shared by both terms
#     cancels and the frame does not matter as long as they agree. They do:
#     detect_seafloor promotes its line to surface-referenced only when its
#     ds_Sv carries depth, the same condition under which depth reaches the ML
#     dataset, and add_auxiliary_features prefers depth over echo_range to
#     pair with it. 'seafloor_depth' as a feature is unaffected either way.

recipe:
  name: "processing_lvl_4_parallel"
  description: "ML reshape, normalization, clustering, and reporting (per-file seafloor line)."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  mvbs_with_lines:
    type: dataset
    description: "MVBS dataset with line overlay variables added."
  seafloor_depth:
    type: dataarray
    required: false
    description: >
      Pre-detected seafloor line for the 'seafloor_depth' / 'altitude'
      features. Wire straight from the mapped detect_seafloor step
      (${detect_seafloor.seafloor_depth}); the reference resolves to the list
      of per-file lines, which add_auxiliary_features concatenates along
      ping_time in segment order. No collect step is needed.
  overlay_line_var:
    type: str
    default: "overlay_line"
    description: "Line variable to overlay on the clustering report plot."
  sv_clean_unmasked:
    type: dataset
    description: >
      Pre-sparse-mask Sv used as the backdrop and ping-index reference for ML
      and cluster echogram plots.
  cell_stats_sv:
    type: dataset
    description: "Per-cell statistics dataset produced from the clean unmasked Sv dataset."
  min_depth:
    type: float
    default: 0
    description: "Shallowest depth in meters shown by the ML and clustering echograms."
  max_depth:
    type: float
    default: 1800
    description: "Deepest depth in meters shown by the ML and clustering echograms."
  ping_min:
    type: int
    default: 0
    description: "First ping index shown by the ML and clustering echograms."
  ping_max:
    type: int
    default: 515
    description: "Last ping index shown by the ML and clustering echograms."
  x_axis_units:
    type: str
    default: "seconds"
    description: "Units for the x-axis of the ML and clustering echograms."
  y_axis_units:
    type: str
    default: "meters"
    description: "Units for the y-axis of the ML and clustering echograms."

steps:

  - id: reshape_ml
    op: reshape_for_ml
    inputs:
      ds_MVBS: ${inputs.mvbs_with_lines}
    params:
      data_var: "Sv"
      dataset_name: "ml_dataset"
      feature_strategy: "mean_centered"
      baseline_channel: 0

  # echodata is deliberately absent: it is a per-file list in this pipeline,
  # and seafloor_depth supplies the only thing it was needed for. Add
  # 'seafloor_depth' to features below to use it (see this file's header for
  # the 'altitude' caveat).
  - id: add_aux_features
    op: add_auxiliary_features
    inputs:
      ds_ml: ${reshape_ml.ds_ml_ready}
      ds_sv: ${inputs.cell_stats_sv}
      seafloor_depth: ${inputs.seafloor_depth}
    params:
      dataset_name: "ml_dataset"
      features:
        - cell_cv

  - id: normalize_ml
    op: normalize_ml_data
    checkpoint: always
    inputs:
      ds_ml: ${add_aux_features.ds_ml_ready}
    params:
      method: "flatten"
      dataset_name: "ml_dataset"
      normalization_name: "norm_flat_clr"
      shift_positive: false

  - id: plot_normalized_ml
    op: plot_ml_echogram
    regenerate: if-missing
    inputs:
      ds_normalized: ${normalize_ml.ds_normalized}
      ds_Sv: ${inputs.sv_clean_unmasked}
    params:
      dataset_name: "ml_dataset"
      normalization_name: "norm_flat_clr"
      min_depth: ${inputs.min_depth}
      max_depth: ${inputs.max_depth}
      ping_min: ${inputs.ping_min}
      ping_max: ${inputs.ping_max}
      x_axis_units: ${inputs.x_axis_units}
      y_axis_units: ${inputs.y_axis_units}
      dpi: 50

  - id: run_hdbscan
    op: run_hdbscan
    inputs:
      ds_normalized: ${normalize_ml.ds_normalized}
    params:
      dataset_name: "ml_dataset"
      normalization_name: "norm_flat_clr"
      ml_result_name: "hdbscan_results"
      min_cluster_size_fraction: 0.02
      min_samples: 4
      sample_size: 1000000
      cluster_selection_method: "leaf"
      use_hdbscan: true

  - id: embed_results
    op: embed_clustering_results
    checkpoint: always
    inputs:
      ds_normalized: ${normalize_ml.ds_normalized}
      clustering_results: ${run_hdbscan.clustering_results}
    params:
      dataset_name: "ml_dataset"
      ml_result_name: "hdbscan_results"

  - id: plot_clustering_report
    op: plot_clustering_report
    regenerate: if-missing
    inputs:
      ds_normalized: ${embed_results.ds_normalized}
      clustering_results: ${run_hdbscan.clustering_results}
      clustering_model: ${run_hdbscan.clustering_model}
      ds_Sv: ${inputs.sv_clean_unmasked}
    params:
      dataset_name: "ml_dataset"
      ml_result_name: "hdbscan_results"
      # [min_depth, max_depth, ping_min, ping_max]
      plot_window:
        - ${inputs.min_depth}
        - ${inputs.max_depth}
        - ${inputs.ping_min}
        - ${inputs.ping_max}
      x_axis_units: ${inputs.x_axis_units}
      y_axis_units: ${inputs.y_axis_units}
      dpi: 50
      overlay_line_var: ${inputs.overlay_line_var}
      cluster_colors:
        - "#9D00FF"
        - "#35E200"
        - "#FF0000"
        - "#2F00FF"
        - "#FF8800"
        - "#FFFB1C"
        - "#FF44E9"
        - "#00BE8BCA"
        - "#00FFE5"
        - "#3D8D00FF"
        - "#9C67FFFF"
      cluster_stats_sv_data_var: "Sv"