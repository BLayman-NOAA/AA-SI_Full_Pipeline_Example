# Processing level 2 (GCS, parallel): per-file Sv and masking, survey fan-in.
# Continues the mapped chain from processing_lvl_1_gcs_parallel.yaml, which
# must be included immediately before this level.
#
# The fan-in follows apply_mask: the depth, split-beam and seafloor steps need
# each file's EchoData, and every step up to there is ping-local. remove_noise
# has a cross-ping window, so it runs survey-wide.
#
# Checkpoints are upload-cost choices. ep_add_splitbeam_angle and merge_sv are
# not checkpointed (large uploads; checkpoint merge_sv under a local cache).
# compute_sv is, per file, so a new raw file recomputes only that file.

recipe:
  name: "processing_lvl_2_parallel"
  description: "Compute and mask Sv one raw file at a time, merge the files into one survey Sv, then remove background noise."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  echodata:
    type: echodata
    description: "One file's raw EchoData from level 1, calibrated to Sv here and used for transducer depth."
  cal_params:
    type: dict
    description: "Calibration values for each channel for this file, taken from the standardized calibration mapping and applied when computing Sv."
  env_params:
    type: dict
    description: "Environmental values for each channel for this file, such as sound speed and absorption, taken from the standardized calibration mapping and applied when computing Sv."
  depth_offset:
    type: float
    default: 0.0
    description: >
      Transducer depth below the waterline, in metres, added to range to give
      depth. One fixed value for the whole survey.
  seafloor_buffer_m:
    type: float
    default: 0.0
    description: >
      Height above the seabed line, in metres, that is also masked, to drop the
      bottom echo and detection error.
  surface_mask_depth:
    type: float
    default: 10.0
    description: "Range from the transducer, in metres, above which samples are masked, to remove the transmit pulse and ringdown."
  # The default drops the high frequencies, which at depth carry only
  # range-amplified noise. Blanked channels are all NaN, the source of noise
  # removal's harmless "All-NaN slice" warning.
  frequencies_to_mask:
    type: list
    default: [70, 120, 200]
    description: >
      Nominal channel frequencies in kHz to blank, such as [70, 120, 200]; every
      sample on those channels is masked. An empty list keeps every channel.
  noise_range_sample_num:
    type: int
    default: 10
    description: "Range samples per bin for the background noise estimate."
  noise_ping_num:
    type: int
    default: 5
    description: "Pings per bin for the background noise estimate."
  # Must be below the window's ping count or it is a single chunk. On a
  # cross-region bucket prefer larger values: more chunks mean more objects to
  # write on the checkpoint. Benchmarked ~40% faster on HB1603 (2026-07-31).
  noise_chunk_ping_time:
    type: int
    default: 100
    description: >
      Ping-time chunk size set before noise removal, so the noise estimate runs
      in dask chunks rather than as one in-memory block. Keep it a multiple of
      noise_ping_num.

steps:

  # Per-file chain, continuing the map_over from level 1.

  - id: compute_sv
    op: compute_sv
    map_over: ${initial_setup.raw_file_paths}
    checkpoint: always
    inputs:
      echodata: ${inputs.echodata}
      cal_params: ${inputs.cal_params}
      env_params: ${inputs.env_params}

  - id: ep_add_depth
    op: ep_add_depth
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
      echodata: ${inputs.echodata}
    params:
      depth_offset: ${inputs.depth_offset}

  # No checkpoint, see the header. Dropping this step and pointing
  # create_seafloor_mask at ${ep_add_depth.ds_Sv} would shrink remove_noise's
  # checkpoint further, but removes the split-beam angles from the product.
  - id: ep_add_splitbeam_angle
    op: ep_add_splitbeam_angle
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      ds_Sv: ${ep_add_depth.ds_Sv}
      echodata: ${inputs.echodata}
    params:
      waveform_mode: "CW"
      encode_mode: "power"
      to_disk: false

  - id: log_seafloor_stats
    op: log_seafloor_detection_stats
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      echodata: ${inputs.echodata}
      ds_Sv: ${compute_sv.ds_Sv}
    params:
      min_valid_depth_m: 10.0

  - id: detect_seafloor
    op: detect_seafloor
    map_over: ${initial_setup.raw_file_paths}
    depends_on: [log_seafloor_stats]
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
      echodata: ${inputs.echodata}
    params:
      min_valid_depth_m: 10.0

  - id: create_seafloor_mask
    op: create_seafloor_mask
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      ds_Sv: ${ep_add_splitbeam_angle.ds_Sv}
      seafloor_depth: ${detect_seafloor.seafloor_depth}
    params:
      seafloor_buffer_m: ${inputs.seafloor_buffer_m}

  - id: create_surface_mask
    op: create_surface_mask
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
    params:
      surface_depth_m: ${inputs.surface_mask_depth}

  - id: create_frequency_mask
    op: create_frequency_mask
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
    params:
      frequencies_to_mask: ${inputs.frequencies_to_mask}

  - id: combine_masks
    op: combine_masks
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      masks:
        - ${create_seafloor_mask.mask}
        - ${create_surface_mask.mask}
        - ${create_frequency_mask.mask}
    params:
      mode: "and"

  - id: apply_mask
    op: apply_sv_mask
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
      mask: ${combine_masks.mask}

  # Fan-in to one survey Sv. Not checkpointed, see the header.

  - id: merge_sv
    op: merge_datasets
    collect: ${apply_mask.ds_Sv}
    inputs:
      datasets: ${apply_mask.ds_Sv}
    params:
      dim: "ping_time"

  # Survey-wide from here on.

  - id: rechunk_before_noise
    op: rechunk_dataset
    inputs:
      ds_Sv: ${merge_sv.merged}
    params:
      ping_time_chunk: ${inputs.noise_chunk_ping_time}

  - id: remove_noise
    op: remove_background_noise
    checkpoint: always
    inputs:
      ds_Sv: ${rechunk_before_noise.ds_Sv}
    params:
      range_sample_num: ${inputs.noise_range_sample_num}
      ping_num: ${inputs.noise_ping_num}
