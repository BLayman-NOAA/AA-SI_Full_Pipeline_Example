# Processing level 2 (GCS, parallel): per-file Sv and masking, survey fan-in.
#
# GCS-tuned per-file variant of processing_lvl_2.yaml. Continues the mapped
# chain started in processing_lvl_1_gcs_parallel.yaml, which must be included
# immediately before this level.
#
#   [per file] compute_sv -> ep_add_depth -> ep_add_splitbeam_angle
#              -> log_seafloor_stats -> detect_seafloor
#              -> seafloor/surface/frequency masks -> combine -> apply_mask
#   [fan-in]   merge_sv, concat along ping_time
#   [survey]   rechunk_before_noise -> remove_noise
#
# The fan-in sits at apply_mask because the depth, split-beam and seafloor steps
# all need the EchoData that produced the Sv, and because every step above it is
# ping-local, so per-file results match whole-survey ones. remove_noise is the
# first step with a cross-ping window, so it stays survey-wide.
#
# Checkpoints below are cost decisions, not defaults, since uploads dominate a
# bucket run:
#
#   * ep_add_splitbeam_angle: no checkpoint. It was a large upload for almost no
#     compute, and remove_noise re-uploads its angle arrays anyway.
#   * merge_sv: no checkpoint. A full-survey write here is expensive on a slow
#     uplink and remove_noise downstream is already checkpointed. Under a local
#     cache, checkpoint it: the write is cheap and it shortens re-runs.
#   * compute_sv: kept, now per file, so adding one raw file later recomputes
#     only that file.
#   * remove_noise: kept. This is the durable science product.

recipe:
  name: "processing_lvl_2_parallel"
  description: "Per-file Sv and masking, fan-in to survey Sv, then noise removal."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  echodata:
    type: echodata
    description: "Per-file EchoData object from the parallel raw ingest stage."
  cal_params:
    type: dict
    description: "Calibration parameters selected for this file."
  env_params:
    type: dict
    description: "Environmental parameters selected for this file."
  depth_offset:
    type: float
    default: 0.0
    description: >
      Transducer depth in meters below the waterline, added to range to give
      depth. Fixed for the whole survey rather than derived per ping.
  seafloor_buffer_m:
    type: float
    default: 0.0
    description: >
      Metres above the detected seafloor at which the seafloor mask starts
      excluding samples, so the bottom echo and its ringing are dropped.
  surface_mask_depth:
    type: float
    default: 10.0
    description: "Depth in meters above which the surface mask excludes samples."
  frequencies_to_mask:
    type: list
    default: [70, 120, 200]
    description: >
      Frequencies (kHz) removed by the frequency mask. These channels become
      entirely NaN, which is where remove_noise's benign "All-NaN slice
      encountered" warning comes from.
  noise_range_sample_num:
    type: int
    default: 10
    description: "Number of range samples per bin used for background noise estimation."
  noise_ping_num:
    type: int
    default: 5
    description: "Number of pings per bin used for background noise estimation."
  noise_chunk_ping_time:
    type: int
    default: 100
    description: >
      Ping-time chunk size applied to the merged survey Sv before remove_noise,
      so its coarsen()-based estimate runs dask-parallel instead of as one
      in-memory block. Must be smaller than the window's ping count or it
      clamps to a single chunk and does nothing, and should stay a multiple of
      noise_ping_num so coarsen() dispatches across chunks cleanly. On a
      cross-region bucket, more chunks means more objects and more round trips
      on the checkpoint write, so prefer larger values there.

steps:

  # Per-file chain, continuing the map_over from level 1.

  - id: compute_sv
    op: compute_sv
    map_over: ${initial_setup.raw_file_paths}
    checkpoint: always
    inputs:
      echodata: ${inputs.echodata}
      cal_params: ${inputs.cal_params}
      env_params: ${inputs.env_params}

  - id: ep_add_depth
    op: ep_add_depth
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
      echodata: ${inputs.echodata}
    params:
      depth_offset: ${inputs.depth_offset}

  # No checkpoint, see the header. If the archived product does not need the
  # split-beam angle variables at all, dropping this step and pointing
  # create_seafloor_mask at ${ep_add_depth.ds_Sv} would shrink remove_noise's
  # checkpoint further, but that changes what the pipeline produces.
  - id: ep_add_splitbeam_angle
    op: ep_add_splitbeam_angle
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      ds_Sv: ${ep_add_depth.ds_Sv}
      echodata: ${inputs.echodata}
    params:
      waveform_mode: "CW"
      encode_mode: "power"
      to_disk: false

  - id: log_seafloor_stats
    op: log_seafloor_detection_stats
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      echodata: ${inputs.echodata}
      ds_Sv: ${compute_sv.ds_Sv}
    params:
      min_valid_depth_m: 10.0

  - id: detect_seafloor
    op: detect_seafloor
    map_over: ${initial_setup.raw_file_paths}
    depends_on: [log_seafloor_stats]
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
      echodata: ${inputs.echodata}
    params:
      min_valid_depth_m: 10.0

  - id: create_seafloor_mask
    op: create_seafloor_mask
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      ds_Sv: ${ep_add_splitbeam_angle.ds_Sv}
      seafloor_depth: ${detect_seafloor.seafloor_depth}
    params:
      seafloor_buffer_m: ${inputs.seafloor_buffer_m}

  - id: create_surface_mask
    op: create_surface_mask
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
    params:
      surface_depth_m: ${inputs.surface_mask_depth}

  - id: create_frequency_mask
    op: create_frequency_mask
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
    params:
      frequencies_to_mask: ${inputs.frequencies_to_mask}

  - id: combine_masks
    op: combine_masks
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      masks:
        - ${create_seafloor_mask.mask}
        - ${create_surface_mask.mask}
        - ${create_frequency_mask.mask}
    params:
      mode: "and"

  - id: apply_mask
    op: apply_sv_mask
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
      mask: ${combine_masks.mask}

  # Fan-in: reassemble the survey from the per-file masked Sv. Not checkpointed
  # on a remote cache, see the header.

  - id: merge_sv
    op: merge_datasets
    collect: ${apply_mask.ds_Sv}
    inputs:
      datasets: ${apply_mask.ds_Sv}
    params:
      dim: "ping_time"

  # Survey-wide from here on.

  - id: rechunk_before_noise
    op: rechunk_dataset
    inputs:
      ds_Sv: ${merge_sv.merged}
    params:
      ping_time_chunk: ${inputs.noise_chunk_ping_time}

  - id: remove_noise
    op: remove_background_noise
    checkpoint: always
    inputs:
      ds_Sv: ${rechunk_before_noise.ds_Sv}
    params:
      range_sample_num: ${inputs.noise_range_sample_num}
      ping_num: ${inputs.noise_ping_num}
