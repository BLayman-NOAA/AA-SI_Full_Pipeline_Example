# Processing level 1 (GCS, parallel): per-file raw ingest and calibration.
#
# GCS-tuned per-file variant of processing_lvl_1_gcs.yaml, aimed at the finding
# that most of a baseline bucket run was checkpoint upload rather than compute.
# Two changes:
#
#   1. combine_raw is no longer checkpointed. Per file it only opens a zarr
#      store read_raw just wrote, so the checkpoint was a full re-upload.
#      compute_sv downstream is checkpointed, so a cache hit still prunes both.
#   2. Each file selects its own calibration parameters via
#      raw_file_path: ${_item}. mapping_dict is keyed per raw filename, and
#      without this every file would reuse the first file's channel mapping.
#
# The per-file fan-out also lets --executor dask overlap the network I/O that
# dominates this pipeline.

recipe:
  name: "processing_lvl_1_gcs_parallel"
  description: "Per-file raw ingest and per-file calibration selection (gs:// inputs)."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  raw_input_folder:
    type: path
    description: "Folder containing the raw acoustic files (local path or gs:// URL)."
  cal_input_folder:
    type: path
    description: "Folder containing manufacturer calibration files (local path or gs:// URL)."
  calibration_outputs:
    type: str
    default: "calibration"
    description: "Subdirectory name under the pipeline outputs folder for calibration artifacts."
  cruise_id:
    type: str
    description: "Cruise identifier used in calibration mapping."
  record_author:
    type: str
    default: "<Your Name>"
  sonar_model:
    type: str
    default: "EK60"
  raw_file_names:
    type: list
    default: []
    description: >
      Optional subset of filenames within raw_input_folder to use. Empty list
      means "use every .raw file in the folder".
  file_time_start:
    type: str
    required: false
    description: >
      Optional inclusive ISO datetime restricting processing to raw files whose
      filename-encoded time (D{YYYYMMDD}-T{HHMMSS}) is at or after this bound.
      Applied to both the processed file set and the calibration scan; leave
      unset to process every file.
  file_time_end:
    type: str
    required: false
    description: "Optional inclusive ISO datetime upper bound; see file_time_start."
  ping_time_chunk:
    type: int
    default: 1000
    description: >
      Chunk length along ping_time for each file's EchoData. Since combine_raw
      is not checkpointed here, this only sets in-memory chunking for the
      per-file Sv computation downstream.

steps:

  - id: initial_setup
    op: initial_setup
    params:
      raw_input_folder: ${inputs.raw_input_folder}
      calibration_outputs: ${inputs.calibration_outputs}
      raw_file_names: ${inputs.raw_file_names}
      clear_previous_json_logs: true
      file_time_start: ${inputs.file_time_start}
      file_time_end: ${inputs.file_time_end}

  # Runs once for the whole survey, so the calibration files are parsed once.
  # mapping_dict is keyed per raw filename, and each extract_cal_params instance
  # below picks its own file's entry out of it.
  - id: gen_cal_mapping
    op: generate_standardized_cal_mapping
    params:
      raw_input_folder: ${inputs.raw_input_folder}
      cal_input_folder: ${inputs.cal_input_folder}
      output_base: ${initial_setup.calibration_output_dir}
      cruise_id: ${inputs.cruise_id}
      record_author: ${inputs.record_author}
      short_filenames: true
      keep_unused: true
      conflict_resolution: "error"
      file_time_start: ${inputs.file_time_start}
      file_time_end: ${inputs.file_time_end}

  # Per-file fan-out starts here. Every step from here through the end of
  # processing_lvl_2_parallel.yaml shares this map_over source, so a whole chain
  # instance runs as one task and no intermediate crosses a task boundary.
  #
  # checkpoint: never, because the output is a temp_dir store path that is
  # deleted at the end of the run and would dangle if cached.
  #
  # No dask_config scheduler override: this work is network-bound rather than
  # GIL-bound, and a process pool would pay a large spawn cost per instance.
  - id: read_raw
    op: read_raw_files
    map_over: ${initial_setup.raw_file_paths}
    checkpoint: never
    inputs:
      raw_file_paths:
        - ${_item}          # a single-element list: just this file
    params:
      sonar_model: ${inputs.sonar_model}
      include_bot: true
      intermediate_format: "zarr"

  # Materializes this file's store as an EchoData object. Not a fan-in:
  # combine_raw_files takes a single-file list and simply opens it. Not
  # checkpointed, see item 1 in the header.
  - id: combine_raw
    op: combine_raw_files
    map_over: ${initial_setup.raw_file_paths}
    checkpoint: never
    inputs:
      raw_stores: ${read_raw.raw_stores}
    params:
      ping_time_chunk: ${inputs.ping_time_chunk}

  # Selects (does not recompute) this file's channel-to-calibration mapping
  # out of the shared dicts built once above.
  - id: extract_cal_params
    op: extract_standardized_cal_params
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      calibration_dict: ${gen_cal_mapping.calibration_dict}
      mapping_dict: ${gen_cal_mapping.mapping_dict}
      echodata: ${combine_raw.echodata}
    params:
      raw_file_path: ${_item}
