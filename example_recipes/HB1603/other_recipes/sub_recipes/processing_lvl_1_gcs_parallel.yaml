# Processing level 1 (GCS, parallel): per-file raw ingest and calibration.
# Per-file variant of processing_lvl_1_gcs.yaml; the fan-out lets
# --executor dask overlap the network I/O that dominates this pipeline.

recipe:
  name: "processing_lvl_1_gcs_parallel"
  description: "Level 1 for raw files in a bucket, one file at a time: build the calibration mapping once, then read each raw file and select its own calibration and environment values."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  raw_input_folder:
    type: path
    description: "Folder of raw .raw files, a local path or a gs:// URL."
  cal_input_folder:
    type: path
    description: "Folder of manufacturer calibration files (.cal for EK60, .xml for EK80), a local path or a gs:// URL."
  calibration_outputs:
    type: str
    default: "calibration"
    description: "Name of the subfolder of the run's outputs folder that calibration artifacts are written to."
  cruise_id:
    type: str
    description: "Cruise identifier, such as \"HB1603\", recorded in every generated single-channel calibration file so it stays traceable to the survey."
  record_author:
    type: str
    default: "<Your Name>"
    description: "Name recorded as the author of every generated single-channel calibration file."
  sonar_model:
    type: str
    default: "EK60"
    description: "Echosounder model as echopype names it, such as \"EK60\" or \"EK80\"."
  raw_file_names:
    type: list
    default: []
    description: "Optional list of file names within raw_input_folder to process. An empty list uses every .raw file in the folder."
  # The time filter also sets the fan-out width: one mapped instance per
  # selected file.
  file_time_start:
    type: str
    required: false
    description: >
      Optional inclusive ISO datetime matched to the D{YYYYMMDD}-T{HHMMSS} time
      in each raw file name; files at or after it are processed and scanned for
      calibration. Unset takes every file.
  file_time_end:
    type: str
    required: false
    description: >
      Optional inclusive ISO datetime matched to the D{YYYYMMDD}-T{HHMMSS} time
      in each raw file name; files at or before it are processed and scanned for
      calibration. Unset takes every file.
  # combine_raw is not checkpointed here, so this only sets in-memory chunking.
  ping_time_chunk:
    type: int
    default: 1000
    description: >
      Chunk length along ping_time of each file's EchoData. Larger chunks mean
      fewer chunks but more memory per chunk; lower it if a file does not fit
      in memory.

steps:

  - id: initial_setup
    op: initial_setup
    params:
      raw_input_folder: ${inputs.raw_input_folder}
      calibration_outputs: ${inputs.calibration_outputs}
      raw_file_names: ${inputs.raw_file_names}
      clear_previous_json_logs: true
      file_time_start: ${inputs.file_time_start}
      file_time_end: ${inputs.file_time_end}

  # Runs once for the survey. mapping_dict is keyed per raw file name and each
  # extract_cal_params instance picks its own entry.
  - id: gen_cal_mapping
    op: generate_standardized_cal_mapping
    params:
      raw_input_folder: ${inputs.raw_input_folder}
      cal_input_folder: ${inputs.cal_input_folder}
      output_base: ${initial_setup.calibration_output_dir}
      cruise_id: ${inputs.cruise_id}
      record_author: ${inputs.record_author}
      short_filenames: true
      keep_unused: true
      conflict_resolution: "error"
      file_time_start: ${inputs.file_time_start}
      file_time_end: ${inputs.file_time_end}

  # Per-file fan-out: every step through processing_lvl_2_parallel.yaml shares
  # this map_over source, so each chain instance runs as one task. Never
  # checkpointed: the output is a temp_dir path deleted after the run.
  # No process-pool scheduler override: the work is network-bound.
  - id: read_raw
    op: read_raw_files
    map_over: ${initial_setup.raw_file_paths}
    checkpoint: never
    inputs:
      raw_file_paths:
        - ${_item}          # just this file
    params:
      sonar_model: ${inputs.sonar_model}
      include_bot: true
      intermediate_format: "zarr"

  # Opens this file's store as EchoData; not a fan-in. Not checkpointed: it would
  # re-upload what read_raw just wrote, and compute_sv downstream is checkpointed.
  - id: combine_raw
    op: combine_raw_files
    map_over: ${initial_setup.raw_file_paths}
    checkpoint: never
    inputs:
      raw_stores: ${read_raw.raw_stores}
    params:
      ping_time_chunk: ${inputs.ping_time_chunk}

  # Selects this file's calibration from the shared dicts. Without raw_file_path
  # every file would reuse the first file's channel mapping.
  - id: extract_cal_params
    op: extract_standardized_cal_params
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      calibration_dict: ${gen_cal_mapping.calibration_dict}
      mapping_dict: ${gen_cal_mapping.mapping_dict}
      echodata: ${combine_raw.echodata}
    params:
      raw_file_path: ${_item}
